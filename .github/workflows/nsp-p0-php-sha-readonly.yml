name: NSP P0 - production PHP SHA READ ONLY

on:
  push:
    branches:
      - audit/nsp-p0-live-php-sha-readonly-20261107
    paths:
      - tools/nsp-php-sha-readonly/request.json

permissions:
  contents: read

concurrency:
  group: nsp-php-sha-readonly
  cancel-in-progress: false

jobs:
  readonly-php-hash:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
      SSH_USER: ${{ secrets.DEPLOY_USER }}
      PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    steps:
      - name: Checkout request
        uses: actions/checkout@v4
      - name: Validate read-only owner scope
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$SSH_USER" && test -n "$KEY"
          python3 - <<'PY'
          import json
          with open("tools/nsp-php-sha-readonly/request.json",encoding="utf-8") as fh:
              request=json.load(fh)
          assert request == {"action":"sha256-only","owner_approval_issue":707,"file":"products-config.php","no_production_writes":True}
          print("OWNER_READONLY_SCOPE_PASS")
          PY
      - name: Read only actual hosting PHP SHA
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/nsp_p0_key
          chmod 600 ~/.ssh/nsp_p0_key
          ssh-keygen -y -P '' -f ~/.ssh/nsp_p0_key > /dev/null
          timeout 16s ssh-keyscan -T 8 -p "$PORT" -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          test -s ~/.ssh/known_hosts
          RESULT="$(timeout 35s ssh -p "$PORT" -i ~/.ssh/nsp_p0_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 "$SSH_USER@$HOST" 'set -eu; cd "$HOME/www/nastoronepodryadchika.ru"; test -f products-config.php && test ! -L products-config.php; sha256sum products-config.php')"
          export RESULT
          python3 - <<'PY'
          import json,os,re,pathlib
          result=os.environ["RESULT"].strip()
          match=re.fullmatch(r"([0-9a-f]{64})  products-config\.php",result)
          assert match, "REMOTE_RESULT_NOT_EXACT_SHA"
          record={"status":"READ_ONLY_PRODUCTION_PHP_SHA_PASS","site":"nastoronepodryadchika.ru","path":"products-config.php","sha256":match.group(1),"files_read":1,"production_writes":0,"php_content_exported":False,"owner_gate_issue":707}
          pathlib.Path("/tmp/nsp-php-sha-receipt.json").write_text(json.dumps(record,sort_keys=True)+"\n")
          print("READ_ONLY_PRODUCTION_PHP_SHA256="+match.group(1))
          print("READ_ONLY_PRODUCTION_PHP_SHA_PASS writes=0 files_read=1")
          PY
      - name: Upload hash-only evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nsp-php-sha-readonly-${{ github.run_id }}
          path: /tmp/nsp-php-sha-receipt.json
          retention-days: 30
