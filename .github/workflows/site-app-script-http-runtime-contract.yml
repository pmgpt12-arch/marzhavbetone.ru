name: Site app-script local HTTP runtime contract

on:
  pull_request:
    paths:
      - app-script.php
      - app.js
      - tools/check_app_script_http_runtime_contract.py
      - tools/test_app_script_http_runtime_contract.py
      - tools/reports/site-app-script-http-runtime-contract-20261012/passport.json
      - .github/workflows/site-app-script-http-runtime-contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-http-runtime-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify local PHP runtime exists
        run: php -n --version

      - name: Run HTTP contract regressions
        run: python -m unittest tools.test_app_script_http_runtime_contract -v

      - name: Verify localhost HTTP runtime contract
        id: contract
        shell: bash
        env:
          EVIDENCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set +e
          python tools/check_app_script_http_runtime_contract.py \
            --output tools/reports/site-app-script-http-runtime-contract-20261012
          status=$?
          recorded="$(tr -d '\r\n' < tools/reports/site-app-script-http-runtime-contract-20261012/exit.code)"
          if [ "$recorded" != "$status" ]; then
            echo "atomic exit receipt mismatch: recorded=$recorded actual=$status" >&2
            exit 97
          fi
          exit "$status"

      - name: Upload HTTP runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-app-script-http-runtime-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: tools/reports/site-app-script-http-runtime-contract-20261012/
          if-no-files-found: error
          retention-days: 30
