name: Post to Telegram

on:
  schedule:
    # ДВА ПРОГОНА В СУТКИ, А НЕ ДВАДЦАТЬ ЧЕТЫРЕ.
    #
    # Было `5 * * * *` — ежечасно. Замер 23.08.2026: у всех до одного
    # постов в `content/telegram/` время публикации 10:00 МСК, то есть
    # 07:00 UTC. Двадцать три прогона из двадцати четырёх не публиковали
    # ничего, но каждый оплачивался: GitHub округляет любое задание вверх
    # до минуты. К 23.08 набралось 413 прогонов — при бесплатном пределе
    # приватного репозитория в 2000 минут в месяц это заметная доля,
    # потраченная на «к публикации сейчас: 0».
    #
    # Реже безопасно, потому что публикатор берёт всё, чему срок уже
    # наступил (`publish_at <= now` в tools/post_telegram.py), а не только
    # наступивший в этот час. Пропущенный слот не теряет пост — его
    # заберёт следующий прогон.
    #
    # Второй прогон нужен не для частоты, а на случай, когда GitHub
    # пропускает задание по расписанию под нагрузкой: тогда пост уйдёт с
    # опозданием на часы, а не на сутки.
    - cron: '5 7 * * *'
    - cron: '5 15 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Пробный прогон: показать посты, ничего не публикуя'
        type: boolean
        default: true
      test_message:
        description: 'Проверочное сообщение: отправить этот текст в канал и выйти'
        type: string
        default: ''

concurrency:
  group: telegram
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      # Без токена workflow завершается зелёным и ничего не делает —
      # настройка описана в content/telegram/README.md
      - name: Check token
        id: check
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Секрет TELEGRAM_BOT_TOKEN не задан — публикация пропущена."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.check.outputs.enabled == 'true'
        uses: actions/checkout@v4

      # Токен, доступ к каналу и право публикации проверяем до отправки:
      # иначе причина отказа остаётся неочевидной
      - name: Check bot access
        if: steps.check.outputs.enabled == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT || '@marzhavbetone' }}
        run: python3 tools/post_telegram.py --check

      # Разовая проверка канала: отправляет заданный текст и на этом
      # заканчивает — очередь постов и published.json не затрагиваются
      - name: Send test message
        if: steps.check.outputs.enabled == 'true' && inputs.test_message != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT || '@marzhavbetone' }}
          # Текст передаётся переменной окружения, а не подстановкой в команду:
          # иначе содержимое поля выполнилось бы как часть shell-строки
          TEST_MESSAGE: ${{ inputs.test_message }}
        run: python3 tools/post_telegram.py --send-text "$TEST_MESSAGE"

      # Пробный прогон проверяет разметку и длину постов, ничего не отправляя
      - name: Dry run
        if: steps.check.outputs.enabled == 'true' && inputs.dry_run == true && inputs.test_message == ''
        run: python3 tools/post_telegram.py --dry-run

      - name: Publish due posts
        if: steps.check.outputs.enabled == 'true' && inputs.dry_run != true && inputs.test_message == ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT || '@marzhavbetone' }}
        run: python3 tools/post_telegram.py

      # Отметка об опубликованных постах возвращается в репозиторий, иначе
      # следующий запуск отправит их заново. [skip ci] — чтобы коммит не
      # запускал деплой и этот же workflow повторно.
      - name: Commit publication state
        if: steps.check.outputs.enabled == 'true' && inputs.dry_run != true && inputs.test_message == ''
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # Сначала add, потом сравнение с индексом: git diff не видит новых
          # файлов, а published.json создаётся впервые при первой публикации
          git add content/telegram/published.json
          if git diff --cached --quiet -- content/telegram/published.json; then
            echo "Новых публикаций нет — коммитить нечего"
            exit 0
          fi
          git commit -m 'Record published Telegram posts [skip ci]'
          for attempt in 1 2 3 4; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "Попытка $attempt не удалась, повтор через $((attempt * 3))с"
            sleep $((attempt * 3))
          done
          echo "::error::Не удалось сохранить отметку о публикации. Посты уже в канале — при следующем запуске они не уйдут повторно только после того, как published.json попадёт в репозиторий."
          exit 1
