name: NSP P8 read-only production master and cache audit
on:
  push:
    branches:
      - 'release/nsp-p8-live-audit-20261111'
    paths:
      - '.github/workflows/nsp-p8-live-audit-20261111.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 4
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
      SSH_USER: ${{ secrets.DEPLOY_USER }}
      KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      PORT: ${{ secrets.DEPLOY_PORT || '22' }}
    steps:
      - name: Read only actual P8 product configuration and hashes
        shell: bash
        run: |
          set -euo pipefail
          bash /home/denis/projects/nsp-qa19-p8-20261030/p8-brandfix-20261111/p8_readonly_audit.sh
