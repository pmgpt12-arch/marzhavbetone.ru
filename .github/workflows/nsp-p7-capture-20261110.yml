name: NSP P7 approved product read-only source snapshot
on:
  push:
    branches:
      - 'release/nsp-p7-capture-20261110'
    paths:
      - '.github/workflows/nsp-p7-capture-20261110.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
      SSH_USER: ${{ secrets.DEPLOY_USER }}
      KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      PORT: ${{ secrets.DEPLOY_PORT || '22' }}
    steps:
      - name: Capture current 13-file P7 buyer ZIP, read-only
        shell: bash
        run: |
          set -euo pipefail
          bash /home/denis/projects/nsp-qa19-p8-20261030/p7_readonly_capture_20261110.sh
