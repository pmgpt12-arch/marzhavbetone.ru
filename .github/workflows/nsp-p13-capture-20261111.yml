name: NSP P13 read-only current buyer product capture
on:
  push:
    branches:
      - 'release/nsp-p13-capture-20261111'
    paths:
      - '.github/workflows/nsp-p13-capture-20261111.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
      SSH_USER: ${{ secrets.DEPLOY_USER }}
      KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      PORT: ${{ secrets.DEPLOY_PORT || '22' }}
    steps:
      - name: Read production P13 buyer ZIP and validate expected 12-file set
        shell: bash
        run: |
          set -euo pipefail
          bash /home/denis/projects/nsp-qa19-p13-20261030/p13_readonly_capture_20261111.sh
