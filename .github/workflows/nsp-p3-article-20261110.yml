name: NSP P3 article branded-previews 2026-11-10
on:
  push:
    branches:
      - 'release/nsp-p3-article-20261110'
    paths:
      - '.github/workflows/nsp-p3-article-20261110.yml'
permissions:
  contents: read
concurrency:
  group: nsp-production-p3-article-20261110
  cancel-in-progress: false
jobs:
  publish:
    name: P3 approved article and four rebranded native previews
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 12
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
      SSH_USER: ${{ secrets.DEPLOY_USER }}
      KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      PORT: ${{ secrets.DEPLOY_PORT || '22' }}
    steps:
      - name: Content-SHA-gated P3 article-only release and external verification
        shell: bash
        run: |
          set -euo pipefail
          test -f /home/denis/projects/nsp-qa15-p3-20261030/p3-article-candidate-20261110/p3-article-release-20261110/run_publish.sh
          bash /home/denis/projects/nsp-qa15-p3-20261030/p3-article-candidate-20261110/p3-article-release-20261110/run_publish.sh
