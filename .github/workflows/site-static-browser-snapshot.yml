name: Static browser snapshot

on:
  pull_request:
    paths:
      - '**/*.html'
      - '**/*.php'
      - '**/*.css'
      - '**/*.js'
      - '**/*.svg'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.webp'
      - '**/*.ico'
      - 'tools/capture_static_browser_snapshot.py'
      - 'tools/test_static_browser_snapshot.py'
      - 'tools/reports/site-static-content-snapshot-20261012/report.json'
      - '.github/workflows/site-static-browser-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-snapshot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # P3 exact delta gate requires accepted baseline ancestry

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install browser harness
        timeout-minutes: 5
        run: |
          python3 -m pip install --quiet playwright pillow
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$browser" ]; then
            echo "BROWSER_SNAPSHOT_EXECUTABLE=$browser" >> "$GITHUB_ENV"
            "$browser" --version
          else
            timeout 240s python3 -m playwright install --with-deps chromium
          fi

      - name: Verify deterministic contract tests
        run: python3 -m unittest tools/test_static_browser_snapshot.py

      - name: Capture exact 88-page package
        env:
          EVIDENCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python3 tools/capture_static_browser_snapshot.py
          --staging-source
          --output browser-snapshot-artifact

      - name: Upload evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-browser-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: browser-snapshot-artifact/
          if-no-files-found: error
          retention-days: 14
