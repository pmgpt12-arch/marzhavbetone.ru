name: NSP P5 active v2 master verified correction 2026-11-10
on:
  push:
    branches:
      - 'release/nsp-p5-brandfix-20261110'
    paths:
      - '.github/workflows/nsp-p5-brandfix-20261110.yml'
permissions:
  contents: read
concurrency:
  group: nsp-production-p5-brandfix-20261110
  cancel-in-progress: false
jobs:
  publish:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 12
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
      SSH_USER: ${{ secrets.DEPLOY_USER }}
      KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      PORT: ${{ secrets.DEPLOY_PORT || '22' }}
    steps:
      - name: Verify and deploy P5 three metadata-only XLSX brand changes and SHA-pinned buyer ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f /home/denis/projects/nsp-qa19-p8-20261030/p5-brandfix-20261110/run_publish_product.sh
          bash /home/denis/projects/nsp-qa19-p8-20261030/p5-brandfix-20261110/run_publish_product.sh
