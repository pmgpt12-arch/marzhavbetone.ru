name: NSP P7 approved contract article and real product document previews
on:
  push:
    branches:
      - 'release/nsp-p7-article-20261111'
    paths:
      - '.github/workflows/nsp-p7-article-20261111.yml'
permissions:
  contents: read
concurrency:
  group: nsp-production-p7-article-20261111
  cancel-in-progress: false
jobs:
  publish:
    name: Atomic P7 article and 4 previews deployment
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 12
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
      SSH_USER: ${{ secrets.DEPLOY_USER }}
      KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      PORT: ${{ secrets.DEPLOY_PORT || '22' }}
    steps:
      - name: Publish approved P7 HTML and native previews with SHA rollback gate
        shell: bash
        run: |
          set -euo pipefail
          test -f /home/denis/projects/nsp-qa19-p8-20261030/p7-current-reference-20261110/p7-article-release-20261111/run_publish.sh
          bash /home/denis/projects/nsp-qa19-p8-20261030/p7-current-reference-20261110/p7-article-release-20261111/run_publish.sh
