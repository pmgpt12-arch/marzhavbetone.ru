# Живой аудит индексируемости: что боевой сайт отдаёт роботам.
#
# Зачем отдельным прогоном: из облачной сессии marzhavbetone.ru закрыт
# политикой сети (CONNECT 403), а раннер Actions до него достаёт. Проверки
# по файлам (check_seo.py) сверяют репозиторий с самим собой — этот прогон
# сверяет то, что реально отдаёт сервер: коды, редиректы, canonical в
# отданном HTML, ответы роботам Яндекса, Google и OpenAI.
#
# Чего прогон не показывает: состав индекса. «Страница в поиске или нет» —
# данные Вебмастера и Search Console, это отдельный слой.
name: Живой SEO-аудит

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seo-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Прогнать аудит
        run: |
          python3 tools/seo_live_audit.py \
            --out "content/metrics/seo-live-audit-$(date -u +%F).md"

      - name: Зафиксировать отчёт
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add content/metrics
          if git diff --cached --quiet; then
            echo 'Отчёта нет'
            exit 0
          fi
          git commit -m "Живой SEO-аудит за $(date -u +%F)"
          git push
