name: NSP hosting read-only audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-owner-test-order:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'fix/nsp-customer-route-20261022'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test read-only inspector and privacy boundary
        run: python3 -m unittest tools.test_owner_test_order_inspector
      - name: Corroborate existing service order without a new purchase
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PORT" =~ ^[0-9]+$ ]]
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/nsp_readonly_key
          chmod 600 ~/.ssh/nsp_readonly_key
          trap 'rm -f ~/.ssh/nsp_readonly_key' EXIT
          timeout 15s ssh-keyscan -T 8 -p "$PORT" -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          timeout 65s ssh -p "$PORT" -i ~/.ssh/nsp_readonly_key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 "$SSH_USER@$HOST" 'python3 - "$HOME/www/nastoronepodryadchika.ru"' < tools/inspect_owner_test_order.py | tee /tmp/nsp-owner-corroboration.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nsp-owner-corroboration-${{ github.run_id }}
          path: /tmp/nsp-owner-corroboration.json
          retention-days: 30
