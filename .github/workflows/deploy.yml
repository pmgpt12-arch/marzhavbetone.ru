      - name: Finalize superseded queued cancellation
        if: contains(github.event.head_commit.message, '[dry-run-r3-release]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for run_id in 39380017553 39380541045; do
            status=$(gh api repos/${{ github.repository }}/actions/runs/$run_id --jq .status)
            if [ "$status" != completed ]; then
              gh api -X POST repos/${{ github.repository }}/actions/runs/$run_id/force-cancel
            fi
          done
