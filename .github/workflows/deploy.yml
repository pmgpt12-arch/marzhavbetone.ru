name: NSP PR719 targeted HTML only
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply validated HTML-only patch (false = dry run)'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  html-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SITE_PATH: ${{ secrets.DEPLOY_PATH || 'www/marzhavbetone.ru' }}
      SSH_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      HOST: ${{ secrets.DEPLOY_HOST }}
      USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH without exposing secrets
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$USER" && test -n "$KEY"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -P '' -f ~/.ssh/deploy_key >/dev/null
          ssh-keyscan -p "$SSH_PORT" -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
      - name: Read production, patch, validate, backup and optionally upload
        env:
          APPLY: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          python3 tools/nsp_pr719_html_release.py
