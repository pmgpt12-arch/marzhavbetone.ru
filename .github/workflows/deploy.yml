    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.remaining_only == true) || (github.event_name == 'push' && github.ref_name == 'candidate/mb001-remaining-batch-r3-20261018' && (contains(github.event.head_commit.message, '[dry-run-r3-release]') || contains(github.event.head_commit.message, '[publish-r3-release]'))) }}
