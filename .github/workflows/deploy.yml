name: Deploy to server
on:
  workflow_dispatch:
    inputs:
      probe_only:
        description: 'Only check SSH connectivity and production path'
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  nsp-targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE_PATH: ${{ secrets.DEPLOY_PATH || 'www/marzhavbetone.ru' }}
      SSH_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
    steps:
      - name: Probe exact existing production SSH access
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$USER" && test -n "$KEY"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -P '' -f ~/.ssh/deploy_key >/dev/null
          ssh-keyscan -p "$SSH_PORT" -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -p "$SSH_PORT" "$USER@$HOST" "test -f '$SITE_PATH/katalog.html' && sha256sum '$SITE_PATH/katalog.html'" | sed 's# .*# [production katalog.html]#'
          echo 'SSH_PROBE_PASS'
