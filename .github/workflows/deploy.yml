  nsp-seo-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read-only audit of new-site SEO signals
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/seo_key
          chmod 600 ~/.ssh/seo_key
          ssh-keyscan -T 8 -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/seo_key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=12 "$USER@$HOST" 'sh -s' <<'REMOTE'
          set -eu
          root="$HOME/www/nastoronepodryadchika.ru"
          old="$HOME/www/marzhavbetone.ru"
          for file in sitemap.xml robots.txt index.html; do
            if test -f "$root/$file"; then
              echo "NEW_$file=PRESENT"
              printf 'OLD_DOMAIN_REFERENCES_%s=' "$file"
              grep -o 'marzhavbetone.ru' "$root/$file" | wc -l || true
              printf 'NEW_DOMAIN_REFERENCES_%s=' "$file"
              grep -o 'nastoronepodryadchika.ru' "$root/$file" | wc -l || true
            else echo "NEW_$file=MISSING"; fi
          done
          echo 'NEW_HOME_CANONICAL'
          grep -m 1 'rel="canonical"' "$root/index.html" || true
          echo 'NEW_ROBOTS_SITEMAP'
          grep '^Sitemap:' "$root/robots.txt" || true
          echo 'OLD_SITE_REDIRECT_RULES'
          grep -nE 'RewriteRule|Redirect 301' "$old/.htaccess" | head -12 || true
          echo 'NEW_SITEMAP_URL_COUNT'
          grep -c '<loc>' "$root/sitemap.xml" || true
          REMOTE
          for url in 'https://marzhavbetone.ru/articles/' 'https://nastoronepodryadchika.ru/articles/' 'https://nastoronepodryadchika.ru/sitemap.xml'; do
            echo "HTTP_CHECK=$url"
            curl -sS -I --connect-timeout 5 --max-time 10 "$url" | grep -Ei '^HTTP/|^location:' | head -5 || true
          done

  nsp-seo-url-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate every new sitemap URL and inspect robots
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/seo_check_key
          chmod 600 ~/.ssh/seo_check_key
          ssh-keyscan -T 8 -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/seo_check_key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=12 "$USER@$HOST" 'sh -s' <<'REMOTE'
          set -eu
          root="$HOME/www/nastoronepodryadchika.ru"
          echo 'ROBOTS_CONTENT_START'
          cat "$root/robots.txt"
          echo 'ROBOTS_CONTENT_END'
          echo 'OLD_DOMAIN_INDEX_REFERENCES'
          grep -n 'marzhavbetone.ru' "$root/index.html" | head -5 || true
          REMOTE
          python3 - <<'PY'
          import urllib.request,urllib.error,xml.etree.ElementTree as ET,concurrent.futures,collections
          root='https://nastoronepodryadchika.ru'
          req=urllib.request.Request(root+'/sitemap.xml',headers={'User-Agent':'NSP-Migration-Audit/1.0'})
          with urllib.request.urlopen(req,timeout=15) as r: xml=r.read()
          doc=ET.fromstring(xml)
          urls=[n.text.strip() for n in doc.findall('.//{*}loc') if n.text]
          print('SITEMAP_URLS='+str(len(urls)))
          print('SITEMAP_NEW_DOMAIN_ONLY='+str(all(u.startswith(root+'/') for u in urls)))
          def check(url):
            try:
              with urllib.request.urlopen(urllib.request.Request(url,method='HEAD'),timeout=10) as r:return (url,r.status,r.geturl())
            except urllib.error.HTTPError as e:return (url,e.code,url)
            except Exception as e:return (url,'ERROR_'+type(e).__name__,url)
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool: results=list(pool.map(check,urls))
          counts=collections.Counter(str(x[1]) for x in results)
          print('SITEMAP_HTTP_COUNTS='+repr(dict(counts)))
          bad=[x for x in results if x[1]!=200 or not x[2].startswith(root+'/')]
          print('SITEMAP_BAD_COUNT='+str(len(bad)))
          for url,code,target in bad[:15]: print('BAD_URL='+url+' STATUS='+str(code)+' TARGET='+target)
          if bad or not urls or any(not u.startswith(root+'/') for u in urls):raise SystemExit(2)
          print('SITEMAP_URL_ACCEPTANCE=PASS')
          PY

  nsp-remove-seo-staging-block:
    if: ${{ github.ref_name == 'audit/nsp-hosting-readonly-20261020' && inputs.seo_remove_staging_block == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fix robots and remove obsolete migration banner
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/seo_fix_key
          chmod 600 ~/.ssh/seo_fix_key
          ssh-keyscan -T 8 -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/seo_fix_key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=12 "$USER@$HOST" 'sh -s' <<'REMOTE'
          set -eu
          root="$HOME/www/nastoronepodryadchika.ru"
          private="$HOME/nsp-migration-private"
          robots="$root/robots.txt"
          index="$root/index.html"
          test -s "$robots" && test -s "$index"
          if grep -Fqx 'Disallow: /' "$robots"; then
            test "$(wc -l < "$robots")" -eq 2
            grep -Fqx 'User-agent: *' "$robots"
            test ! -e "$private/backup-robots-before-seo-20261021.txt"
            umask 077
            cp -p "$robots" "$private/backup-robots-before-seo-20261021.txt"
            chmod 600 "$private/backup-robots-before-seo-20261021.txt"
            temp="$(mktemp "$root/.robots-next-XXXXXX")"
            printf 'User-agent: *\nAllow: /\nSitemap: https://nastoronepodryadchika.ru/sitemap.xml\n' > "$temp"
            chmod 644 "$temp"
            mv "$temp" "$robots"
            echo 'ROBOTS_CRAWLING_ENABLED'
          else
            grep -Fqx 'Sitemap: https://nastoronepodryadchika.ru/sitemap.xml' "$robots"
            test ! "$(grep -Fc 'Disallow: /' "$robots")" -gt 0
            echo 'ROBOTS_ALREADY_CORRECT'
          fi
          if grep -Fq 'data-nsp-staging="true"' "$index"; then
            test ! -e "$private/backup-index-before-seo-20261021.html"
            umask 077
            cp -p "$index" "$private/backup-index-before-seo-20261021.html"
            chmod 600 "$private/backup-index-before-seo-20261021.html"
            temp="$(mktemp "$root/.index-next-XXXXXX")"
            php -r '
              $source=file_get_contents($argv[1]);
              $count=0;
              $out=preg_replace("~<div data-nsp-staging=\"true\"[^>]*>.*?</div>~s","",$source,1,$count);
              if($count!==1 || $out===null || strpos($out,"data-nsp-staging")!==false) exit(2);
              if(file_put_contents($argv[2],$out)===false) exit(3);
            ' "$index" "$temp"
            chmod 644 "$temp"
            mv "$temp" "$index"
            echo 'MIGRATION_BANNER_REMOVED'
          else
            echo 'MIGRATION_BANNER_ALREADY_ABSENT'
          fi
          grep -Fqx 'Sitemap: https://nastoronepodryadchika.ru/sitemap.xml' "$robots"
          test "$(grep -Fc 'Disallow: /' "$robots")" -eq 0
          test "$(grep -Fc 'data-nsp-staging="true"' "$index")" -eq 0
          grep -Fq 'rel="canonical" href="https://nastoronepodryadchika.ru/"' "$index"
          echo 'NSP_SEO_STAGING_REMOVAL=VERIFIED'
          REMOTE
      - name: Verify public SEO endpoints
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 5 --max-time 12 https://nastoronepodryadchika.ru/robots.txt -o /tmp/nsp-robots.txt
          grep -Fqx 'Sitemap: https://nastoronepodryadchika.ru/sitemap.xml' /tmp/nsp-robots.txt
          ! grep -Fqx 'Disallow: /' /tmp/nsp-robots.txt
          curl -fsS --connect-timeout 5 --max-time 12 https://nastoronepodryadchika.ru/ -o /tmp/nsp-index.html
          ! grep -Fq 'data-nsp-staging="true"' /tmp/nsp-index.html
          echo 'PUBLIC_SEO_STAGING_REMOVAL=PASS'

  deploy:
    if: ${{ github.ref_name == 'main' && !contains(github.event.head_commit.message, '[skip deploy]') && (github.event_name != 'workflow_dispatch' || (inputs.remaining_only != true && inputs.p3_only != true && inputs.p11_only != true && inputs.p5_only != true && inputs.t2_review_export != true && inputs.t2_only != true && inputs.t2_link_probe != true && inputs.t3_only != true && inputs.t3_link_probe != true)) }}
    runs-on: ubuntu-latest
    steps:
      # Пока секреты не заданы, workflow завершается зелёным и ничего не делает —
      # инструкция по настройке в DEPLOY.md
      - name: Check deploy secrets
        id: check
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          missing=""
          [ -z "$KEY" ] && missing="$missing DEPLOY_SSH_KEY"
          [ -z "$HOST" ] && missing="$missing DEPLOY_HOST"
          [ -z "$USER" ] && missing="$missing DEPLOY_USER"
          if [ -n "$missing" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Деплой пропущен — не заданы секреты:$missing. Настройка описана в DEPLOY.md"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.check.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          # Глубина 2 — ради IndexNow: список изменённых страниц берётся
          # диффом HEAD~1..HEAD, а при глубине 1 родителя в клоне нет и
          # дифф всегда пуст — уведомление молчало бы, не сообщая об этом.
          fetch-depth: 2

      # Гейт стоит до SSH намеренно: битая ссылка не должна доехать до сервера
      # даже при исправных секретах. Прогон в checks.yml идёт параллельно
      # деплою и остановить его не может — этот шаг может.
      - name: Целостность ссылок (гейт выкладки)
        run: |
          python3 tools/link_audit.py --verify
          python3 tools/test_link_audit.py

      - name: Set up SSH
        if: steps.check.outputs.enabled == 'true'
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          # tr -d '\r' — ключ, скопированный из Блокнота Windows, приходит с
          # переносами CRLF, которые OpenSSH не принимает
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Секрет должен быть приватным ключом без пароля. Заодно выводим
          # публичную часть: её нужно сверить с authorized_keys на хостинге.
          if ! ssh-keygen -y -P '' -f ~/.ssh/deploy_key > ~/.ssh/deploy_key.pub 2>/tmp/keyerr; then
            echo "Ответ ssh-keygen: $(cat /tmp/keyerr)"
            echo "::error::Секрет DEPLOY_SSH_KEY не читается как приватный ключ. Скопируйте файл deploy_key целиком (вместе со строками BEGIN/END), без пароля на ключ, и не перепутайте с deploy_key.pub."
            exit 1
          fi
          echo "Ключ из секрета прочитан, отпечаток:"
          ssh-keygen -l -f ~/.ssh/deploy_key.pub
          echo ""
          echo "Публичная часть этого ключа — ровно эта строка должна лежать"
          echo "в ~/.ssh/authorized_keys на хостинге (одной строкой, без переносов):"
          echo "---8<---"
          cat ~/.ssh/deploy_key.pub
          echo "--->8---"

          if ! ssh-keyscan -p "$SSH_PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
            echo "::error::Не удалось получить SSH-ключ хоста $HOST:$SSH_PORT — проверьте DEPLOY_HOST и DEPLOY_PORT"
            exit 1
          fi
          if ! grep -q . ~/.ssh/known_hosts; then
            echo "::error::Хост $HOST:$SSH_PORT не отвечает по SSH. На виртуальном хостинге SSH-доступ включается в панели reg.ru (Доступы)."
            exit 1
          fi

      # Проверяем связь и целевые папки ДО заливки: rsync/lftp работают с
      # --delete, и ошибка в пути стёрла бы чужие файлы. Сайт опознаём по
      # index.html — заливаем только туда, где он уже лежит.
      - name: Preflight checks
        id: preflight
        if: steps.check.outputs.enabled == 'true'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          # IdentitiesOnly=yes — проверяем именно наш ключ, без подстановки
          # других идентификаторов (иначе результат может быть ложным)
          ssh_run() {
            ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -p "$SSH_PORT" \
                -o BatchMode=yes -o ConnectTimeout=20 "$USER@$HOST" "$@"
          }

          if ! ssh_run 'echo ok' >/dev/null 2>/tmp/ssherr; then
            echo "Ответ сервера:"
            cat /tmp/ssherr
            if grep -q 'Permission denied' /tmp/ssherr; then
              echo ""
              echo "Сервер доступен, но отклонил ключ — значит его публичной части"
              echo "нет в ~/.ssh/authorized_keys на хостинге (или она записана с"
              echo "переносом строки/лишними символами). Сверьте строку, выведенную"
              echo "выше в шаге «Set up SSH», с содержимым файла на хостинге:"
              echo "  ISPmanager → Менеджер файлов → включить показ скрытых файлов"
              echo "  → папка .ssh → файл authorized_keys"
            fi
            echo "::error::Не удалось подключиться по SSH как $USER@$HOST:$SSH_PORT — подробности выше."
            exit 1
          fi
          echo "SSH-подключение: ок"

          if ! ssh_run "test -d '$SITE_PATH'"; then
            echo "::error::На хостинге нет папки '$SITE_PATH' (путь считается от домашней папки $USER). Задайте секрет DEPLOY_PATH с верным путём."
            exit 1
          fi

          if ! ssh_run "test -f '$SITE_PATH/index.html'"; then
            echo "::error::В '$SITE_PATH' нет index.html — не похоже на корень сайта. Деплой остановлен, чтобы не удалить чужие файлы. Проверьте секрет DEPLOY_PATH."
            exit 1
          fi
          echo "Папка сайта: $SITE_PATH — ок"

          ssh_run "mkdir -p '$PRODUCTS_PATH'"
          echo "Папка продуктов: $PRODUCTS_PATH — ок"

          # На shared-хостинге rsync может отсутствовать — тогда льём по SFTP
          if ssh_run 'command -v rsync' >/dev/null 2>&1; then
            echo "tool=rsync" >> "$GITHUB_OUTPUT"
            echo "Способ заливки: rsync"
          else
            echo "tool=lftp" >> "$GITHUB_OUTPUT"
            echo "Способ заливки: lftp/SFTP (на сервере нет rsync)"
          fi

      - name: Install lftp
        if: steps.check.outputs.enabled == 'true' && steps.preflight.outputs.tool == 'lftp'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # Фид для Дзена собирается из статей при каждом деплое — так он не
      # может разойтись с сайтом. Ошибка сборки останавливает деплой.
      - name: Build RSS feed for Dzen
        if: steps.check.outputs.enabled == 'true'
        run: python3 tools/build_rss.py

      # config.php и orders/ исключены: боевые ключи ЮКассы и данные заказов
      # живут только на сервере. Исключённое --delete не трогает.
      - name: Deploy site files
        if: steps.check.outputs.enabled == 'true'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          TOOL: ${{ steps.preflight.outputs.tool }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          EXCLUDES=(
            '.git*' '.github' '.claude' 'orders' 'products-storage' 'config.php'
            '.well-known' 'setup-server.sh' 'check-server.sh'
            'nginx-marzhavbetone.conf' 'DEPLOY.md' 'CLAUDE.md' 'tools' 'content'
            '__pycache__' 'ИНСТРУКЦИЯ-ДЛЯ-ХОСТИНГА.txt'
          )

          if [ "$TOOL" = "rsync" ]; then
            args=(-az --delete --itemize-changes)
            [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
            for e in "${EXCLUDES[@]}"; do args+=(--exclude "$e"); done
            rsync "${args[@]}" \
              -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -p $SSH_PORT" \
              ./ "$USER@$HOST:$SITE_PATH/"
          else
            mirror_args="--reverse --delete --verbose --parallel=4"
            [ "$DRY_RUN" = "true" ] && mirror_args="$mirror_args --dry-run"
            for e in "${EXCLUDES[@]}"; do
              mirror_args="$mirror_args --exclude-glob $e"
            done
            lftp -c "
              set sftp:connect-program 'ssh -a -x -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -p $SSH_PORT';
              set net:max-retries 2;
              open sftp://$USER@$HOST;
              mirror $mirror_args ./ '$SITE_PATH/';
            "
          fi

      # Файлы продуктов лежат ВНЕ webroot — скачать их напрямую нельзя,
      # выдачу покупателям делает download.php (PRODUCTS_DIR в config.php)
      - name: Deploy product files (outside webroot)
        if: steps.check.outputs.enabled == 'true'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          TOOL: ${{ steps.preflight.outputs.tool }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$TOOL" = "rsync" ]; then
            args=(-az --delete)
            [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
            rsync "${args[@]}" \
              -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -p $SSH_PORT" \
              products-storage/ "$USER@$HOST:$PRODUCTS_PATH/"
          else
            mirror_args="--reverse --delete --parallel=4"
            [ "$DRY_RUN" = "true" ] && mirror_args="$mirror_args --dry-run"
            lftp -c "
              set sftp:connect-program 'ssh -a -x -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -p $SSH_PORT';
              set net:max-retries 2;
              open sftp://$USER@$HOST;
              mirror $mirror_args products-storage/ '$PRODUCTS_PATH/';
            "
          fi

      # ГЕЙТ АВТОВЫДАЧИ. Мастера продуктов только что залиты в PRODUCTS_PATH —
      # вне webroot. Отсюда их должен найти products-config.php, иначе после
      # оплаты архив не соберётся: mvb_build_product_zip() вернёт null, ссылок
      # не будет, письмо не уйдёт. Деньги списаны, товар не выдан, и узнаем мы
      # об этом от покупателя.
      #
      # Проверяется здесь, а не в CI: verify_delivery_zips.php собирает все
      # восемнадцать архивов и проходит, потому что в прогоне CI
      # products-storage лежит рядом с сайтом. Боевая раскладка другая, и
      # измерить её можно только на боевом сервере.
      #
      # Список путей повторяет mvb_products_dir_candidates() из
      # products-config.php. Расхождение этих двух списков само по себе —
      # дефект: тогда гейт зелёный, а выдача сломана.
      - name: Мастера продуктов видны сайту (гейт автовыдачи)
        if: steps.check.outputs.enabled == 'true' && inputs.dry_run != true
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh_run() {
            ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -p "$SSH_PORT" \
                -o BatchMode=yes -o ConnectTimeout=20 "$USER@$HOST" "$@"
          }

          # Сначала — доехало ли вообще хоть что-то. Пустая папка мастеров
          # означает, что выдавать после оплаты нечего.
          if ! ssh_run "find '$PRODUCTS_PATH' -mindepth 2 -type f -print -quit 2>/dev/null | grep -q ."; then
            echo "::error::В '$PRODUCTS_PATH' на сервере нет файлов продуктов — после оплаты собирать архив не из чего."
            exit 1
          fi
          echo "Мастера на сервере: есть"

          # Теперь — найдёт ли их сайт. Явный define в config.php старше
          # поиска: он объявлен владельцем и может указывать куда угодно.
          verdict=$(ssh_run "
            target=\$(cd '$PRODUCTS_PATH' 2>/dev/null && pwd -P) || exit 0
            if grep -q \"define('PRODUCTS_DIR'\" '$SITE_PATH/config.php' 2>/dev/null; then
              echo define; exit 0
            fi
            for c in '$SITE_PATH/../../products-marzhavbetone' \
                     '$SITE_PATH/../products-marzhavbetone' \
                     '$SITE_PATH/products-storage'; do
              [ -d \"\$c\" ] || continue
              [ \"\$(cd \"\$c\" && pwd -P)\" = \"\$target\" ] && { echo candidate; exit 0; }
            done
            echo none
          ")

          case "$verdict" in
            define)
              echo "config.php задаёт PRODUCTS_DIR явно — выдача берёт путь оттуда." ;;
            candidate)
              echo "Залитая папка мастеров совпала с той, что ищет products-config.php." ;;
            *)
              echo "::error::Мастера лежат в '$PRODUCTS_PATH', но сайт их там не ищет, и PRODUCTS_DIR в config.php не задан. После оплаты архив не соберётся. Допишите в config.php на сервере строку: define('PRODUCTS_DIR', '<полный путь к $PRODUCTS_PATH>');"
              exit 1 ;;
          esac

      # Проверяется не «сайт жив», а «сайт отдаёт то, что мы залили». Разница
      # стоила разбора 14.08.2026: деплой отчитался успехом, шаг проверял
      # только код ответа, и владелец полчаса смотрел на старую страницу,
      # пока выяснялось, что правка вообще не в main. Код 200 отдаёт и
      # версия недельной давности.
      #
      # Меткой служит версия стилей: `tools/asset_versions.py` вписывает в
      # HTML восемь знаков sha1 от содержимого файла, то есть метка меняется
      # ровно тогда, когда меняется сборка.
      - name: Verify deployed content
        if: steps.check.outputs.enabled == 'true' && inputs.dry_run != true
        run: |
          expected=$(grep -o 'styles\.css?v=[0-9a-f]\{8\}' index.html | head -1)
          if [ -z "$expected" ]; then
            echo "::error::В index.html нет версии styles.css — прогоните tools/asset_versions.py --write"
            exit 1
          fi
          echo "Ожидаем на боевой странице: $expected"

          # HTML отдаётся с max-age=3600, поэтому запрашиваем без кеша и даём
          # серверу время: пять попыток с нарастающей паузой, суммарно ~2,5 мин.
          for attempt in 1 2 3 4 5; do
            body=$(curl -s --max-time 30 \
                     -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
                     -w '\n%{http_code}' https://marzhavbetone.ru/ || true)
            code=$(printf '%s' "$body" | tail -n1)
            echo "попытка $attempt: HTTP $code"
            if [ "$code" = "200" ] && printf '%s' "$body" | grep -qF "$expected"; then
              echo "Боевая страница отдаёт свежую сборку ($expected)."
              exit 0
            fi
            sleep $((attempt * 15))
          done

          echo "::error::Сайт отвечает, но отдаёт не ту сборку: в HTML нет $expected. Залитое не доехало до выдачи — проверьте кеш сервера и путь заливки"
          exit 1

      # ЗАКАЗЫ И МАСТЕРА ТОВАРОВ НЕ ОТДАЮТСЯ ВЕБОМ. Проверяется на боевом
      # сервере, потому что нигде больше это не проверяемо: правило живёт в
      # .htaccess, а .htaccess исполняет только настоящий Apache. Локальный
      # прогон подтверждает наличие правила, а не его срабатывание.
      #
      # ЗАЧЕМ ПРОБНЫЙ ФАЙЛ, А НЕ ТОЛЬКО КАТАЛОГ. Код 403 на `/orders/` можно
      # получить просто оттого, что листинг выключен, — при том что файл
      # внутри отдаётся прекрасно. А в файле заказа лежат почта, телефон и
      # токен выдачи оплаченного товара. Поэтому кладём заведомо безобидный
      # файл и просим именно его.
      #
      # Файл убирается всегда, в том числе когда проверка падает.
      - name: Заказы недоступны с боевого сервера
        if: steps.check.outputs.enabled == 'true' && inputs.dry_run != true
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          # Имена переменных латиницей намеренно: bash не принимает кириллицу
          # в именах — `proba=x` кириллицей превращается в «command not found»,
          # и шаг падал бы на ровном месте уже в боевом деплое.
          ssh_run() {
            ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -p "$SSH_PORT" \
                -o BatchMode=yes -o ConnectTimeout=20 "$USER@$HOST" "$@"
          }
          probe="security-probe-$(date -u +%s)-$RANDOM.json"
          cleanup() { ssh_run "rm -f '$SITE_PATH/orders/$probe'" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          # Ни персональных данных, ни рабочего токена: файл ничего не стоит,
          # даже если его кто-то успеет прочитать.
          ssh_run "mkdir -p '$SITE_PATH/orders' && printf '%s' '{\"probe\":\"OUTBOX-LEAK-CANARY\",\"pii\":\"none\"}' > '$SITE_PATH/orders/$probe'"

          failures=0
          check_path() {
            path="$1"
            body=$(curl -s --max-time 30 -w '\n%{http_code}' "https://marzhavbetone.ru$path" || true)
            code=$(printf '%s' "$body" | tail -n1)
            echo "  $path -> HTTP $code (ждём 403 или 404)"
            case "$code" in
              403|404) ;;
              *) echo "::error::$path отвечает $code, а обязан 403 или 404"; failures=$((failures+1)) ;;
            esac
            if printf '%s' "$body" | grep -qF 'OUTBOX-LEAK-CANARY'; then
              echo "::error::$path ОТДАЛ содержимое файла — заказы доступны из веба"
              failures=$((failures+1))
            fi
          }

          check_path "/orders/"
          check_path "/orders/$probe"
          check_path "/products-storage/"

          if [ "$failures" -ne 0 ]; then
            echo "::error::P0: каталог заказов или мастеров товаров доступен из веба. Это утечка персональных данных и токенов выдачи."
            exit 1
          fi
          echo "Заказы и мастера товаров закрыты."

      # IndexNow: сказать Яндексу, какие адреса изменились, не дожидаясь
      # планового обхода. Ключ публичен по протоколу — он подтверждается
      # файлом в корне сайта, секретом не является. Ошибка уведомления
      # деплой не валит: индексация — не условие выкладки.
      - name: Notify IndexNow
        if: steps.check.outputs.enabled == 'true' && inputs.dry_run != true
        continue-on-error: true
        run: |
          key="07e706758d2b3889c5bf9c7b3760d86d"
          urls=$(git diff --name-only HEAD~1 HEAD 2>/dev/null                  | grep -E '^(articles/.*\.html|products/.*\.html|materialy/.*\.html|index\.html|kalkulyator\.html)$'                  | sed 's|^index.html$||; s|^|https://marzhavbetone.ru/|' | head -50)
          if [ -z "$urls" ]; then echo "изменённых страниц нет"; exit 0; fi
          list=$(printf '%s' "$urls" | python3 -c 'import sys,json; print(json.dumps([u for u in sys.stdin.read().split() if u]))')
          payload=$(printf '{"host":"marzhavbetone.ru","key":"%s","urlList":%s}' "$key" "$list")
          code=$(curl -s -o /tmp/indexnow.out -w '%{http_code}'                  -X POST 'https://yandex.com/indexnow'                  -H 'Content-Type: application/json; charset=utf-8'                  -d "$payload")
          echo "IndexNow → HTTP $code"; cat /tmp/indexnow.out || true

  deploy-p3-only:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.p3_only == true }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 12
    steps:
      - name: Use verified local P3 worktree
        run: |
          test "$GITHUB_REF_NAME" = "release/mb001-p3-20261016"
          test "$(git -C /home/denis/projects/mb001-p3-release-20261016 rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git -C /home/denis/projects/mb001-p3-release-20261016 status --porcelain)"
      - name: Verify exact P3 candidate
        working-directory: /home/denis/projects/mb001-p3-release-20261016
        run: |
          test "$GITHUB_REF_NAME" = "release/mb001-p3-20261016"
          test "$(git rev-parse HEAD:products-storage/05-ks-bez-vozvrata)" = "00aca2f4e4163f39e329f4dd14e5b23a813d448e"
          python3 tools/check_p3_current_site_delta.py > /dev/null
          php -l products-config.php
          php -r 'define("ORDERS_DIR",sys_get_temp_dir()); require "products-config.php"; exit(mvb_products()["p3"]["price"] === 1790000 ? 0 : 3);'
          bash -n tools/release_p3_only.sh
      - name: Prepare GitHub deploy SSH
        env:
          HOME: ${{ runner.temp }}/p3-sandbox
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          test -n "$KEY" && test -n "$HOST" && test -n "$USER" || exit 1
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -P '' -f ~/.ssh/deploy_key > ~/.ssh/deploy_key.pub
          for attempt in 1 2; do
            if ssh-keyscan -T 10 -p "$SSH_PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
              break
            fi
            echo "SSH_HOST_KEY_NETWORK_RETRY attempt=$attempt" >&2
            sleep 2
          done
          test -s ~/.ssh/known_hosts || { echo "::error::SSH_HOST_KEY_UNAVAILABLE"; exit 23; }
      - name: Execute scoped P3 operation
        working-directory: /home/denis/projects/mb001-p3-release-20261016
        env:
          HOME: ${{ runner.temp }}/p3-sandbox
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          P3_ONLY: 'true'
          DRY_RUN: ${{ inputs.dry_run }}
        run: bash tools/release_p3_only.sh
      - name: Remove job-scoped SSH credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/p3-sandbox/.ssh/deploy_key" "$RUNNER_TEMP/p3-sandbox/.ssh/deploy_key.pub"
          rm -f "$RUNNER_TEMP/p3-sandbox/.ssh/known_hosts"

