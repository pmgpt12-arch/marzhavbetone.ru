name: Deploy to server

on:
  push:
    branches: [main, candidate/mb001-remaining-batch-r3-20261018]
  # Ежедневно 09:00 МСК. Фид собирается на каждом деплое и отдаёт только те
  # статьи, которым пришёл срок (RELEASE в tools/build_rss.py). Без прогона
  # по расписанию очередная статья появилась бы в ленте не в свой день, а
  # при следующей правке репозитория — то есть когда придётся.
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      seo_remove_staging_block:
        description: 'Fix live robots and remove migration banner'
        type: boolean
        default: false
      webmaster_register_new_domain:
        description: 'Register new domain in Yandex Webmaster API'
        type: boolean
        default: false
      activate_nsp_payment_endpoints:
        description: 'Activate new-domain payment endpoints only, with rollback'
        type: boolean
        default: false
      remaining_only:
        description: "Адресный выпуск согласованной линейки R3"
        type: boolean
        default: false
      dry_run:
        description: 'Пробный прогон: показать изменения, ничего не заливать'
        type: boolean
        default: false
      p3_only:
        description: 'Адресный P3, без остальных товаров'
        type: boolean
        default: false
      p11_only:
        description: 'Адресный выпуск P11'
        type: boolean
        default: false
      p5_only:
        description: 'Адресный выпуск P5+P12 R6'
        type: boolean
        default: false
      t2_only:
        description: 'Адресный выпуск T2 R2'
        type: boolean
        default: false
      t3_link_probe:
        description: 'Проверка часовой ссылки T3 без оплаты'
        type: boolean
        default: false
      t3_only:
        description: 'Адресное исправление T3 R2'
        type: boolean
        default: false
      t2_link_probe:
        description: 'Проверка часовой ссылки T2 без оплаты'
        type: boolean
        default: false
      t2_review_export:
        description: 'Только архив кандидата T2 для проверки'
        type: boolean
        default: false

concurrency:
  group: ${{ contains(github.event.head_commit.message, '[dry-run-r3-release]') && 'deploy-r3-recovery' || 'deploy' }}
  cancel-in-progress: false

env:
  # Пути по умолчанию — под виртуальный хостинг reg.ru: домашняя папка
  # пользователя uXXXXXXX = /var/www/uXXXXXXX/data, сайт лежит в
  # ~/www/marzhavbetone.ru, файлы продуктов — в ~/products-marzhavbetone
  # (вне webroot, прямых ссылок нет). Переопределяются секретами.
  SITE_PATH: ${{ secrets.DEPLOY_PATH || 'www/marzhavbetone.ru' }}
  PRODUCTS_PATH: ${{ secrets.DEPLOY_PRODUCTS_PATH || 'products-marzhavbetone' }}
  SSH_PORT: ${{ secrets.DEPLOY_PORT || '22' }}

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect new domain without changes
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$USER" && test -n "$KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/nsp_audit_key
          chmod 600 ~/.ssh/nsp_audit_key
          ssh-keyscan -T 8 -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/nsp_audit_key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=12 "$USER@$HOST" 'sh -s' <<'REMOTE'
          set -eu
          site="$HOME/www/nastoronepodryadchika.ru"
          printf 'NEW_SITE_DIRECTORY='
          test -d "$site" && echo PRESENT || { echo MISSING; exit 1; }
          for f in index.html config.php payment.php webhook.php products-config.php; do
            if test -f "$site/$f"; then printf 'FILE_%s=PRESENT\n' "$f"; else printf 'FILE_%s=MISSING\n' "$f"; fi
          done
          if command -v php >/dev/null 2>&1; then
            for f in payment.php webhook.php products-config.php; do
              if test -f "$site/$f"; then
                if php -l "$site/$f" >/dev/null 2>&1; then echo "PHP_LINT_$f=PASS"; else echo "PHP_LINT_$f=FAIL"; fi
              fi
            done
          else
            echo 'PHP_CLI=UNAVAILABLE'
          fi
          printf 'CONFIG_PRESENT='
          test -s "$site/config.php" && echo YES || echo NO
          printf 'PRIVATE_PRODUCT_DIR='
          test -d "$HOME/products-marzhavbetone" && echo PRESENT || echo MISSING
          if php -l "$site/config.php" >/dev/null 2>&1; then echo 'PHP_LINT_config.php=PASS'; else echo 'PHP_LINT_config.php=FAIL'; fi
          if grep -q 'NSP_MIGRATION_STAGE' "$site/config.php"; then echo 'MIGRATION_FLAG=PRESENT'; else echo 'MIGRATION_FLAG=ABSENT'; fi
          if grep -q 'migration-disabled' "$site/config.php"; then echo 'PAYMENT_DISABLED_MARKER=PRESENT'; else echo 'PAYMENT_DISABLED_MARKER=ABSENT'; fi
          for dir in "$HOME/nsp-migration-private" "$HOME/products-marzhavbetone"; do
            if test -d "$dir" && test -r "$dir"; then echo "PRIVATE_DIR_ACCESS=READABLE"; else echo "PRIVATE_DIR_ACCESS=UNAVAILABLE"; fi
          done
          printf 'MIGRATION_PRIVATE_DIR='
          test -d "$HOME/nsp-migration-private" && echo PRESENT || echo MISSING
          REMOTE


  backup-nsp-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Backup current new-site config outside webroot
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$USER" && test -n "$KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/nsp_backup_key
          chmod 600 ~/.ssh/nsp_backup_key
          ssh-keyscan -T 8 -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/nsp_backup_key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=12 "$USER@$HOST" 'sh -s' <<'REMOTE'
          set -eu
          src="$HOME/www/nastoronepodryadchika.ru/config.php"
          dst="$HOME/nsp-migration-private/backup-config-before-yookassa-1502106-20261020.php"
          test -f "$src"
          if test -e "$dst"; then
            test -s "$dst"
            test "$(stat -c %a "$dst")" = 600
            cmp -s "$src" "$dst" || { echo 'BACKUP_EXISTS_WITH_DIFFERENT_CONTENT'; exit 1; }
          else
            umask 077
            cp -p "$src" "$dst"
            chmod 600 "$dst"
          fi
          test -s "$dst"
          cmp -s "$src" "$dst"
          test "$(stat -c %a "$dst")" = 600
          echo 'BACKUP_CONFIG=VERIFIED'
          echo 'BACKUP_OUTSIDE_WEBROOT=YES'
          REMOTE

  prepare-nsp-directories:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create protected order directories
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/audit_key
          chmod 600 ~/.ssh/audit_key
          ssh-keyscan -T 8 -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/audit_key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=12 "$USER@$HOST" 'sh -s' <<'REMOTE'
          set -eu
          root="$HOME/nsp-production-private"
          umask 077
          mkdir -p "$root/orders/delivery"
          chmod 700 "$root" "$root/orders" "$root/orders/delivery"
          test -w "$root/orders/delivery"
          test "$(stat -c %a "$root/orders/delivery")" = 700
          if command -v php >/dev/null 2>&1; then
            if php -r '$d=getenv("HOME")."/nsp-production-private/orders/delivery"; $f=tempnam($d,".probe-"); if ($f===false) exit(1); $ok=file_put_contents($f,"test")===4; unlink($f); exit($ok?0:1);' >/dev/null 2>&1; then echo 'PHP_CLI_WRITE=PASS'; else echo 'PHP_CLI_WRITE=FAIL'; fi
          else echo 'PHP_CLI_WRITE=UNAVAILABLE'; fi
          echo 'PHP_WEB_WRITE=NOT_TESTED'
          echo 'NSP_PRIVATE_DIRS_VERIFIED'
          REMOTE

  verify-nsp-secret:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check encrypted secret presence only
        env:
          SECRET: ${{ secrets.NSP_YOOKASSA_KEY }}
        run: |
          if [ -n "$SECRET" ]; then
            echo 'NSP_YOOKASSA_SECRET_PRESENT=YES'
          else
            echo 'NSP_YOOKASSA_SECRET_PRESENT=NO'
            exit 1
          fi

  nsp-php-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify PHP execution and migration state
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/audit_key
          chmod 600 ~/.ssh/audit_key
          ssh-keyscan -T 8 -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/audit_key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=12 "$USER@$HOST" 'sh -s' <<'REMOTE'
          set -eu
          site="$HOME/www/nastoronepodryadchika.ru"
          php -l "$site/config.php" >/dev/null
          php -l "$site/payment.php" >/dev/null
          php -l "$site/webhook.php" >/dev/null
          php -r 'require $argv[1]; echo "SITE_URL=".SITE_URL.PHP_EOL; echo "MODE=".YOOKASSA_MODE.PHP_EOL; echo "STAGE=".(defined("NSP_MIGRATION_STAGE")&&NSP_MIGRATION_STAGE?"YES":"NO").PHP_EOL;' "$site/config.php" 2>/dev/null
          test -d "$HOME/nsp-production-private/orders/delivery"
          echo 'NSP_PHP_PREFLIGHT=PASS'
          REMOTE

  nsp-stage-secret:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Stage YooKassa credential in private hosting directory
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          YK: ${{ secrets.NSP_YOOKASSA_KEY }}
        run: |
          set -euo pipefail
          test -n "$YK"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/audit_key
          chmod 600 ~/.ssh/audit_key
          ssh-keyscan -T 8 -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          umask 077
          printf '%s' "$YK" | ssh -i ~/.ssh/audit_key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=12 "$USER@$HOST" 'sh -c '"'"'set -eu; p="$HOME/nsp-production-private/yookassa-key"; test ! -e "$p" || { echo "KEY_ALREADY_PRESENT"; exit 0; }; umask 077; cat > "$p"; chmod 600 "$p"; test -s "$p"; echo "PRIVATE_YOOKASSA_KEY_STAGED"'"'"''

  nsp-live-config:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Activate YooKassa shop 1502106 with rollback backup
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 8 -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=12 "$USER@$HOST" 'sh -s' <<'REMOTE'
          set -eu
          site="$HOME/www/nastoronepodryadchika.ru"
          private="$HOME/nsp-production-private"
          config="$site/config.php"
          backup="$HOME/nsp-migration-private/backup-config-before-yookassa-1502106-20261020.php"
          test -s "$backup" && test -s "$private/yookassa-key"
          test -d "$private/orders/delivery"
          if grep -q "'1502106'" "$config" && grep -q "'live'" "$config"; then
            echo 'NSP_LIVE_CONFIG_ALREADY_SET'
            exit 0
          fi
          cmp -s "$config" "$backup" || { echo 'CONFIG_CHANGED_AFTER_BACKUP'; exit 1; }
          temp="$(mktemp "$site/.config-new-XXXXXX")"
          chmod 600 "$temp"
          trap 'rm -f "$temp"' EXIT
          php -r '
            $key=trim(file_get_contents($argv[1]));
            if ($key==="") exit(2);
            $values=[
              "SITE_URL"=>"https://nastoronepodryadchika.ru",
              "ADMIN_EMAIL"=>"marzhavbetone@yandex.ru",
              "ORDERS_DIR"=>$argv[2]."/orders",
              "DELIVERY_DIR"=>$argv[2]."/orders/delivery",
              "PRODUCTS_DIR"=>$argv[3],
              "DELIVERY_TTL_SECONDS"=>3600,
              "YOOKASSA_SHOP_ID"=>"1502106",
              "YOOKASSA_SECRET_KEY"=>$key,
              "YOOKASSA_MODE"=>"live",
              "YOOKASSA_API_URL"=>"https://api.yookassa.ru/v3"
            ];
            $out="<?php\ndeclare(strict_types=1);\n";
            foreach($values as $name=>$value) $out.="define(".var_export($name,true).",".var_export($value,true).");\n";
            if(file_put_contents($argv[4],$out,LOCK_EX)===false) exit(3);
          ' "$private/yookassa-key" "$private" "$HOME/products-marzhavbetone" "$temp"
          php -l "$temp" >/dev/null
          php -r 'require $argv[1]; if(YOOKASSA_SHOP_ID!=="1502106" || YOOKASSA_MODE!=="live" || !is_dir(ORDERS_DIR) || !is_dir(PRODUCTS_DIR)) exit(1);' "$temp"
          mv "$temp" "$config"
          chmod 600 "$config"
          trap - EXIT
          echo 'NSP_LIVE_CONFIG_APPLIED'
          REMOTE

  nsp-live-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify new-site live configuration and HTTP endpoints
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/verify_key
          chmod 600 ~/.ssh/verify_key
          ssh-keyscan -T 8 -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/verify_key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=12 "$USER@$HOST" 'sh -s' <<'REMOTE'
          set -eu
          site="$HOME/www/nastoronepodryadchika.ru"
          php -l "$site/config.php" >/dev/null
          php -r 'require $argv[1]; if(YOOKASSA_SHOP_ID!=="1502106"||YOOKASSA_MODE!=="live"||YOOKASSA_API_URL!=="https://api.yookassa.ru/v3"||!is_dir(ORDERS_DIR)||!is_dir(DELIVERY_DIR)||!is_dir(PRODUCTS_DIR)||DELIVERY_TTL_SECONDS!==3600) exit(1); echo "NSP_CONFIG_LIVE_VERIFIED\n";' "$site/config.php"
          for endpoint in payment.php webhook.php; do
            status="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "https://nastoronepodryadchika.ru/$endpoint" || true)"
            echo "NSP_HTTP_$endpoint=$status"
          done
          REMOTE

  nsp-post-cutover-check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check active configuration and HTTP responses
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/check_key
          chmod 600 ~/.ssh/check_key
          ssh-keyscan -T 8 -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/check_key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=12 "$USER@$HOST" 'sh -s' <<'REMOTE'
          set -eu
          file="$HOME/www/nastoronepodryadchika.ru/config.php"
          php -l "$file" >/dev/null
          php -r 'require $argv[1]; echo "SHOP_ID_MATCH=".(YOOKASSA_SHOP_ID==="1502106"?"YES":"NO").PHP_EOL; echo "MODE_LIVE=".(YOOKASSA_MODE==="live"?"YES":"NO").PHP_EOL; echo "STAGE_DISABLED=".(!defined("NSP_MIGRATION_STAGE")?"YES":"NO").PHP_EOL; echo "ORDERS_DIR_EXISTS=".(is_dir(ORDERS_DIR)?"YES":"NO").PHP_EOL; echo "DELIVERY_DIR_EXISTS=".(is_dir(DELIVERY_DIR)?"YES":"NO").PHP_EOL;' "$file"
          REMOTE
          for p in / /payment.php /webhook.php; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 12 "https://nastoronepodryadchika.ru$p" || true)
            echo "HTTP_$p=$status"
          done

  nsp-http503-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect site controls without exposing secrets
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/diag_key
          chmod 600 ~/.ssh/diag_key
          ssh-keyscan -T 8 -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/diag_key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=12 "$USER@$HOST" 'sh -s' <<'REMOTE'
          set -eu
          site="$HOME/www/nastoronepodryadchika.ru"
          echo 'HTACCESS_RULES'
          if test -f "$site/.htaccess"; then grep -nEi '503|maintenance|migration|payment|webhook|rewrite|deny|forbidden' "$site/.htaccess" | head -35 || true; else echo 'NO_HTACCESS'; fi
          echo 'PHP_ENDPOINT_STAT'
          stat -c '%n %a %U:%G' "$site/config.php" "$site/payment.php" "$site/webhook.php"
          echo 'ERROR_LOG_CANDIDATES'
          find "$HOME" -maxdepth 3 -type f \( -iname '*error*log*' -o -name 'php_error.log' \) -printf '%p\n' 2>/dev/null | head -20
          REMOTE

  nsp-enable-payment-endpoints:
    if: ${{ github.ref_name == 'audit/nsp-hosting-readonly-20261020' && inputs.activate_nsp_payment_endpoints == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove migration-only 503 rule with automatic rollback
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/nsp_ssh_key
          chmod 600 ~/.ssh/nsp_ssh_key
          ssh-keyscan -T 8 -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/nsp_ssh_key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=12 "$USER@$HOST" 'sh -s' <<'REMOTE'
          set -eu
          site="$HOME/www/nastoronepodryadchika.ru"
          file="$site/.htaccess"
          backup="$HOME/nsp-migration-private/backup-htaccess-before-payments-20261021"
          rule='RewriteRule ^(?:payment|webhook|check-payment|contact)\.php$ - [R=503,L]'
          test -f "$file"
          if ! grep -Fq "$rule" "$file"; then
            echo 'TEMPORARY_503_RULE_ABSENT'
            exit 0
          fi
          test "$(grep -Fc "$rule" "$file")" = 1
          if test -e "$backup"; then
            cmp -s "$file" "$backup" || { echo 'EXISTING_BACKUP_MISMATCH'; exit 1; }
          else
            umask 077
            cp -p "$file" "$backup"
            chmod 600 "$backup"
            cmp -s "$file" "$backup"
          fi
          tmp="$(mktemp "$site/.htaccess-next-XXXXXX")"
          trap 'rm -f "$tmp"' EXIT
          grep -Fv "$rule" "$file" > "$tmp"
          test "$(wc -l < "$file")" -eq "$(( $(wc -l < "$tmp") + 1 ))"
          chmod 644 "$tmp"
          mv "$tmp" "$file"
          trap - EXIT
          echo 'MIGRATION_503_RULE_REMOVED'
          REMOTE
      - name: Verify public payment endpoints or restore
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          failed=0
          for path in /payment.php /webhook.php; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 12 "https://nastoronepodryadchika.ru$path" || true)
            echo "ENDPOINT_$path=$code"
            case "$path:$code" in
              /payment.php:405|/webhook.php:400) ;;
              *) failed=1 ;;
            esac
          done
          if [ "$failed" = 0 ]; then echo 'PAYMENT_ENDPOINTS=VERIFIED'; exit 0; fi
          echo 'ENDPOINT_VERIFICATION_FAILED_ROLLBACK'
          ssh -i ~/.ssh/nsp_ssh_key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=12 "$USER@$HOST" 'sh -s' <<'REMOTE'
          set -eu
          file="$HOME/www/nastoronepodryadchika.ru/.htaccess"
          backup="$HOME/nsp-migration-private/backup-htaccess-before-payments-20261021"
          test -s "$backup"
          cp -p "$backup" "$file"
          chmod 644 "$file"
          echo 'HTACCESS_ROLLBACK_APPLIED'
          REMOTE
          exit 1

  nsp-one-ruble-checkout-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate test product and build its buyer archive
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/nsp_check_key
          chmod 600 ~/.ssh/nsp_check_key
          ssh-keyscan -T 8 -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/nsp_check_key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=12 "$USER@$HOST" 'sh -s' <<'REMOTE'
          set -eu
          site="$HOME/www/nastoronepodryadchika.ru"
          test -s "$site/test-pokupka.html"
          php -r '
            require $argv[1]."/config.php";
            require $argv[1]."/products-config.php";
            $p=mvb_products()["test1"]??null;
            if (!$p || (int)$p["price"]!==100) exit(2);
            echo "TEST_SKU_PRICE_100_KOPEKS=YES\n";
            if (!is_dir(PRODUCTS_DIR."/".$p["dir"])) exit(3);
            echo "TEST_PRODUCT_SOURCE=FOUND\n";
            if (!class_exists("ZipArchive")) exit(4);
            $zip=mvb_build_product_zip("test1");
            if (!$zip || !is_file($zip) || filesize($zip)===0) exit(5);
            $z=new ZipArchive();
            if ($z->open($zip)!==true || $z->numFiles===0) exit(6);
            echo "TEST_ARCHIVE=VERIFIED\n";
            $z->close();
            if (DELIVERY_TTL_SECONDS!==3600) exit(7);
            echo "DELIVERY_TTL_1_HOUR=YES\n";
          ' "$site"
          REMOTE
          for path in /test-pokupka.html /app-script.php /payment.php /webhook.php; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 12 "https://nastoronepodryadchika.ru$path" || true)
            echo "CHECK_$path=$code"
            case "$path:$code" in
              /test-pokupka.html:200|/app-script.php:200|/payment.php:405|/webhook.php:400) ;;
              *) exit 8 ;;
            esac
          done
          echo 'ONE_RUBLE_CHECKOUT_PREFLIGHT=PASS'

  nsp-buyer-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify recent paid test order without exposing buyer details
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/buyer_key
          chmod 600 ~/.ssh/buyer_key
          ssh-keyscan -T 8 -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/buyer_key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=12 "$USER@$HOST" 'sh -s' <<'REMOTE'
          set -eu
          site="$HOME/www/nastoronepodryadchika.ru"
          php -r '
            require $argv[1]."/config.php";
            $files=glob(ORDERS_DIR."/order_*.json")?:[];
            $matches=[];
            foreach ($files as $f) {
              $o=json_decode(file_get_contents($f),true);
              if (!is_array($o)) continue;
              $hasTest=false;
              foreach(($o["items"]??[]) as $item) if(($item["sku"]??"")==="test1") $hasTest=true;
              if($hasTest) $matches[]=$o;
            }
            usort($matches,fn($a,$b)=>strcmp($b["created_at"]??"",$a["created_at"]??""));
            echo "TEST_ORDER_COUNT=".count($matches)."\n";
            if(!$matches) exit(2);
            $o=$matches[0];
            echo "LATEST_TEST_STATUS=".($o["status"]??"MISSING")."\n";
            echo "LATEST_TEST_TOTAL_100=".(($o["total"]??0)===100?"YES":"NO")."\n";
            echo "LATEST_TEST_PAYMENT_ID_PRESENT=".(!empty($o["payment_id"])?"YES":"NO")."\n";
            echo "LATEST_TEST_PAID_AT_PRESENT=".(!empty($o["paid_at"])?"YES":"NO")."\n";
            echo "LATEST_TEST_DELIVERY_ITEMS_PRESENT=".(!empty($o["delivery"]["items"])?"YES":"NO")."\n";
            echo "LATEST_TEST_EMAIL_SENT=".(!empty($o["delivery"]["email_sent_at"])?"YES":"NO")."\n";
            if (($o["status"]??"")!=="paid" || ($o["total"]??0)!==100 || empty($o["payment_id"]) || empty($o["delivery"]["email_sent_at"])) exit(3);
            echo "BUYER_ORDER_SERVER_ACCEPTANCE=PASS\n";
          ' "$site"
          REMOTE

  nsp-yandex-webmaster-register:
    if: ${{ github.ref_name == 'audit/nsp-hosting-readonly-20261020' && inputs.webmaster_register_new_domain == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Register and inspect site via official Webmaster API
        env:
          YANDEX_TOKEN: ${{ secrets.YANDEX_WEBMASTER_TOKEN }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          base="https://api.webmaster.yandex.net/v4"
          token=os.environ.get("YANDEX_TOKEN","")
          if not token: raise SystemExit("WEBMASTER_TOKEN_MISSING")
          def call(path,method="GET",data=None):
              payload=None if data is None else json.dumps(data).encode()
              req=urllib.request.Request(base+path,data=payload,method=method,headers={"Authorization":"OAuth "+token,"Content-Type":"application/json"})
              try:
                  with urllib.request.urlopen(req,timeout=12) as r: return r.status,json.load(r)
              except urllib.error.HTTPError as e:
                  try: result=json.load(e)
                  except Exception: result={}
                  return e.code,result
          status,user=call("/user")
          if status!=200: raise SystemExit("WEBMASTER_USER_HTTP_"+str(status))
          uid=user.get("user_id")
          print("WEBMASTER_USER_AUTH=PASS")
          status,hosts=call("/user/"+str(uid)+"/hosts")
          if status!=200: raise SystemExit("WEBMASTER_HOSTS_HTTP_"+str(status))
          old=[h for h in hosts.get("hosts",[]) if "marzhavbetone.ru" in h.get("ascii_host_url","")]
          new=[h for h in hosts.get("hosts",[]) if "nastoronepodryadchika.ru" in h.get("ascii_host_url","")]
          print("OLD_DOMAIN_PRESENT="+str(bool(old)))
          print("NEW_DOMAIN_PRESENT_BEFORE="+str(bool(new)))
          if not new:
              status,result=call("/user/"+str(uid)+"/hosts","POST",{"host_url":"https://nastoronepodryadchika.ru/"})
              print("ADD_NEW_DOMAIN_HTTP="+str(status))
              if status not in (200,201): raise SystemExit("WEBMASTER_ADD_FAILED")
              new_id=result.get("host_id")
          else: new_id=new[0]["host_id"]
          status,verify=call("/user/"+str(uid)+"/hosts/"+urllib.parse.quote(new_id,safe="")+"/verification")
          print("NEW_DOMAIN_VERIFICATION_HTTP="+str(status))
          if status==200:
              print("NEW_DOMAIN_VERIFICATION_STATE="+str(verify.get("verification_state","UNKNOWN")))
              print("NEW_DOMAIN_VERIFICATION_UIN="+str(verify.get("verification_uin","")))
          PY

