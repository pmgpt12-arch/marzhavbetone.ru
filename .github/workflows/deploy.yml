          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          test -n "$KEY" && test -n "$HOST"
          mkdir -p "$REMAINING_SSH_DIR"
          chmod 700 "$REMAINING_SSH_DIR"
          printf '%s\n' "$KEY" | tr -d '\r' > "$REMAINING_SSH_DIR/deploy_key"
          chmod 600 "$REMAINING_SSH_DIR/deploy_key"
          ssh-keygen -y -P '' -f "$REMAINING_SSH_DIR/deploy_key" > /dev/null
          ssh-keyscan -T 10 -p "$SSH_PORT" -H "$HOST" > "$REMAINING_SSH_DIR/known_hosts" 2>/dev/null
          test -s "$REMAINING_SSH_DIR/known_hosts"
