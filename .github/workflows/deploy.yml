name: NSP PR719 targeted HTML only
on:
  workflow_dispatch:
    inputs:
      header_css_only:
        description: "Update unified header CSS after viewport QA"
        type: boolean
        default: false
      header_unify:
        description: "Publish one unified navigation and working cart to all content pages"
        type: boolean
        default: false
      home_visibility:
        description: "Show Шаблоны актов in homepage desktop menu"
        type: boolean
        default: false
      nav_only:
        description: "Rename free navigation to templates"
        type: boolean
        default: false
      discover:
        description: 'Read-only discovery of actual served site root'
        required: true
        type: boolean
        default: false
      probe_paths:
        description: "Read-only inventory of site roots"
        type: boolean
        default: false
      apply:
        description: 'Apply validated HTML-only patch (false = dry run)'
        required: true
        type: boolean
        default: false
concurrency:
  group: nsp-pr719-production-html-single-writer
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  html-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SITE_PATH: www/nastoronepodryadchika.ru
      SSH_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      HOST: ${{ secrets.DEPLOY_HOST }}
      USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH without exposing secrets
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$USER" && test -n "$KEY"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -P '' -f ~/.ssh/deploy_key >/dev/null
          ssh-keyscan -p "$SSH_PORT" -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
      - name: Discover site path read-only
        if: ${{ inputs.discover }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -i ~/.ssh/deploy_key -p "$SSH_PORT" "$USER@$HOST" 'find "$HOME/www" -maxdepth 5 -type f -name katalog.html -print 2>/dev/null | while IFS= read -r f; do if grep -q '''data-sku="t2"''' "$f"; then flag=T2_PRESENT; else flag=NO_T2; fi; echo "CANDIDATE $f $flag"; sha256sum "$f"; done'
      - name: Read-only site root inventory
        if: ${{ inputs.probe_paths == true }}
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -p "$SSH_PORT" "$USER@$HOST" 'find "$HOME/www" -maxdepth 4 -name katalog.html -type f -print -exec sha256sum {} \; 2>/dev/null | head -40'
      - name: Unify site-wide header and cart
        if: ${{ inputs.header_unify || inputs.header_css_only }}
        env:
          APPLY: ${{ inputs.apply }}
          CSS_ONLY: ${{ inputs.header_css_only }}
        run: python3 tools/nsp_unified_header_release.py
      - name: Rename navigation only
        if: ${{ !inputs.header_css_only && !inputs.header_unify && (inputs.nav_only || inputs.home_visibility) }}
        env:
          APPLY: ${{ inputs.apply }}
          HOME_ONLY: ${{ inputs.home_visibility }}
        run: python3 tools/nsp_nav_release.py
      - name: Read production, patch, validate, backup and optionally upload
        if: ${{ !inputs.header_css_only && !inputs.header_unify && !inputs.home_visibility && !inputs.nav_only && !inputs.probe_paths && !inputs.discover }}
        env:
          APPLY: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          python3 tools/nsp_pr719_html_release.py
