        if: ${{ !contains(github.event.head_commit.message, '[dry-run-r3-release]') && inputs.dry_run != true }}
        run: |
          python3 tools/record_remaining_production_20261020.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- tools/candidates/remaining-batch-r3-20261018/release-20261020/production tools/candidates/remaining-batch-r3-20261018/release-20261020/release-plan.json tools/candidates/remaining-batch-r3-20261018/evidence/working-checkpoint.json tools/candidates/remaining-batch-r3-20261018/REVIEW-STATUS.md
          git commit -m 'Record actual production HTTP archives and verified owner-approved R3 publication'
          git push origin HEAD:candidate/mb001-remaining-batch-r3-20261018
      - name: Save exact production archives and verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remaining-release-${{ github.run_id }}
          path: ${{ runner.temp }}/remaining-live-buyer-evidence/
          if-no-files-found: warn
