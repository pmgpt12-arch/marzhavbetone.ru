name: Dynamic endpoint source inventory

on:
  pull_request:
    paths:
      - 'app-script.php'
      - 'check-payment.php'
      - 'contact.php'
      - 'download.php'
      - 'event.php'
      - 'get/index.php'
      - 'ig-webhook.php'
      - 'lead.php'
      - 'payment.php'
      - 'webhook.php'
      - '**/*.html'
      - '**/*.htm'
      - '**/*.js'
      - '**/*.php'
      - 'tools/inventory_dynamic_endpoints.py'
      - 'tools/test_inventory_dynamic_endpoints.py'
      - 'tools/reports/site-static-content-snapshot-20261012/report.json'
      - 'tools/reports/site-dynamic-endpoint-source-inventory-20261012/**'
      - '.github/workflows/site-dynamic-endpoint-source-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regression tests
        run: python3 -m unittest tools.test_inventory_dynamic_endpoints -v
      - name: Build read-only inventory
        id: inventory
        shell: bash
        run: |
          set +e
          python3 tools/inventory_dynamic_endpoints.py \
            --source-report tools/reports/site-static-content-snapshot-20261012/report.json \
            --output tools/reports/site-dynamic-endpoint-source-inventory-20261012
          code=$?
          printf '%s\n' "$code" > tools/reports/site-dynamic-endpoint-source-inventory-20261012/exit.code
          exit "$code"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-dynamic-endpoint-source-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: tools/reports/site-dynamic-endpoint-source-inventory-20261012/
          if-no-files-found: error
          retention-days: 30
