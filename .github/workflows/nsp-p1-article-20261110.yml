name: NSP P1 article 2026-11-10 targeted publish
on:
  push:
    branches:
      - 'release/nsp-p1-article-20261110'
    paths:
      - '.github/workflows/nsp-p1-article-20261110.yml'
permissions:
  contents: read
concurrency:
  group: nsp-production-p1-article-20261110
  cancel-in-progress: false
jobs:
  publish:
    name: Targeted editorial page and four real document previews
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 12
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
      SSH_USER: ${{ secrets.DEPLOY_USER }}
      KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      PORT: ${{ secrets.DEPLOY_PORT || '22' }}
    steps:
      - name: Scoped publish with content-hash preflight and automatic rollback
        shell: bash
        run: |
          set -euo pipefail
          test -f /home/denis/projects/nsp-qa13-20261024/p1-article-release-20261110/run_publish.sh
          bash /home/denis/projects/nsp-qa13-20261024/p1-article-release-20261110/run_publish.sh
