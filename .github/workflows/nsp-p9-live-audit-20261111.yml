name: NSP P9 read-only exact production master and source audit
on:
  push:
    branches:
      - 'release/nsp-p9-live-audit-20261111'
    paths:
      - '.github/workflows/nsp-p9-live-audit-20261111.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 4
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
      SSH_USER: ${{ secrets.DEPLOY_USER }}
      KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      PORT: ${{ secrets.DEPLOY_PORT || '22' }}
    steps:
      - name: Read current P9 master/cache/source hashes without modification
        shell: bash
        run: |
          set -euo pipefail
          bash /home/denis/projects/nsp-qa19-p9-20261030/p9-brandfix-20261111/p9_readonly_audit.sh
