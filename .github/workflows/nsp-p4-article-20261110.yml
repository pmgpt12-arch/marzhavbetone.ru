name: NSP P4 approved article and real document previews
on:
  push:
    branches:
      - 'release/nsp-p4-article-20261110'
    paths:
      - '.github/workflows/nsp-p4-article-20261110.yml'
permissions:
  contents: read
concurrency:
  group: nsp-production-p4-article-20261110
  cancel-in-progress: false
jobs:
  publish:
    name: Targeted P4 article with four native previews
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 12
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
      SSH_USER: ${{ secrets.DEPLOY_USER }}
      KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      PORT: ${{ secrets.DEPLOY_PORT || '22' }}
    steps:
      - name: SHA-gated publication of P4 only
        shell: bash
        run: |
          set -euo pipefail
          test -f /home/denis/projects/nsp-qa19-p8-20261030/p4-current-reference-20261110/p4-article-release-20261110/run_publish.sh
          bash /home/denis/projects/nsp-qa19-p8-20261030/p4-current-reference-20261110/p4-article-release-20261110/run_publish.sh
