name: NSP P9 current buyer product read-only capture
on:
  push:
    branches:
      - 'release/nsp-p9-capture-20261111'
    paths:
      - '.github/workflows/nsp-p9-capture-20261111.yml'
permissions:
  contents: read
jobs:
  capture:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
      SSH_USER: ${{ secrets.DEPLOY_USER }}
      KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      PORT: ${{ secrets.DEPLOY_PORT || '22' }}
    steps:
      - name: Capture actual P9 12-file buyer ZIP read-only
        shell: bash
        run: |
          set -euo pipefail
          bash /home/denis/projects/nsp-qa19-p8-20261030/p9_readonly_capture_20261111.sh
