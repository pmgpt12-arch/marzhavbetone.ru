name: NSP P5 approved article and v2 branded native previews
on:
  push:
    branches:
      - 'release/nsp-p5-article-20261110'
    paths:
      - '.github/workflows/nsp-p5-article-20261110.yml'
permissions:
  contents: read
concurrency:
  group: nsp-production-p5-article-20261110
  cancel-in-progress: false
jobs:
  publish:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 12
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
      SSH_USER: ${{ secrets.DEPLOY_USER }}
      KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      PORT: ${{ secrets.DEPLOY_PORT || '22' }}
    steps:
      - name: SHA-bound P5 article and four v2-native document previews
        shell: bash
        run: |
          set -euo pipefail
          test -f /home/denis/projects/nsp-qa19-p8-20261030/p5-current-reference-20261110/p5-article-release-20261110/run_publish.sh
          bash /home/denis/projects/nsp-qa19-p8-20261030/p5-current-reference-20261110/p5-article-release-20261110/run_publish.sh
