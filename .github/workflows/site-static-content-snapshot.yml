name: Site static content snapshot

on:
  pull_request:
    paths:
      - '**/*.html'
      - '**/*.php'
      - '**/*.css'
      - '**/*.js'
      - '**/*.svg'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.webp'
      - 'products-storage/ARTIFACT-REGISTRY.json'
      - 'tools/build_static_content_snapshot.py'
      - 'tools/test_static_content_snapshot.py'
      - 'tools/reports/site-route-discovery-20261012/report.json'
      - 'tools/reports/site-static-content-snapshot-20261012/**'
      - '.github/workflows/site-static-content-snapshot.yml'
  workflow_dispatch:

jobs:
  static-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 tools/build_static_content_snapshot.py --check
      - run: python3 -m unittest tools.test_static_content_snapshot
