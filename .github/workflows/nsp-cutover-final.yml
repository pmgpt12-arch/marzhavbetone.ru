name: NSP final targeted corrections
on:
  push:
    branches: [fix/nsp-cutover-final-20261021]
    paths: [tools/nsp-final/request.json]
permissions:
  contents: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  targeted:
    if: github.ref_name == 'fix/nsp-cutover-final-20261021'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
      SSH_USER: ${{ secrets.DEPLOY_USER }}
      KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      PORT: ${{ secrets.DEPLOY_PORT || '22' }}
    steps:
      - uses: actions/checkout@v4
      - name: Read explicit action and configure bounded SSH
        run: |
          set -euo pipefail
          action=$(python3 -c 'import json; x=json.load(open("tools/nsp-final/request.json")); assert x["action"] in ["snapshot","dry-run","publish","p4p5-inspect","p4p5-preflight","p4p5-publish","titles-preflight","titles-publish","mail-preflight","mail-dry-run","mail-publish","mail-postflight","mail-canary"]; print(x["action"])')
          echo "NSP_ACTION=$action" >> "$GITHUB_ENV"
          test -n "$HOST" && test -n "$SSH_USER" && test -n "$KEY"
          [[ "$PORT" =~ ^[0-9]+$ ]]
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/nsp_final_key
          chmod 600 ~/.ssh/nsp_final_key
          timeout 15s ssh-keyscan -T 8 -p "$PORT" -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          mkdir -p /tmp/nsp-final-evidence
      - name: Save current production static source without secrets
        if: env.NSP_ACTION == 'snapshot'
        run: |
          set -euo pipefail
          php -l tools/nsp_public_inventory.php
          SSH=(ssh -p "$PORT" -i ~/.ssh/nsp_final_key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=3)
          timeout 60s "${SSH[@]}" "$SSH_USER@$HOST" 'php /dev/stdin "$HOME/www/nastoronepodryadchika.ru"' < tools/nsp_public_inventory.php > /tmp/nsp-final-evidence/static-before.json
          python3 - <<'PY'
          import json, pathlib
          rows=json.load(open('/tmp/nsp-final-evidence/static-before.json'))
          assert 90 <= len(rows) <= 1200
          assert len({r['path'] for r in rows})==len(rows)
          pathlib.Path('/tmp/nsp-static-paths').write_text(''.join(r['path']+'\n' for r in rows))
          PY
          timeout 120s "${SSH[@]}" "$SSH_USER@$HOST" 'cd "$HOME/www/nastoronepodryadchika.ru" && tar -cf - -T -' < /tmp/nsp-static-paths > /tmp/nsp-static.tar
          mkdir /tmp/nsp-static
          tar -xf /tmp/nsp-static.tar -C /tmp/nsp-static
          python3 - <<'PY'
          import hashlib,json,pathlib,re,shutil
          rows=json.load(open('/tmp/nsp-final-evidence/static-before.json'))
          for r in rows:
              p=pathlib.Path('/tmp/nsp-static')/r['path']; data=p.read_bytes()
              assert len(data)==r['size'] and hashlib.sha256(data).hexdigest()==r['sha256'], 'SNAPSHOT_RACE_OR_CORRUPTION'
              if p.suffix in ['.html','.js','.css','.xml']:
                  assert not re.search(rb'(?:-----BEGIN (?:RSA |OPENSSH )?PRIVATE KEY|sk_live_[A-Za-z0-9]{12}|gh[pousr]_[A-Za-z0-9]{20})',data), 'SECRET_PATTERN'
              dest=pathlib.Path(r['path']); dest.parent.mkdir(parents=True,exist_ok=True); shutil.copyfile(p,dest)
          pathlib.Path('tools/nsp-final/static-before.json').write_text(json.dumps(rows,indent=2)+'\n')
          print('STATIC_SNAPSHOT_FILES='+str(len(rows)))
          PY
          git diff --stat
          python3 - <<'PY'
          import json,subprocess
          paths=[r['path'] for r in json.load(open('tools/nsp-final/static-before.json'))]
          subprocess.run(['git','add','-f','--',*paths,'tools/nsp-final/static-before.json'],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve current NSP public production static source [skip deploy]'
          git push origin HEAD:fix/nsp-cutover-final-20261021
          git rev-parse HEAD > /tmp/nsp-final-evidence/snapshot-commit.txt
      - name: Inspect private P4/P5 and legacy SKU hashes (READ ONLY)
        if: env.NSP_ACTION == 'p4p5-inspect'
        run: |
          set -euo pipefail
          timeout 60s ssh -p "$PORT" -i ~/.ssh/nsp_final_key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=12 "$SSH_USER@$HOST" 'php /dev/stdin "$HOME/www/nastoronepodryadchika.ru"' < tools/nsp-qa-t2t3-consolidation-20261101/READONLY_RELEASE_PREFLIGHT.php > /tmp/nsp-final-evidence/p4p5-private-inspection.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/nsp-final-evidence/p4p5-private-inspection.json'))
          assert d['read_only'] is True and d['ttl']==3600
          assert set(d['sku'])=={'p4','p5','t2','t3'}
          assert {k:d['sku'][k]['price'] for k in d['sku']}=={'p4':2490000,'p5':2990000,'t2':990000,'t3':1490000}
          assert len(d['sku']['p4']['files'])>=26 and len(d['sku']['p5']['files'])>=30
          print('P4P5_LIVE_READONLY_INSPECTION_PASS')
          PY
      - name: Inspect sender production PHP preimage (READ ONLY)
        if: env.NSP_ACTION == 'mail-preflight'
        run: |
          set -euo pipefail
          php -l tools/nsp-final/mail-from-20261105/inspect.php
          timeout 50s ssh -p "$PORT" -i ~/.ssh/nsp_final_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 "$SSH_USER@$HOST" 'php /dev/stdin "$HOME/www/nastoronepodryadchika.ru"' < tools/nsp-final/mail-from-20261105/inspect.php > /tmp/nsp-final-evidence/mail-preflight.json
          python3 -c 'import json; d=json.load(open("/tmp/nsp-final-evidence/mail-preflight.json")); assert d["status"]=="PASS" and d["mode"]=="READ_ONLY" and d["production_writes"]==0 and set(d["files"])=={"lead.php","webhook.php","products-config.php","config.php","payment.php","check-payment.php","download.php","contact.php"}; print("NSP_MAIL_PRODUCTION_PREFLIGHT_PASS")'
      - name: One-shot NSP sender delivery canary without buyer order
        if: env.NSP_ACTION == 'mail-canary'
        shell: bash
        run: |
          set -euo pipefail
          php -l tools/nsp-final/mail-from-20261105/canary.php
          python3 -m py_compile tools/nsp-final/mail-from-20261105/run_canary.py
          timeout 85s python3 tools/nsp-final/mail-from-20261105/run_canary.py
      - name: Independent sender production postflight without any writes
        if: env.NSP_ACTION == 'mail-postflight'
        shell: bash
        run: |
          set -euo pipefail
          php -l tools/nsp-final/mail-from-20261105/inspect.php
          timeout 50s ssh -p "$PORT" -i ~/.ssh/nsp_final_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 "$SSH_USER@$HOST" 'php /dev/stdin postflight "$HOME/www/nastoronepodryadchika.ru"' < tools/nsp-final/mail-from-20261105/inspect.php > /tmp/nsp-final-evidence/mail-independent-postflight.json
          python3 -c 'import json; d=json.load(open("/tmp/nsp-final-evidence/mail-independent-postflight.json")); assert d["status"]=="PASS" and d["mode"]=="postflight" and d["production_writes"]==0 and d["orders_modified"]==0 and d["emails_sent"]==0 and d["active_sender_files"]==3 and d["protected_files_unchanged"]==5 and len(d["files"])==8; assert all(x["hash_matches"] for x in d["files"].values()); print("NSP_SENDER_INDEPENDENT_POSTFLIGHT_PASS")'
      - name: Bounded NSP sender transaction tests and exact production dry-run
        if: env.NSP_ACTION == 'mail-dry-run' || env.NSP_ACTION == 'mail-publish'
        shell: bash
        run: |
          set -euo pipefail
          file=tools/nsp-final/mail-from-20261105/transaction.php
          php -l "$file"
          php -l tools/nsp-final/mail-from-20261105/test_transaction.php
          timeout 30s php tools/nsp-final/mail-from-20261105/test_transaction.php > /tmp/nsp-final-evidence/mail-local-tests.json
          python3 -c 'import json; x=json.load(open("/tmp/nsp-final-evidence/mail-local-tests.json")); assert x["status"]=="PASS" and len(x["cases"])==9 and x["real_emails_sent"]==0; print("NSP_SENDER_ISOLATED_TRANSACTION_TESTS_PASS")'
          timeout 65s ssh -p "$PORT" -i ~/.ssh/nsp_final_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 "$SSH_USER@$HOST" "php /dev/stdin dry-run \"\$HOME/www/nastoronepodryadchika.ru\" \"\$HOME/nsp-migration-private/mail-from-20261105-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\"" < "$file" > /tmp/nsp-final-evidence/mail-transaction-dry-run.json
          python3 -c 'import json; d=json.load(open("/tmp/nsp-final-evidence/mail-transaction-dry-run.json")); assert d["status"]=="PASS" and d["mode"]=="dry-run" and d["production_writes"]==0 and d["emails_sent"]==0 and d["orders_modified"]==0 and set(d["target_files"])=={"lead.php","webhook.php","products-config.php"} and d["protected_files_unchanged"]==5; print("NSP_SENDER_EXACT_LIVE_DRY_RUN_PASS")'
      - name: Publish exactly three sender literals with SHA-pinned backup and rollback
        if: env.NSP_ACTION == 'mail-publish'
        shell: bash
        run: |
          set -euo pipefail
          file=tools/nsp-final/mail-from-20261105/transaction.php
          target="php /dev/stdin publish \"\$HOME/www/nastoronepodryadchika.ru\" \"\$HOME/nsp-migration-private/mail-from-20261105-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\""
          timeout 80s ssh -p "$PORT" -i ~/.ssh/nsp_final_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 "$SSH_USER@$HOST" "$target" < "$file" > /tmp/nsp-final-evidence/mail-publication.json
          python3 -c 'import json; d=json.load(open("/tmp/nsp-final-evidence/mail-publication.json")); assert d["status"]=="PASS" and d["mode"]=="publish" and d["files"]==3 and d["protected_files_unchanged"]==5'
          verify="php /dev/stdin verify \"\$HOME/www/nastoronepodryadchika.ru\" \"\$HOME/nsp-migration-private/mail-from-20261105-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\""
          if ! { timeout 45s ssh -p "$PORT" -i ~/.ssh/nsp_final_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 "$SSH_USER@$HOST" "$verify" < "$file" > /tmp/nsp-final-evidence/mail-postflight.json && python3 -c 'import json; d=json.load(open("/tmp/nsp-final-evidence/mail-postflight.json")); assert d["status"]=="PASS" and d["mode"]=="verify" and d["files"]==3 and d["protected_files_unchanged"]==5'; }; then
            echo "NSP_SENDER_POSTFLIGHT_FAILED_ATTEMPT_EXACT_ROLLBACK"
            rollback="php /dev/stdin rollback \"\$HOME/www/nastoronepodryadchika.ru\" \"\$HOME/nsp-migration-private/mail-from-20261105-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\""
            timeout 55s ssh -p "$PORT" -i ~/.ssh/nsp_final_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 "$SSH_USER@$HOST" "$rollback" < "$file" > /tmp/nsp-final-evidence/mail-rollback.json
            python3 -c 'import json; d=json.load(open("/tmp/nsp-final-evidence/mail-rollback.json")); assert d["status"]=="PASS" and d["mode"]=="rollback" and d["files"]==3'
            echo "NSP_SENDER_POSTFLIGHT_FAILED_ROLLED_BACK"
            exit 1
          fi
          echo "NSP_SENDER_EXACT_LIVE_PUBLICATION_AND_VERIFY_PASS"
      - name: Publish P4v3 and P5v2 via SHA-pinned transactional runner
        if: env.NSP_ACTION == 'p4p5-preflight' || env.NSP_ACTION == 'p4p5-publish'
        run: python3 tools/nsp-final/p4p5-20261102/action.py
      - name: Scoped public title sync P3 P7 P8 P9 P10 P11 P13
        if: env.NSP_ACTION == 'titles-preflight' || env.NSP_ACTION == 'titles-publish'
        run: python3 tools/nsp-final/titles-20261104/action.py "$NSP_ACTION"
      - name: Targeted dry-run or publication
        if: env.NSP_ACTION == 'dry-run' || env.NSP_ACTION == 'publish'
        run: python3 tools/nsp-final/release.py "$NSP_ACTION"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nsp-final-evidence-${{ github.run_id }}
          path: /tmp/nsp-final-evidence/
          retention-days: 30
