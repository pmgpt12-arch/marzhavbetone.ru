name: NSP final targeted corrections
on:
  push:
    branches: [fix/nsp-legacy-data-cleanup-20261030, fix/nsp-remove-retired-review-20261030, fix/nsp-cutover-final-20261021, fix/nsp-dzen-20261021, fix/nsp-audit-ui-20261021, fix/nsp-free-checklist-20261021, fix/nsp-free-downloads-20261021, fix/nsp-layout-v3-20261021, fix/nsp-stage-links-20261022, fix/nsp-inner-background-20261022]
    paths: [tools/nsp-final/request.json]
permissions:
  contents: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  targeted:
    if: github.ref_name == 'fix/nsp-legacy-data-cleanup-20261030' || github.ref_name == 'fix/nsp-remove-retired-review-20261030' || github.ref_name == 'fix/nsp-cutover-final-20261021' || github.ref_name == 'fix/nsp-dzen-20261021' || github.ref_name == 'fix/nsp-audit-ui-20261021' || github.ref_name == 'fix/nsp-free-checklist-20261021' || github.ref_name == 'fix/nsp-free-downloads-20261021' || github.ref_name == 'fix/nsp-layout-v3-20261021' || github.ref_name == 'fix/nsp-stage-links-20261022' || github.ref_name == 'fix/nsp-inner-background-20261022'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
      SSH_USER: ${{ secrets.DEPLOY_USER }}
      KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      PORT: ${{ secrets.DEPLOY_PORT || '22' }}
    steps:
      - uses: actions/checkout@v4
      - name: Read explicit action and configure bounded SSH
        run: |
          set -euo pipefail
          action=$(python3 -c 'import json; x=json.load(open("tools/nsp-final/request.json")); assert x["action"] in ["snapshot","dry-run","publish","inspect-checklist","inspect-free-downloads","inspect-layout","privacy-audit","privacy-plan","privacy-apply"]; print(x["action"])')
          echo "NSP_ACTION=$action" >> "$GITHUB_ENV"
          test -n "$HOST" && test -n "$SSH_USER" && test -n "$KEY"
          [[ "$PORT" =~ ^[0-9]+$ ]]
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/nsp_final_key
          chmod 600 ~/.ssh/nsp_final_key
          timeout 15s ssh-keyscan -T 8 -p "$PORT" -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          mkdir -p /tmp/nsp-final-evidence
      - name: Read only legacy and current user data inventory
        if: env.NSP_ACTION == 'privacy-audit'
        run: |
          set -euo pipefail
          python3 -m py_compile tools/nsp-privacy-20261030/inventory.py
          timeout 80s ssh -p "$PORT" -i ~/.ssh/nsp_final_key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=12 "$SSH_USER@$HOST" 'python3 - "$HOME"' < tools/nsp-privacy-20261030/inventory.py > /tmp/nsp-final-evidence/privacy-inventory.json
          cat /tmp/nsp-final-evidence/privacy-inventory.json
      - name: Exact-plan legacy contact cleanup
        if: env.NSP_ACTION == 'privacy-plan' || env.NSP_ACTION == 'privacy-apply'
        run: |
          set -euo pipefail
          mode=plan
          expected=NONE
          if [ "$NSP_ACTION" = privacy-apply ]; then
            mode=apply
            expected=$(python3 -c 'import json,re; x=json.load(open("tools/nsp-final/request.json"))["plan_digest"]; assert re.fullmatch("[a-f0-9]{64}",x); print(x)')
          fi
          timeout 165s ssh -p "$PORT" -i ~/.ssh/nsp_final_key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=12 "$SSH_USER@$HOST" "python3 - \"\$HOME\" $mode $expected" < tools/nsp-privacy-20261030/cleanup.py > /tmp/nsp-final-evidence/privacy-cleanup.json
          cat /tmp/nsp-final-evidence/privacy-cleanup.json
      - name: Save current production static source without secrets
        if: env.NSP_ACTION == 'snapshot'
        run: |
          set -euo pipefail
          php -l tools/nsp_public_inventory.php
          SSH=(ssh -p "$PORT" -i ~/.ssh/nsp_final_key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=3)
          timeout 60s "${SSH[@]}" "$SSH_USER@$HOST" 'php /dev/stdin "$HOME/www/nastoronepodryadchika.ru"' < tools/nsp_public_inventory.php > /tmp/nsp-final-evidence/static-before.json
          python3 - <<'PY'
          import json, pathlib
          rows=json.load(open('/tmp/nsp-final-evidence/static-before.json'))
          assert 90 <= len(rows) <= 1200
          assert len({r['path'] for r in rows})==len(rows)
          pathlib.Path('/tmp/nsp-static-paths').write_text(''.join(r['path']+'\n' for r in rows))
          PY
          timeout 120s "${SSH[@]}" "$SSH_USER@$HOST" 'cd "$HOME/www/nastoronepodryadchika.ru" && tar -cf - -T -' < /tmp/nsp-static-paths > /tmp/nsp-static.tar
          mkdir /tmp/nsp-static
          tar -xf /tmp/nsp-static.tar -C /tmp/nsp-static
          python3 - <<'PY'
          import hashlib,json,pathlib,re,shutil
          rows=json.load(open('/tmp/nsp-final-evidence/static-before.json'))
          for r in rows:
              p=pathlib.Path('/tmp/nsp-static')/r['path']; data=p.read_bytes()
              assert len(data)==r['size'] and hashlib.sha256(data).hexdigest()==r['sha256'], 'SNAPSHOT_RACE_OR_CORRUPTION'
              if p.suffix in ['.html','.js','.css','.xml']:
                  assert not re.search(rb'(?:-----BEGIN (?:RSA |OPENSSH )?PRIVATE KEY|sk_live_[A-Za-z0-9]{12}|gh[pousr]_[A-Za-z0-9]{20})',data), 'SECRET_PATTERN'
              dest=pathlib.Path(r['path']); dest.parent.mkdir(parents=True,exist_ok=True); shutil.copyfile(p,dest)
          pathlib.Path('tools/nsp-final/static-before.json').write_text(json.dumps(rows,indent=2)+'\n')
          print('STATIC_SNAPSHOT_FILES='+str(len(rows)))
          PY
          git diff --stat
          python3 - <<'PY'
          import json,subprocess
          paths=[r['path'] for r in json.load(open('tools/nsp-final/static-before.json'))]
          subprocess.run(['git','add','-f','--',*paths,'tools/nsp-final/static-before.json'],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve current NSP public production static source [skip deploy]'
          git push origin "HEAD:$GITHUB_REF_NAME"
          git rev-parse HEAD > /tmp/nsp-final-evidence/snapshot-commit.txt
      - name: Inspect only the public checklist path
        if: env.NSP_ACTION == 'inspect-checklist'
        run: |
          set -euo pipefail
          timeout 40s ssh -p "$PORT" -i ~/.ssh/nsp_final_key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=12 "$SSH_USER@$HOST" 'php /dev/stdin "$HOME/www/nastoronepodryadchika.ru"' < tools/nsp-free-checklist-20261021/inspect.php > /tmp/nsp-final-evidence/checklist-inspect.json
          cat /tmp/nsp-final-evidence/checklist-inspect.json
      - name: Inspect only the ten public free ZIP paths
        if: env.NSP_ACTION == 'inspect-free-downloads'
        run: |
          set -euo pipefail
          timeout 40s ssh -p "$PORT" -i ~/.ssh/nsp_final_key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=12 "$SSH_USER@$HOST" 'php /dev/stdin "$HOME/www/nastoronepodryadchika.ru"' < tools/nsp-free-downloads-20261021/inspect.php > /tmp/nsp-final-evidence/free-downloads-inspect.json
          cat /tmp/nsp-final-evidence/free-downloads-inspect.json
      - name: Inspect exact homepage release paths without writes
        if: env.NSP_ACTION == 'inspect-layout'
        run: |
          set -euo pipefail
          timeout 40s ssh -p "$PORT" -i ~/.ssh/nsp_final_key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=12 "$SSH_USER@$HOST" 'php /dev/stdin "$HOME/www/nastoronepodryadchika.ru"' < tools/nsp-layout-v3-20261021/inspect.php > /tmp/nsp-final-evidence/layout-inspect.json
          cat /tmp/nsp-final-evidence/layout-inspect.json
      - name: Install bounded public PDF validation dependency
        if: (env.NSP_ACTION == 'dry-run' || env.NSP_ACTION == 'publish') && (github.ref_name == 'fix/nsp-free-checklist-20261021' || github.ref_name == 'fix/nsp-free-downloads-20261021')
        run: python3 -m pip install --disable-pip-version-check --timeout 20 --retries 0 pypdf==6.10.0 lxml==6.0.2
      - name: Check stage links and unchanged appearance before release
        if: github.ref_name == 'fix/nsp-stage-links-20261022'
        run: |
          npm install --prefix /tmp/nsp-stage-deps --no-audit --no-fund playwright@1.64.1
          NODE_PATH=/tmp/nsp-stage-deps/node_modules timeout 120s node tools/nsp-stage-links-20261022/verify.cjs
      - name: Prepare and preserve interior background release source
        if: github.ref_name == 'fix/nsp-inner-background-20261022'
        run: |
          python3 tools/nsp-inner-background-20261022/prepare.py
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- '*.html' brand-approved-2026.css tools/nsp-final/manifest.json tools/nsp-final/static-before.json tools/nsp-inner-background-20261022/pages.json tools/nsp-inner-background-20261022/build.json
          if ! git diff --cached --quiet; then
            git commit -m 'Preserve generated interior background source and versioned stylesheet links [skip deploy]'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          npm install --prefix /tmp/nsp-background-deps --no-audit --no-fund playwright@1.64.1
          NODE_PATH=/tmp/nsp-background-deps/node_modules timeout 150s node tools/nsp-inner-background-20261022/verify.cjs
      - name: Targeted dry-run or publication
        if: env.NSP_ACTION == 'dry-run' || env.NSP_ACTION == 'publish'
        run: python3 tools/nsp-final/release.py "$NSP_ACTION"
      - name: Verify published interior backgrounds
        if: env.NSP_ACTION == 'publish' && github.ref_name == 'fix/nsp-inner-background-20261022'
        run: NODE_PATH=/tmp/nsp-background-deps/node_modules NSP_LIVE=1 timeout 150s node tools/nsp-inner-background-20261022/verify.cjs
      - name: Check published stage links
        if: env.NSP_ACTION == 'publish' && github.ref_name == 'fix/nsp-stage-links-20261022'
        run: NODE_PATH=/tmp/nsp-stage-deps/node_modules NSP_LIVE=1 timeout 120s node tools/nsp-stage-links-20261022/verify.cjs
      - name: Verify compact desktop and preserved mobile on actual production
        if: env.NSP_ACTION == 'publish' && github.ref_name == 'fix/nsp-layout-v3-20261021'
        run: |
          npm install --prefix /tmp/nsp-compact-live-deps --no-audit --no-fund playwright@1.64.1
          NODE_PATH=/tmp/nsp-compact-live-deps/node_modules NSP_LIVE=1 NSP_COMPACT_OUTPUT=/tmp/nsp-final-evidence/compact-live node tools/nsp-layout-v3-20261021/verify_compact.cjs after
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nsp-final-evidence-${{ github.run_id }}
          path: /tmp/nsp-final-evidence/
          retention-days: 30
