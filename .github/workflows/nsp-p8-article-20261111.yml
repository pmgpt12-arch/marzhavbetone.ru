name: NSP P8 article approved with native branded document previews
on:
  push:
    branches:
      - 'release/nsp-p8-article-20261111'
    paths:
      - '.github/workflows/nsp-p8-article-20261111.yml'
permissions:
  contents: read
concurrency:
  group: nsp-production-p8-article-20261111
  cancel-in-progress: false
jobs:
  publish:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 12
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
      SSH_USER: ${{ secrets.DEPLOY_USER }}
      KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      PORT: ${{ secrets.DEPLOY_PORT || '22' }}
    steps:
      - name: SHA-gated P8 article and native previews deploy with rollback
        shell: bash
        run: |
          set -euo pipefail
          bash /home/denis/projects/nsp-qa19-p8-20261030/p8-current-reference-20261110/p8-article-release-20261111/run_publish.sh
