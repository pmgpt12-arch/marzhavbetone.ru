name: NSP approved product placement audit
on:
  push:
    branches: ['audit/nsp-products-placement-20261021']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Bind accepted master bytes without changing production
        run: python3 tools/audits/nsp-products-placement-20261021/prepare.py
      - name: Verify actual HTTP issuance with temporary audit orders; no payment or email send
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          set -euo pipefail
          keydir=$(mktemp -d)
          trap 'rm -rf "$keydir"' EXIT
          printf '%s\n' "$KEY" | tr -d '\r' > "$keydir/key"
          chmod 600 "$keydir/key"
          ssh-keyscan -T 10 -p "$PORT" -H "$HOST" > "$keydir/known_hosts" 2>/dev/null
          export NSP_AUDIT_KEY="$keydir/key"
          export NSP_AUDIT_HOSTS="$keydir/known_hosts"
          set +e
          python3 tools/audits/nsp-products-placement-20261021/http_probe.py
          result=$?
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f tools/audits/nsp-products-placement-20261021/http-result.json
          git commit -m 'Save 13 actual new-domain archive checks and scoped probe cleanup'
          git push origin HEAD:audit/nsp-products-placement-20261021
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nsp-product-placement-${{ github.run_id }}
          path: tools/audits/nsp-products-placement-20261021/http-result.json
          if-no-files-found: warn
