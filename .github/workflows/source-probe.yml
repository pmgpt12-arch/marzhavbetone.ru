name: NSP Dzen verification file only
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nsp-dzen-verification-file
  cancel-in-progress: false
jobs:
  verification-file:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Create only the requested public verification file
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY" && test -n "$HOST" && test -n "$SSH_USER"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/nsp_verify_key
          chmod 600 ~/.ssh/nsp_verify_key
          trap 'rm -f ~/.ssh/nsp_verify_key' EXIT
          timeout 15s ssh-keyscan -p "$PORT" -H "$HOST" > ~/.ssh/nsp_verify_hosts 2>/dev/null
          test -s ~/.ssh/nsp_verify_hosts
          timeout 45s ssh -p "$PORT" -i ~/.ssh/nsp_verify_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/nsp_verify_hosts -o ConnectTimeout=12 "$SSH_USER@$HOST" 'php /dev/stdin' < tools/nsp_dzen_verification_20261113.php
      - name: Verify exact public HTTPS content
        run: |
          python3 - <<'PY'
          import urllib.request, hashlib
          from pathlib import Path
          name = "zen_lm2h1UtRaVJ0bSUDComGw1B9e8aXdbt5EwOX7doqOsT2BwKNNePwa3iF9ALamaWS.html"
          expected = Path(name).read_bytes()
          with urllib.request.urlopen('https://nastoronepodryadchika.ru/'+name, timeout=20) as r:
              assert r.status == 200
              actual = r.read()
          assert actual == expected, 'PUBLIC_CONTENT_MISMATCH'
          print('HTTPS_200_EXACT_CONTENT_PASS', hashlib.sha256(actual).hexdigest())
          PY
