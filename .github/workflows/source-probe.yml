name: NSP scoped RSS editorial release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nsp-rss-production
  cancel-in-progress: false
jobs:
  rss-only:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Validate reproducible feed and identities
        run: |
          set -euo pipefail
          cp rss.xml /tmp/expected-rss.xml
          python3 tools/build_rss.py
          cmp /tmp/expected-rss.xml rss.xml
          python3 tools/check_rss.py
          python3 tools/test_dzen_traffic_contract.py
          python3 tools/test_dzen_titles.py
          python3 - <<'PY'
          from pathlib import Path
          import base64
          s=Path('tools/nsp-dzen-20261112/publish-rss.php').read_text()
          s=s.replace('__RSS_BASE64__',base64.b64encode(Path('rss.xml').read_bytes()).decode())
          Path('/tmp/publish-rss.php').write_text(s)
          PY
          php -l /tmp/publish-rss.php
      - name: Publish only rss.xml with backup and drift guard
        id: deploy
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          set -euo pipefail
          test -n "$KEY" && test -n "$HOST" && test -n "$SSH_USER"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/nsp_rss_key
          chmod 600 ~/.ssh/nsp_rss_key
          timeout 15s ssh-keyscan -p "$PORT" -H "$HOST" > ~/.ssh/nsp_rss_hosts 2>/dev/null
          test -s ~/.ssh/nsp_rss_hosts
          timeout 45s ssh -p "$PORT" -i ~/.ssh/nsp_rss_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/nsp_rss_hosts -o ConnectTimeout=12 "$SSH_USER@$HOST" 'php /dev/stdin' < /tmp/publish-rss.php
      - name: Verify public HTTPS exact content
        id: verify
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import urllib.request,hashlib
          with urllib.request.urlopen('https://nastoronepodryadchika.ru/rss.xml',timeout=25) as r:
              assert r.status==200
              b=r.read()
          assert b==Path('rss.xml').read_bytes(),'PUBLIC_FEED_HASH_MISMATCH'
          print('HTTPS_FEED_EXACT_PASS',hashlib.sha256(b).hexdigest())
          PY
      - name: Roll back only this feed after failed public verification
        if: failure() && steps.deploy.outcome == 'success' && steps.verify.outcome == 'failure'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          timeout 45s ssh -p "$PORT" -i ~/.ssh/nsp_rss_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/nsp_rss_hosts -o ConnectTimeout=12 "$SSH_USER@$HOST" 'NSP_ROLLBACK=1 php /dev/stdin' < /tmp/publish-rss.php
      - name: Remove ephemeral key
        if: always()
        run: rm -f ~/.ssh/nsp_rss_key /tmp/publish-rss.php
