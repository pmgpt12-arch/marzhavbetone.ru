name: NSP P5 builder source read-only audit
on:
  push:
    branches:
      - 'release/nsp-p5-audit-20261110'
    paths:
      - '.github/workflows/nsp-p5-audit-20261110.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 4
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
      SSH_USER: ${{ secrets.DEPLOY_USER }}
      KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      PORT: ${{ secrets.DEPLOY_PORT || '22' }}
    steps:
      - name: Read only P5 archive and pin state
        shell: bash
        run: |
          set -euo pipefail
          bash /home/denis/projects/nsp-qa19-p8-20261030/p5-brandfix-20261110/readonly_builder_audit.sh
