name: NSP P13 approved estimate-check article with native previews
on:
  push:
    branches:
      - 'release/nsp-p13-article-20261111'
    paths:
      - '.github/workflows/nsp-p13-article-20261111.yml'
permissions:
  contents: read
concurrency:
  group: nsp-production-p13-article-20261111
  cancel-in-progress: false
jobs:
  publish:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 12
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
      SSH_USER: ${{ secrets.DEPLOY_USER }}
      KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      PORT: ${{ secrets.DEPLOY_PORT || '22' }}
    steps:
      - name: Publish P13 article, four buyer-document JPGs and exact-scope index/sitemap
        shell: bash
        run: |
          set -euo pipefail
          bash /home/denis/projects/nsp-qa19-p13-20261030/p13-current-reference-20261110/p13-article-release-20261111/run_publish.sh
