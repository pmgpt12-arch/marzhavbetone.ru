name: NSP P8 read-only exact buyer ZIP capture
on:
  push:
    branches:
      - 'release/nsp-p8-capture-20261111'
    paths:
      - '.github/workflows/nsp-p8-capture-20261111.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
      SSH_USER: ${{ secrets.DEPLOY_USER }}
      KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      PORT: ${{ secrets.DEPLOY_PORT || '22' }}
    steps:
      - name: Read production P8 12-member buyer archive without altering orders
        shell: bash
        run: |
          set -euo pipefail
          bash /home/denis/projects/nsp-qa19-p8-20261030/p8_readonly_capture_20261111.sh
