# Гейт качества: падает до того, как правка доедет до сервера.
#
# Зачем отдельно от хука `PostToolUse`: хук работает в сессии и его можно
# не запустить — правка руками, правка с телефона, чужой PR. Замер
# 14.08.2026: две битые ссылки на materialy/akt-skrytyh-rabot.html доехали
# до боевого сайта, одна из них — кнопка покупки в 404. Хук их не поймал бы
# в принципе: проверка тогда смотрела только каталог articles/.
#
# Здесь только то, что не требует ни сети, ни секретов, ни браузера, и
# отвечает однозначным кодом. check_mobile.py сюда не входит: он требует
# playwright с хромиумом и без него честно молчит, а молчание в гейте
# читается как «прошло».
name: Проверки

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Полная история нужна одному шагу — проверке переносов вердикта: она
      # берёт прежнюю версию файла из истории и доказывает равенством, что
      # правка юридически пуста. На клоне глубиной 1 `git show` отвечает
      # кодом 128, и поймано это было только прогоном в Actions: локально
      # история полная, и шаг зелёный. Сети самим проверкам это не даёт —
      # она тратится на checkout, а не на них.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Единственная зависимость вне стандартной библиотеки на весь набор:
      # `check_covers.py` меряет размеры обложек. Замер по импортам всех
      # девяти проверок — больше ставить нечего.
      # Две зависимости вне стандартной библиотеки на весь набор.
      # Pillow меряет размеры обложек (check_covers). PyYAML читает
      # data/business/money-pains.yaml — на нём стоит карта товаров, а на
      # карте допродажа и предложение после покупки. Прежние инструменты
      # разбирали yaml руками и зависимости не требовали; для вложенной
      # структуры лестницы ручной разбор — источник тихих ошибок, и
      # зависимость дешевле. Поймано падением гейта 15.08.2026.
      - name: Поставить Pillow и PyYAML
        run: python3 -m pip install --quiet pillow pyyaml

      - name: Целостность ссылок по всему сайту
        run: python3 tools/link_audit.py --verify

      - name: Регресс на проверку ссылок
        run: python3 tools/test_link_audit.py

      # Размеченные примеры владельца против правил классификации спроса.
      # Сети не требует: правила локальные, набор локальный.
      - name: Разметка поискового спроса на размеченных случаях
        run: python3 tools/test_search_demand.py

      # Дубль описания или заголовка — дефект: обещание в выдаче перестаёт
      # различать страницы. Длина — только замечание, кода не меняет.
      - name: Заголовки и описания
        run: python3 tools/check_meta.py

      # Доказательный контур: схемы реестров, уверенность, ловушка
      # знаменателя. Сети не требует — правила и реестры локальные.
      - name: Доказательный контур
        run: python3 tools/check_evidence.py

      - name: Размеченные случаи доказательного контура
        run: python3 tools/test_evidence.py

      # Лестница боли и оффер карточки: цены против кассы, входные
      # ступени, лид, который продаёт решение, а не перечень файлов.
      - name: Лестница и оффер
        run: python3 tools/check_offer.py

      # Мастер-бэклог: порядок фаз и критерии приёмки. Ловит задачу в
      # работе при незакрытой зависимости — это ворота масштабирования.
      - name: Мастер-бэклог
        run: python3 tools/check_backlog.py

      # Контентный контур: схемы баз, крючок с числом без доказательства,
      # разметка ссылок внешних каналов.
      - name: Контентный контур
        run: python3 tools/content_router.py --check

      - name: Размеченные случаи контентного контура
        run: python3 tools/test_content_router.py

      # Денежная принадлежность страницы: категория и выход на комплект.
      # Метрик не требует — структура известна без замеров.
      - name: Money Impact
        run: python3 tools/money_impact.py

      - name: Связность по процессу
        run: python3 tools/money_graph.py

      - name: Остальные проверки репозитория
        run: |
          status=0
          for check in check_seo check_rss check_packages check_products \
                       check_free_materials check_covers; do
            echo "::group::$check"
            python3 "tools/$check.py" || status=1
            echo "::endgroup::"
          done
          exit $status

      # Цели счётчика: код и объявленный список обязаны сходиться. Метрика
      # по необъявленной цели молчит, а не ошибается, — расхождение не даёт
      # ни ошибки, ни пустого значения, и ловится только сверкой.
      # Карта товаров: цены из кассы, страницы существуют, повторов нет.
      # По ней подбирается допродажа и предложение после покупки, поэтому
      # мёртвая ссылка здесь стоит не вида, а денег.
      - name: Карта товаров
        run: python3 tools/build_product_map.py

      - name: Цели счётчика
        run: python3 tools/check_goals.py

      # «Когда применять» и «Кому подойдёт» на восемнадцати страницах
      # товаров собираются из одного источника. Разойтись они могут молча —
      # правка линейки в каталоге страницу товара не трогает, — поэтому
      # сверка стоит в гейте, а не только в хуке.
      - name: Первый экран страниц товаров
        run: python3 tools/build_product_fit.py --check

      # Куда уходит человек, дочитавший разбор. Один основной выход на
      # товар, а не пять и не ноль: страница, называющая четыре комплекта,
      # предлагает выбор вместо действия.
      - name: Выход страницы контента на товар
        run: python3 tools/content_product_map.py --check

      # Предпросмотр комплекта читается из самих .docx при каждой сборке.
      # Проверка держит главное его свойство: показанное на витрине —
      # это то, что покупатель получит. Правка файла комплекта без
      # пересборки страницы краснеет.
      - name: Предпросмотр комплектов
        run: python3 tools/build_preview.py --check

      # Возражения у цены. Разойтись с источником могут молча — правка
      # текста в данных страницу товара не трогает.
      - name: Возражения у цены
        run: python3 tools/build_objections.py --check

      # Карточки главной собираются из того же источника, что первый экран
      # страницы товара. Два описания одного комплекта расходятся на первой
      # же правке линейки, и расходятся молча.
      - name: Карточки решений на главной
        run: python3 tools/build_solution_cards.py --check

      # Повторная сборка не отменяет ручные правки манифестов. Причина
      # замером 15.08.2026: генератор `update_manifests.py` в изолированной
      # копии снимал оба допсоглашения D-02 из состава P2 и откатывал число
      # файлов полного комплекта 89 → 78. Репозиторий был прав, а одна
      # штатная команда возвращала его в неправое состояние.
      - name: Манифесты переживают повторную сборку
        run: python3 tools/test_manifest_rebuild.py

      # Касса и выдача — единственный код, где ошибка стоит денег покупателя.
      # Проверяется синтаксис всех PHP-файлов и регресс на гонку выдачи:
      # webhook и check-payment зовут выдачу одновременно, и до 15.08.2026
      # это давало покупателю два письма и потерянное обновление заказа.
      - name: PHP — синтаксис и гонка выдачи
        run: |
          for f in *.php; do php -l "$f" > /dev/null || exit 1; done
          echo "синтаксис PHP: без ошибок"
          php tools/test_order_lock.php
          php tools/test_price_authority.php

      # Юридический линт стоит предупреждением, а не блокировкой. Причина
      # названа прямо: инструмент не толкует право и не знает, ошибка ли
      # перед ним, — он знает только, что место не проверено человеком.
      # Останавливать выкладку правки вёрстки из-за непроверенного срока в
      # старой статье значит наказывать не того. Заведомо неверное
      # (INCORRECT, OUTDATED в data/legal/claims.csv) инструмент отдаёт
      # кодом 1 и здесь тоже не блокирует — блокировку включает владелец,
      # Нормативный гейт: изменённый юридический документ не уезжает без
      # сверки именно этой версии. Причина замером (D-06, 15.08.2026): шесть
      # документов комплекта P1 продавались, сверки по ним не было ни разу, и
      # нашлось это случайно — ни одна проверка про них не знала. Второй
      # дефект того же ряда: отчёт был свободным текстом и ни к чему не
      # привязан, поэтому документ можно изменить завтра и продавать со
      # вчерашним отчётом.
      #
      # Модель отсюда не вызывается: гейт объявлен набором без сети, а
      # правовые порталы из среды закрыты. Он проверяет наличие годного
      # результата, добывает результат отдельный заход normative-checker.
      #
      # Шаг блокирующий и сегодня красный — сознательно. Вся сверка D-06
      # прошла на цитатах из поисковой выдачи, официальные публикаторы были
      # недоступны, и выдать вторичному источнику полный PASS значило бы
      # завести ложную зелень. Снимается чтением официальной публикации либо
      # записью человека в data/legal/human-review.yaml.
      # Мутации идут перед гейтом намеренно. Гейт сегодня красный по
      # названной причине и останавливает прогон на себе; стой проверка
      # мутаций после него, её собственный регресс стал бы невиден — она
      # просто перестала бы запускаться. Проверка проверки должна работать
      # тогда, когда проверяемое сломано, иначе она бесполезна.
      # Разбор ответа публикатора. Сети не требует намеренно: официальные
      # публикаторы из среды закрыты, и починка, проверяемая только прогоном
      # на чужой машине, проверяется через сутки на круг. Замер 16.08.2026 —
      # прогон владельца дал 17 отказов подряд, и три причины из них
      # воспроизводятся здесь без единого запроса.
      - name: Разбор нормы из ответа публикатора
        run: python3 tools/test_legal_extract.py

      # PDF официального публикатора: Верховный Суд отдаёт постановление
      # файлом, а не разметкой. Разбор на стандартной библиотеке — pypdf в
      # рабочей среде не импортируется (тянет cryptography, тот падает), а
      # непроверяемая библиотека в доказательном контуре хуже своего кода.
      - name: Норма из PDF
        run: python3 tools/test_legal_pdf.py

      # Сколько раз добытчик ходит наружу и что делает с отказом. Сеть
      # подменена, обращения считаются: три нормы на одном акте обязаны
      # стоить одно обращение, а исчерпанный таймаут — не повторяться на
      # каждой норме заново.
      - name: Сетевое поведение добытчика
        run: python3 tools/test_legal_fetch.py

      # Полнота нормативного контура: правовая ссылка документа обязана
      # быть в реестре. Причина замером 16.08.2026: сверка шести документов
      # прошла по объявленному набору, и только после неё выяснилось, что
      # документы опираются ещё на четырнадцать норм, которых в контуре
      # нет — по ним сверки не было ни разу. Реестр отвечал на «что мы
      # проверили», а не на «на что документ опирается».
      - name: Полнота нормативного контура
        run: python3 tools/check_legal_coverage.py

      - name: Размеченные случаи полноты контура
        run: python3 tools/test_legal_coverage.py

      # Перенос вердикта на новую версию файла — единственное место контура,
      # где вердикт переезжает без захода проверяющего. Значит, единственное
      # место, через которое юридически значимую правку можно протащить.
      # Мутации доказывают, что нельзя: широкий токен, дата не о сверке,
      # подмена формулы, подмена нормы, дописанный абзац.
      # Правило 3 политики расхода (Р-060, ai-business-os). Ловит главное:
      # нового исполнителя, положенного рядом без записи в реестре, — так
      # молчаливое наследование модели и возвращается. Замер, из которого
      # правило выросло: 804 вызова исполнителей из 843 шли на сильной
      # модели не решением, а потому что модель не задана нигде.
      - name: Выбор модели объявлен у каждого исполнителя
        run: python3 tools/check_agent_models.py

      - name: Размеченные случаи выбора модели
        run: python3 tools/test_agent_models.py

      - name: Мутации переноса вердикта
        run: python3 tools/test_legal_rebind.py

      - name: Объявленные переносы вердикта годны
        run: python3 tools/legal_rebind.py

      - name: Мутации нормативного гейта
        run: python3 tools/test_normative_gate.py

      - name: Нормативный гейт
        run: python3 tools/normative_gate.py

      # Свежесть норм отделена от гейта намеренно: истёкший календарный срок
      # не должен ронять посторонний PR. Здесь он сообщается.
      - name: Свежесть норм (предупреждение)
        continue-on-error: true
        run: |
          echo "::group::какие нормы пора пересверить"
          python3 tools/normative_scope.py
          echo "::endgroup::"

      # когда очередь разобрана.
      - name: Юридический линт (предупреждение)
        continue-on-error: true
        run: |
          echo "::group::места, требующие проверки человеком"
          python3 tools/legal_claim_audit.py
          echo "::endgroup::"
