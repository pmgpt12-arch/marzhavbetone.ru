# Гейт качества: падает до того, как правка доедет до сервера.
#
# Зачем отдельно от хука `PostToolUse`: хук работает в сессии и его можно
# не запустить — правка руками, правка с телефона, чужой PR. Замер
# 14.08.2026: две битые ссылки на materialy/akt-skrytyh-rabot.html доехали
# до боевого сайта, одна из них — кнопка покупки в 404. Хук их не поймал бы
# в принципе: проверка тогда смотрела только каталог articles/.
#
# ПОЧЕМУ ЗДЕСЬ ДВЕ РАБОТЫ, А НЕ ШЕСТЬДЕСЯТ ШАГОВ. Прежде гейт был списком
# шагов Actions. Шаги идут последовательно на `bash -e`, поэтому первая
# упавшая проверка отменяла все следующие. Замер 27.08.2026 (аудит RC1):
# гейт умирал на седьмом шаге `test_search_demand`, который читает удалённый
# `data/seo/search-demand-rules.yaml`, и `check_packages`,
# `check_free_materials`, `check_rss` не исполнялись в CI ни на одном PR.
# Два дефекта захода P0 и регресс UTM в ленте Дзена нашлись локальным
# прогоном, а не гейтом: гейт существовал, но не проверял.
#
# Теперь список проверок живёт в `tools/ci_checks.yaml`, а прогоняет их
# `tools/run_checks.py` — каждую своим процессом. Падение одной не мешает
# остальным; код возврата считается в конце и только по блокирующим.
#
# Здесь только то, что не требует ни сети, ни секретов, ни браузера, и
# отвечает однозначным кодом. check_mobile.py сюда не входит: он требует
# playwright с хромиумом и без него честно молчит, а молчание в гейте
# читается как «прошло».
name: Проверки

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # ЭТА РАБОТА — КАНДИДАТ В ОБЯЗАТЕЛЬНЫЕ ДЛЯ ЗАЩИТЫ ВЕТКИ. Она и только она
  # отвечает за то, что видит посетитель и получает покупатель. Имя работы
  # менять нельзя, не поменяв настройку защиты: защита ссылается на имя.
  public-release:
    name: Публичный релиз
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Полная история нужна проверкам, которые берут прежнюю версию файла
      # из истории и доказывают равенством, что правка юридически пуста. На
      # клоне глубиной 1 `git show` отвечает кодом 128, и поймано это было
      # только прогоном в Actions: локально история полная, и шаг зелёный.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Pillow меряет размеры обложек (check_covers). PyYAML читает реестр
      # проверок и данные карты товаров. Больше зависимостей вне
      # стандартной библиотеки на весь набор нет — замер по импортам.
      - name: Поставить Pillow и PyYAML
        run: python3 -m pip install --quiet pillow pyyaml

      - name: Проверки публичного контура
        run: python3 tools/run_checks.py --class public

  # Внутренняя кухня: нормативный контур, исполнители, производство роликов,
  # заготовки каналов. К выложенному сайту отношения не имеет, и красным
  # цветом релиз держать не должна — поэтому `continue-on-error`.
  #
  # Большинство этих проверок читает каталоги, удалённые при открытии
  # репозитория (a1373b0). Раннер их не запускает и печатает строкой
  # «НЕТ ДАННЫХ» с именем недостающего файла: это не тихий пропуск, и он
  # снимется сам, когда файл вернётся. Восстанавливать данные ради старого
  # теста не нужно.
  internal:
    name: Внутренний контур (не блокирует)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Поставить Pillow и PyYAML
        run: python3 -m pip install --quiet pillow pyyaml

      - name: Проверки внутреннего контура
        run: python3 tools/run_checks.py --class internal
