# Проверки рендером: то, что видно только браузеру.
#
# Отдельно от `checks.yml` намеренно. Тот гейт объявлен как набор без сети,
# секретов и браузера — и это верное решение: он быстрый и запускается на
# каждый push. Ставить в него хромиум значило бы переписать его условие
# молча.
#
# Почему такой прогон вообще нужен. Замер 15.08.2026: главная уходила вбок
# на 33px при 1366px ширины и занимала 25 475px высоты — 33 экрана. Ни одна
# текстовая проверка этого не видела и увидеть не могла: разметка
# правильная, ссылки целы, схемы сходятся. Причина — правило
# `overflow-wrap: normal` у заголовка карточки: длинному названию комплекта
# запрещено переноситься, и колонка распирала страницу целиком. Такие
# дефекты ловит только рендер.
#
# Прогон не блокирует выкладку: `deploy.yml` проверок браузером не
# запускает. Сделать их блокирующими — решение владельца о порядке
# выпуска, и оно ещё не принято.
name: Проверки рендером

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      checks:
        description: Ограниченный повтор затронутой проверки
        type: choice
        default: all
        options: [all, contract, cart, attribution]

concurrency:
  group: render-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Хромиум ставится вместе с playwright: без него обе проверки
      # отвечают кодом 2 «не запускалась», а не «прошла».
      - name: Поставить playwright с хромиумом
        id: browser
        timeout-minutes: 5
        run: |
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/nsp-playwright-browsers"
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          python3 -m pip install --quiet playwright pillow
          # Use the renderer matched to Playwright for exact pixel comparisons.
          # The runner already has Chrome's runtime libraries; avoid apt downloads.
          timeout 240s python3 -m playwright install --only-shell chromium

      - name: Контракт браузерной проверки
        if: ${{ !cancelled() && steps.browser.conclusion == 'success' }}
        run: python3 tools/test_desktop_contract.py

      - name: Сохранить различающиеся снимки контракта
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-contract-${{ github.run_id }}
          path: render-contract-artifacts/
          if-no-files-found: ignore
          retention-days: 7

      # Карта сайта и фид собираются при выкладке, а проверки на них
      # смотрят. Без сборки здесь они мерят вчерашний артефакт.
      - name: Собрать генерируемое
        run: |
          python3 tools/build_sitemap.py --write
          python3 tools/build_rss.py --write

      - name: Телефон — 390px
        if: ${{ !cancelled() && steps.browser.conclusion == 'success' && (github.event_name != 'workflow_dispatch' || inputs.checks == 'all') }}
        run: python3 tools/check_mobile.py

      - name: Десктоп — 1366, 1440, 1600, 1920
        if: ${{ !cancelled() && steps.browser.conclusion == 'success' && (github.event_name != 'workflow_dispatch' || inputs.checks == 'all') }}
        run: python3 tools/check_desktop.py

      # Корзина проверяется кликом, а не чтением разметки: связь страницы
      # товара с кассой держится значениями `data-sku` и `data-price`, и
      # разойтись они могут молча. Сайт здесь отдаётся встроенным сервером
      # PHP — `app.js` подключён через `app-script.php`, и без PHP браузер
      # получил бы исходник вместо кода.
      - name: Корзина — sku и цена
        if: ${{ !cancelled() && steps.browser.conclusion == 'success' && (github.event_name != 'workflow_dispatch' || inputs.checks == 'all' || inputs.checks == 'cart') }}
        run: python3 tools/test_cart.py

      # Атрибуция проверяется тем же способом и по той же причине: метку
      # ставит отправка поста, а несут её дальше пять файлов, и разрыв в
      # любом обнуляет ответ на вопрос, какой канал принёс деньги. Покупка
      # не совершается — заказ не создаётся, счётчик подменён заглушкой.
      - name: Атрибуция — от метки канала до цели purchase
        if: ${{ !cancelled() && steps.browser.conclusion == 'success' && (github.event_name != 'workflow_dispatch' || inputs.checks == 'all' || inputs.checks == 'attribution') }}
        run: python3 tools/test_attribution_chain.py
