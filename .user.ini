; Настройки PHP для боевого сайта.
; Файл читается, когда PHP работает как CGI/FastCGI (режим хостинга reg.ru).
; Если PHP собран модулем — файл просто игнорируется, вреда нет.

; Не показывать технические ошибки посетителям: они раскрывают пути на
; сервере и детали кода. Ошибки при этом продолжают писаться в лог хостинга.
display_errors = Off
display_startup_errors = Off
log_errors = On
