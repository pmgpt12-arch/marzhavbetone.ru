# ============================================================
# NGINX КОНФИГ ДЛЯ marzhavbetone.ru
# Скопируйте этот блок в server { } вашего nginx
# или передайте хостинг-провайдеру как есть
# ============================================================

server {
    # --- 1. ПРИЁМ ВСЕХ ЗАПРОСОВ (временно, для редиректов) ---
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name marzhavbetone.ru www.marzhavbetone.ru;

    # --- 2. SSL-СЕРТИФИКАТЫ (пути подставьте под свои) ---
    ssl_certificate     /etc/letsencrypt/live/marzhavbetone.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marzhavbetone.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers         'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';

    # --- 3. 301 РЕДИРЕКТЫ: все зеркала → https://marzhavbetone.ru ---
    # www → без www
    if ($host = 'www.marzhavbetone.ru') {
        return 301 https://marzhavbetone.ru$request_uri;
    }
    # HTTP → HTTPS
    if ($scheme = 'http') {
        return 301 https://marzhavbetone.ru$request_uri;
    }

    # --- 4. HSTS (Strict-Transport-Security) ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # --- 5. КОРНЕВАЯ ДИРЕКТОРИЯ ---
    root /var/www/marzhavbetone.ru;
    index index.html;
    charset utf-8;

    # --- 6. ОПТИМИЗАЦИЯ СТАТИКИ (sendfile, tcp_nopush, gzip) ---
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # --- 7. GZIP (уже включён — оставить или усилить) ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # --- 7.1 СНЯТЫЕ С ПРОДАЖИ СТРАНИЦЫ ---
    # Полный комплект снят 11.08.2026 решением владельца. Страница стояла в
    # sitemap с приоритетом 1.0, то есть её адрес уже мог уйти в выдачу и в
    # переписку. Отдавать по нему 404 значит терять пришедшего: он искал
    # документы, а не именно этот комплект. 301 на каталог — временный товар
    # снят, но постоянный ответ по адресу: страницы в этом виде больше нет.
    location = /products/p6-polniy-komplekt.html {
        return 301 https://marzhavbetone.ru/#catalog;
    }

    # --- 8. КЕШИРОВАНИЕ В БРАУЗЕРЕ (Cache-Control) ---
    # HTML-страницы — короткий кеш (чтобы быстро обновлять)
    location ~* \.(html|htm)$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # CSS, JS — 1 неделя
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
        log_not_found off;
    }

    # Изображения, шрифты, иконки — 1 месяц
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        log_not_found off;
    }

    # PDF, ZIP и прочие файлы — 1 неделя
    location ~* \.(pdf|zip|doc|docx|xls|xlsx)$ {
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        log_not_found off;
    }

    # --- 9. БЕЗОПАСНОСТЬ: скрыть версию nginx ---
    server_tokens off;

    # --- 10. ЗАПРЕТ ДОСТУПА к скрытым файлам ---
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # --- 11. ОБРАБОТКА 404 (опционально: редирект на главную) ---
    error_page 404 /404.html;

    # --- 12. ОСНОВНОЙ LOCATION ---
    location / {
        try_files $uri $uri/ =404;
    }
}
