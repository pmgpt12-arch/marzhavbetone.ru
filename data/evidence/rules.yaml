# Правила доказательного контура: классы источников, уверенность, гейт.
#
# Заданы владельцем в постановке этапа Evidence & Insight Engine. Здесь они
# выражены так, чтобы их проверял `tools/check_evidence.py`, а не память.
#
# Смысл всего файла в одном: утверждение о мире, за которым нет выборки и
# арифметики, публиковать нельзя. Правило дешёвое, пока баз нет, и очень
# дорогое потом — придуманный процент в юридической теме стоит доверия,
# которое собирается годами.

# --- 1. Иерархия источников -------------------------------------------------
# Для юридического вывода класса D или E самих по себе недостаточно. Если
# первичный источник существует — берётся он.
source_classes:
  SOURCE_A: первичный официальный источник (кодекс, закон, постановление)
  SOURCE_B: судебный акт или официальный реестр
  SOURCE_C: профессиональный вторичный источник
  SOURCE_D: СМИ или отраслевой сайт
  SOURCE_E: форум, соцсеть, мнение пользователя

# Классы, которых недостаточно для вывода о праве.
insufficient_for_legal_claim: [SOURCE_D, SOURCE_E]

# --- 2. Уверенность ---------------------------------------------------------
# LOW нельзя публиковать как установленную закономерность. Можно держать
# гипотезой для следующего исследования.
confidence:
  HIGH:
    требует_классы: [SOURCE_A, SOURCE_B]
    минимальная_выборка: 30
    описание: выборка достаточна, источники первичные, данные перепроверены
  MEDIUM:
    требует_классы: [SOURCE_A, SOURCE_B, SOURCE_C]
    минимальная_выборка: 10
    описание: закономерность видна, выборка ограничена, формулировка осторожная
  LOW:
    требует_классы: []
    минимальная_выборка: 0
    описание: наблюдение, данных недостаточно
    публикация_запрещена: true

# --- 3. Гейт публикации -----------------------------------------------------
# Любой критический пункт FAIL — публикация блокируется.
quality_gate:
  - id: SOURCE_VALID
    вопрос: источник существует, открывается и относится к делу
    критический: true
  - id: DATA_COMPLETE
    вопрос: выборка сохранена целиком, а не в пересказе
    критический: true
  - id: CALCULATION_CORRECT
    вопрос: числитель, знаменатель и результат сходятся арифметически
    критический: true
  - id: CLAIM_SUPPORTED
    вопрос: утверждение не шире того, что показывает выборка
    критический: true
  - id: DENOMINATOR_SCOPE
    вопрос: знаменатель взят из всей выборки, а не из удобной её части
    критический: true
  - id: LIMITATIONS_DISCLOSED
    вопрос: ограничения названы на самой странице
    критический: true
  - id: LEGAL_INTERPRETATION_VERIFIED
    вопрос: толкование проверено вторым исполнителем, не автором
    критический: true
  - id: MONEY_IMPACT_REAL
    вопрос: вывод меняет действие подрядчика, а не только его осведомлённость
    критический: false
  - id: NO_OVERCLAIM
    вопрос: корреляция не выдана за причину
    критический: true

# --- 4. Ловушка знаменателя -------------------------------------------------
# Записана отдельно, потому что это самая правдоподобная из ошибок и
# единственная, которую владелец привёл разобранным примером.
#
# Данные: 18 из 27 проигравших подрядчиков не имели письменного поручения.
# Неверный вывод: «без письменного поручения подрядчик проигрывает в 67%».
# Почему неверно: знаменатель — только проигравшие дела. Чтобы говорить о
# влиянии на исход, нужно распределение признака во всей выборке, включая
# выигранные.
#
# Отсюда требование: у каждого расчёта объявляется, из чего взят
# знаменатель. Значение `subset` разрешено только для утверждения о самом
# подмножестве («среди проигравших…»), но не о влиянии на исход.
denominator_scopes:
  full_sample: вся выборка исследования
  subset: часть выборки — вывод допустим только о самой этой части
  unknown: не установлено — публикация запрещена

# Обороты, которыми утверждение о подмножестве превращается в утверждение
# о влиянии. При `denominator_scope: subset` их быть не должно.
causal_markers:
  - "приводит к"
  - "влияет на"
  - "проигрывает в"
  - "выигрывает в"
  - "определяет исход"
  - "из-за этого"
  - "поэтому суд"
  - "гарантирует"
