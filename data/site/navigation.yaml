# Единственный источник шапки сайта.
#
# ЗАЧЕМ ФАЙЛ. Замер 16.08.2026 (`tools/check_nav.py --inventory`): на 84
# страницах было **десять** разных шапок. Пять страниц не имели шапки вовсе,
# один и тот же раздел назывался «Калькулятор» и «Калькуляторы», «Каталог» и
# «Решения», «Разборы» и «Все разборы». Шапка размножалась копированием, и
# каждая новая страница наследовала ту, откуда её скопировали.
#
# Отсюда правило: шапка не пишется руками ни на одной странице. Здесь данные,
# `tools/build_nav.py --write` их раскладывает, `tools/check_nav.py` сверяет.
#
# ПОЧЕМУ ССЫЛКИ АБСОЛЮТНЫЕ. Шапка одинакова на всех уровнях вложенности —
# `/articles/`, `/materialy/`, `/products/`. Относительный адрес пришлось бы
# считать от каждой страницы, и он ломался бы ровно там, где его забыли
# пересчитать. Якоря тоже абсолютные: `#author` на странице товара указывает
# в никуда, `/#author` — на раздел главной.

brand:
  text: маржа в бетоне
  mark: М
  href: /
  aria: Маржа в бетоне, на главную

# Порядок — путь покупателя, а не алфавит: сначала «что у меня за случай»,
# потом «чем закрыть», потом справочное.
items:
  - id: diagnostika
    text: Диагностика
    href: /diagnostika.html
  - id: katalog
    text: Каталог
    href: /katalog.html
  - id: besplatno
    text: Бесплатно
    href: /materialy/
  - id: kalkulyatory
    # Множественное число проверено содержимым, а не вкусом: на
    # kalkulyator.html две вкладки `.calculator-panel`, то есть калькуляторов
    # действительно несколько. Единственное число стояло на пяти вариантах
    # шапки из десяти.
    text: Калькуляторы
    href: /kalkulyator.html
  - id: razbory
    text: Разборы
    href: /articles/
  - id: o-proekte
    text: О проекте
    href: /#author

# Один призыв на всю шапку. Раньше их было четыре — «Найти решение»,
# «Разобрать объект», «Подобрать комплект», «Диагностика», — и последний
# дублировал пункт навигации, то есть занимал место, ничего не добавляя.
#
# `/#contact` выбран потому, что это единственное действие, доступное с любой
# страницы. Прежний призыв главной вёл на `#situations`; он остаётся на самой
# главной отдельной кнопкой первого экрана (`.hero-actions .button`), и путь
# к выбору ситуации не потерян.
cta:
  text: Разобрать объект
  href: /#contact

# Соцсети в основную навигацию не входят (указание владельца 16.08.2026):
# Telegram стоял в шапке на 74 страницах и вытеснял разделы сайта — на
# странице разбора в шапке были «Все разборы, Каталог, Telegram» и ни
# диагностики, ни бесплатных материалов, ни калькуляторов. Каналы остаются
# в плавающем блоке `aside.social-dock` и в подвале.
social_in_nav: false

# Какой пункт подсвечивается. Правила читаются сверху вниз, первое
# совпадение выигрывает; префикс каталога — со слешем на конце.
active:
  - prefix: products/
    id: katalog
  - prefix: articles/
    id: razbory
  - prefix: materialy/
    id: besplatno
  - prefix: demo/
    id: besplatno
  - page: diagnostika.html
    id: diagnostika
  - page: katalog.html
    id: katalog
  - page: kalkulyator.html
    id: kalkulyatory

# Корзина живёт не везде: она нужна там, где есть что положить. Список
# ведётся отдельно, потому что «есть кнопка корзины» — свойство торговой
# страницы, а не шапки. Добавлять её на разбор незачем, убирать с витрины
# нельзя.
cart_on:
  - index.html
  - katalog.html
  - prefix: products/

# Страницы, которые шапку не получают. Здесь их нет: раньше в этот список
# просились юридические (contacts, offer, payment-delivery, privacy, refund),
# но `.topbar` описан в styles.css, а его грузят и они — то есть шапка им
# ничего не стоит, а без неё с них не было пути никуда, кроме «На главную».
skip: []
