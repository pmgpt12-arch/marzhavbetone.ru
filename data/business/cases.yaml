# Блок «Изнутри стройки»: факты каждой карточки и статья, из которой они
# взяты. Здесь, а не в разметке, — чтобы каждое поле можно было сверить с
# источником, а не искать по HTML.
#
# ГЛАВНОЕ, ЧТО НАДО ЗНАТЬ ПРО ЭТОТ ФАЙЛ.
#
# ПОПРАВКА 15.08.2026. Здесь стояло «документированный случай один».
# Это неверно, и ошибка была в том, где я искал: только в articles/
# этого репозитория. Настоящие кейсы лежат в другом — ai-business-os,
# `projects/marzha_v_betone/research/cases/`:
#
#   CASE-001 «Неоплата закрытых объёмов» — четыре дома, ~4,5 года,
#            суммы 28 / 8 / 1,8 млн ₽, подтверждены владельцем 07.08.2026;
#   CASE-002 «Расчёт метрами: уступка ДДУ с пустым эскроу» — ~250 млн ₽
#            остаток работ, скидка 30% от метра, отказ в ЗОС;
#            подтверждён владельцем 08.08.2026;
#   CASE-003 «Навязанная вина» — долг УК ~50 млн, претензия ~21 млн,
#            пул контрактов 480 млн, 2022–2025. Принят PR #147.
#
# Разрешения на публикацию записаны в самих кейсах: третье лицо, без
# названий компаний и без реквизитов судебных дел, суммы как в рассказе.
#
# ЧТО ИЗ ЭТОГО СЛЕДУЕТ ДЛЯ БЛОКА. Кейсов три, но статей сайта,
# рассказывающих кейс, — одна:
#
#   CASE-003 → articles/pretenziya-za-chuzhuyu-kommunalku.html — кейс
#              рассказан, факты в лиде. Карточка 01 стоит верно;
#   CASE-002 → articles/dostraivali-za-metry-otkaz-v-zos.html — перенесён
#              15.08.2026. Прежний разбор articles/raschet-metrami.html
#              остаётся: он про механизм (эскроу, 214-ФЗ, уступка), а не
#              про случай, и чисел кейса в нём нет;
#   CASE-001 → articles/dolg-zakryvali-na-sleduyushchem-obekte.html —
#              перенесён 15.08.2026.
#
# Правило, из-за которого это делалось именно в таком порядке: реквизиты
# кейса нельзя поставить на карточку, ведущую на страницу, которая этого
# случая не рассказывает. Карточка обещает одно, страница даёт другое.
# Сначала материал, потом карточка.
#
# Теперь все три карточки — документированные случаи, и маркер «реальные
# события» стоит на каждой по факту. Архетип «Подписанная КС-2 не значит,
# что вам заплатят» с полосы снят: он остаётся разбором на сайте, но
# место в блоке кейсов занимал по нехватке кейсов, а не по существу.

cases:
  - slug: pretenziya-za-chuzhuyu-kommunalku
    kind: case                    # документированное событие
    label: ДЕЛО 01
    marker: РЕАЛЬНЫЕ СОБЫТИЯ
    tag: ПРЕТЕНЗИИ / НАВЯЗАННАЯ ВИНА
    title: Претензия за чужую коммуналку
    # Каждое поле ниже — дословно из лида статьи.
    period: конец 2025
    parties: подрядчик по светопрозрачным конструкциям ← генподрядчик
    figure: "~21 млн ₽"
    figure_note: претензия
    error_point: >
      Долг управляющей компании за непроданные квартиры застройщика
      разложили на подрядчиков «пропорционально количеству замечаний
      по качеству».

  - slug: dolg-zakryvali-na-sleduyushchem-obekte
    kind: case                    # CASE-001, перенесён на сайт 15.08.2026
    label: ДЕЛО 02
    marker: РЕАЛЬНЫЕ СОБЫТИЯ
    tag: НЕОПЛАТА / ДОЛГ НА СЛЕДУЮЩЕМ ОБЪЕКТЕ
    title: Долг закрывали на следующем объекте
    period: около 4,5 лет, четыре дома
    parties: отделочный субподрядчик ← генподрядчик ← застройщик
    figure: "28 млн ₽"
    figure_note: долг
    error_point: >
      Долг вели «в учёте» под обещание закрыть его на следующем объекте:
      новый контракт заменил собой оплату, а к развязке взыскивать
      оказалось не с кого.

  - slug: dostraivali-za-metry-otkaz-v-zos
    kind: case                    # CASE-002, перенесён на сайт 15.08.2026
    label: ДЕЛО 03
    marker: РЕАЛЬНЫЕ СОБЫТИЯ
    tag: РАСЧЁТ МЕТРАМИ / ОТКАЗ В ЗОС
    title: Достраивали за метры
    period: полтора года на проектном финансировании, остановка за полгода до ввода
    parties: пул подрядчиков ← застройщик на проектном финансировании ← банк
    figure: "~250 млн ₽"
    # Не потеря, а объём под риском: развязка не наступила, номера дела нет.
    # Ставить сюда «потеряли» значило бы выдать прогноз за состоявшийся факт.
    figure_note: остаток работ, взятый за метры
    error_point: >
      Оплату взяли правами по ДДУ, не проверив эскроу: вместе с правами
      к подрядчикам перешла обязанность внести деньги на счёт — то есть
      заплатить ещё раз за собственную оплату.
