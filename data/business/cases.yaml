# Блок «Изнутри стройки»: факты каждой карточки и статья, из которой они
# взяты. Здесь, а не в разметке, — чтобы каждое поле можно было сверить с
# источником, а не искать по HTML.
#
# ГЛАВНОЕ, ЧТО НАДО ЗНАТЬ ПРО ЭТОТ ФАЙЛ.
#
# ПОПРАВКА 15.08.2026. Здесь стояло «документированный случай один».
# Это неверно, и ошибка была в том, где я искал: только в articles/
# этого репозитория. Настоящие кейсы лежат в другом — ai-business-os,
# `projects/marzha_v_betone/research/cases/`:
#
#   CASE-001 «Неоплата закрытых объёмов» — четыре дома, ~4,5 года,
#            суммы 28 / 8 / 1,8 млн ₽, подтверждены владельцем 07.08.2026;
#   CASE-002 «Расчёт метрами: уступка ДДУ с пустым эскроу» — ~250 млн ₽
#            остаток работ, скидка 30% от метра, отказ в ЗОС;
#            подтверждён владельцем 08.08.2026;
#   CASE-003 «Навязанная вина» — долг УК ~50 млн, претензия ~21 млн,
#            пул контрактов 480 млн, 2022–2025. Принят PR #147.
#
# Разрешения на публикацию записаны в самих кейсах: третье лицо, без
# названий компаний и без реквизитов судебных дел, суммы как в рассказе.
#
# ЧТО ИЗ ЭТОГО СЛЕДУЕТ ДЛЯ БЛОКА. Кейсов три, но статей сайта,
# рассказывающих кейс, — одна:
#
#   CASE-003 → articles/pretenziya-za-chuzhuyu-kommunalku.html — кейс
#              рассказан, факты в лиде. Карточка 01 стоит верно;
#   CASE-002 → articles/raschet-metrami.html — статья есть, но она про
#              механизм (эскроу, 214-ФЗ, уступка); чисел кейса в ней нет;
#   CASE-001 → статьи, рассказывающей случай, на сайте нет.
#
# Поэтому реквизиты кейса нельзя поставить на карточку, ведущую на
# страницу, которая этого случая не рассказывает: карточка обещает одно,
# страница даёт другое. Сначала материал, потом карточка.
#
# Ближайший шаг — перенести CASE-001 и CASE-002 в статьи сайта по
# порядку research/cases/README.md, и только после этого поднять
# карточки 02 и 03 до полного досье с маркером «РЕАЛЬНЫЕ СОБЫТИЯ».
#
# До этого `kind` различает: маркер настоящего дела стоит там, где
# страница за карточкой действительно рассказывает случай.

cases:
  - slug: pretenziya-za-chuzhuyu-kommunalku
    kind: case                    # документированное событие
    label: ДЕЛО 01
    marker: РЕАЛЬНЫЕ СОБЫТИЯ
    tag: ПРЕТЕНЗИИ / НАВЯЗАННАЯ ВИНА
    title: Претензия за чужую коммуналку
    # Каждое поле ниже — дословно из лида статьи.
    period: конец 2025
    parties: подрядчик по светопрозрачным конструкциям ← генподрядчик
    figure: "~21 млн ₽"
    figure_note: претензия
    error_point: >
      Долг управляющей компании за непроданные квартиры застройщика
      разложили на подрядчиков «пропорционально количеству замечаний
      по качеству».

  - slug: genpodryadchik-zarabatyvaet-na-vas
    kind: model                   # расчёт от допущений, не событие
    label: РАЗБОР 02
    marker: РАСЧЁТ МЕХАНИЗМА
    tag: УДЕРЖАНИЕ / МАРЖА В МОРОЗИЛКЕ
    title: Генподрядчик зарабатывает на вас больше, чем на стройке
    period: null
    parties: субподрядчик ← генподрядчик
    figure: "5–10%"
    figure_note: удержание   # коротко: подпись стоит в узкой колонке
    error_point: >
      Удержание работает как беспроцентный кредит генподрядчику: деньги
      заморожены на два года, а оборотные вы берёте в банке под процент.

  - slug: podpisannaya-ks2-ne-znachit-chto-zaplatyat
    kind: model
    label: РАЗБОР 03
    marker: ЧТО ГОВОРИТ ДОГОВОР
    tag: ОПЛАТА / КС-2 ПОДПИСАНА, ДЕНЕГ НЕТ
    title: Подписанная КС-2 не значит, что вам заплатят
    period: null
    parties: субподрядчик ← генподрядчик ← заказчик
    figure: null
    figure_note: null
    error_point: >
      Условие «оплата после получения средств от заказчика» переносит
      чужой риск на вас: подписанные акты долг подтверждают, а срок
      оплаты не запускают.
