# Блок «Изнутри стройки»: факты каждой карточки и статья, из которой они
# взяты. Здесь, а не в разметке, — чтобы каждое поле можно было сверить с
# источником, а не искать по HTML.
#
# ГЛАВНОЕ, ЧТО НАДО ЗНАТЬ ПРО ЭТОТ ФАЙЛ. Из трёх материалов блока
# документированный случай — один. Замер 15.08.2026 по текстам статей:
#
#   · pretenziya-za-chuzhuyu-kommunalku — реальное событие: период,
#     стороны, сумма претензии, механизм. Всё названо в самой статье;
#   · genpodryadchik-zarabatyvaet-na-vas — расчётная модель: «если вы
#     субподрядчик с оборотом 100 млн ₽ в год…». Числа там параметры
#     допущения, а не факты дела;
#   · podpisannaya-ks2-ne-znachit-chto-zaplatyat — архетип во втором
#     лице: «вы выполнили работы на 8 млн ₽». Сценарий, не событие.
#
# Отсюда `kind`. Пометить все три как «реальные события» значило бы
# утверждать неправду про две трети блока — ровно то, что запрещено
# заданием («не придумывать: суммы, даты, результаты»). Вид карточки у
# всех трёх один и статус у блока высокий; расходятся только маркеры,
# и расходятся по факту.
#
# Что делать дальше, если нужны три настоящих кейса: написать их. Это
# работа с материалом, а не с вёрсткой, и подменить её оформлением
# нельзя.

cases:
  - slug: pretenziya-za-chuzhuyu-kommunalku
    kind: case                    # документированное событие
    label: ДЕЛО 01
    marker: РЕАЛЬНЫЕ СОБЫТИЯ
    tag: ПРЕТЕНЗИИ / НАВЯЗАННАЯ ВИНА
    title: Претензия за чужую коммуналку
    # Каждое поле ниже — дословно из лида статьи.
    period: конец 2025
    parties: подрядчик по светопрозрачным конструкциям ← генподрядчик
    figure: "~21 млн ₽"
    figure_note: претензия
    error_point: >
      Долг управляющей компании за непроданные квартиры застройщика
      разложили на подрядчиков «пропорционально количеству замечаний
      по качеству».

  - slug: genpodryadchik-zarabatyvaet-na-vas
    kind: model                   # расчёт от допущений, не событие
    label: РАЗБОР 02
    marker: РАСЧЁТ МЕХАНИЗМА
    tag: УДЕРЖАНИЕ / МАРЖА В МОРОЗИЛКЕ
    title: Генподрядчик зарабатывает на вас больше, чем на стройке
    period: null
    parties: субподрядчик ← генподрядчик
    figure: "5–10%"
    figure_note: удержание   # коротко: подпись стоит в узкой колонке
    error_point: >
      Удержание работает как беспроцентный кредит генподрядчику: деньги
      заморожены на два года, а оборотные вы берёте в банке под процент.

  - slug: podpisannaya-ks2-ne-znachit-chto-zaplatyat
    kind: model
    label: РАЗБОР 03
    marker: ЧТО ГОВОРИТ ДОГОВОР
    tag: ОПЛАТА / КС-2 ПОДПИСАНА, ДЕНЕГ НЕТ
    title: Подписанная КС-2 не значит, что вам заплатят
    period: null
    parties: субподрядчик ← генподрядчик ← заказчик
    figure: null
    figure_note: null
    error_point: >
      Условие «оплата после получения средств от заказчика» переносит
      чужой риск на вас: подписанные акты долг подтверждают, а срок
      оплаты не запускают.
