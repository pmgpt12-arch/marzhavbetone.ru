# Диагностика: вопросы и сценарии, ведущие к одному комплекту.
#
# Смысл в том, чтобы человек не выбирал из пятнадцати товаров сам. Он
# описывает положение, а маршрут выбирается за него.
#
# Порядок вопросов идёт от денег назад по процессу — как в money-impact.
# Первым спрашивается банкротство: если контрагент неплатёжеспособен,
# обычный маршрут «претензия — иск» не работает, и все остальные ответы
# уже неважны.
#
# Каждый сценарий обязан заканчиваться одной болью. Комплект и бесплатный
# материал берутся из `money-pains.yaml`, здесь не дублируются — иначе
# завёлся бы второй источник истины и он разошёлся бы с каталогом.

questions:
  - id: bankrot
    text: Есть признаки банкротства или неплатёжеспособности контрагента?
    hint: Заявление о банкротстве, публикации на Федресурсе, массовые иски,
          исполнительные производства.
  - id: signed
    text: Договор уже подписан?
  - id: done
    text: Работы выполнены?
  - id: extra
    text: Спорный объём выполнен сверх договора?
    hint: Работы, о которых просили устно или «потом оформим».
  - id: accepted
    text: Работы приняты, КС-2 подписана?
  - id: docs
    text: Документация возвращена с замечаниями или не принята?
  - id: overdue
    text: Срок оплаты по договору наступил?
  - id: retention
    text: Часть суммы удержана — гарантийное удержание, штраф, зачёт?

# Сценарии проверяются сверху вниз, первый подошедший выигрывает.
# `any` означает, что ответ на вопрос не важен.
scenarios:
  - id: S-7
    pain: MP-7
    when: {bankrot: yes}
    verdict: Контрагент неплатёжеспособен
    means: >
      Обычный маршрут «претензия — иск» здесь не работает: требование
      заявляется в деле о банкротстве и в ограниченный срок. Срок считается
      не с того дня, когда вы узнали, а от публикации сведений о процедуре.

  - id: S-6
    pain: MP-6
    when: {bankrot: no, signed: no}
    verdict: Договор ещё не подписан
    means: >
      Условия оплаты, приёмки и удержаний правятся только сейчас. После
      подписи каждая из этих строк стоит денег, и правится она уже спором.

  - id: S-3
    pain: MP-3
    when: {bankrot: no, signed: yes, done: yes, extra: yes}
    verdict: Спор об оплате дополнительных работ
    means: >
      Решает не факт выполнения, а доказанность поручения до начала работ.
      Проверять надо, чем зафиксировано задание и согласована ли стоимость.

  - id: S-5
    pain: MP-5
    when: {bankrot: no, signed: yes, done: yes, extra: no, docs: yes}
    verdict: Документация блокирует приёмку и оплату
    means: >
      Пока комплект не принят, не двигаются ни приёмка, ни срок оплаты.
      Возвращают почти всегда по одним и тем же причинам, и они проверяемы
      у себя до передачи.

  - id: S-2
    pain: MP-2
    when: {bankrot: no, signed: yes, done: yes, extra: no, docs: no,
           accepted: no}
    verdict: Работы выполнены, но не приняты
    means: >
      Срок оплаты не начинает течь, пока работы не приняты или пока не
      сработал порядок одностороннего оформления. Спор идёт о приёмке, а
      не о деньгах — пока.

  - id: S-4
    pain: MP-4
    when: {bankrot: no, signed: yes, done: yes, extra: no, docs: no,
           accepted: yes, retention: yes}
    verdict: Часть суммы удержана
    means: >
      Спор не о выполнении, а об основании и сроке возврата. Проверять надо
      условие договора, событие отсчёта срока и обоснованность удержания.

  - id: S-1
    pain: MP-1
    when: {bankrot: no, signed: yes, done: yes, extra: no, docs: no,
           accepted: yes, retention: no, overdue: yes}
    verdict: Просрочка оплаты принятых работ
    means: >
      Работы приняты, срок прошёл, удержаний нет — предмет спора только
      деньги. Дальше порядок один: сверить свои документы, зафиксировать
      просрочку, предъявить требование.

  - id: S-0
    pain: MP-1
    when: {bankrot: no, signed: yes, done: yes, extra: no, docs: no,
           accepted: yes, retention: no, overdue: no}
    verdict: Работы приняты, срок оплаты ещё не наступил
    means: >
      Требовать пока нечего, и это хорошая новость: время есть на то, чтобы
      проверить собственные документы до наступления срока. Половина
      отказов в оплате держится на расхождениях в них, а не на нежелании
      платить.
