# Лестница по денежным болям: бесплатник → вход → комплект → допродажа.
#
# Построена из фактического каталога (`products-config.php`) и фактических
# бесплатных материалов, а не из представления о них. Цены — копейки в
# конфиге, здесь рубли; менять их и состав каталога может только владелец
# (Р-006), инструмент называет разрывы и предлагает.
#
# Замер 14.08.2026: товаров на продаже 15 — три входных по 990 ₽,
# одиннадцать комплектов 1 990…2 990 ₽, один за 9 900 ₽. Составной
# комплект p6 за 6 990 ₽ снят с продажи решением владельца 11.08.2026 и
# закомментирован в конфиге, поэтому слоя допродажи сейчас нет ни одного.
#
# Входные ступени t1, t2, t3 заведены не для полноты картины: в конфиге
# записано, что между бесплатным материалом и комплектом за 2 990 ₽ не
# было ничего, и холодный посетитель должен был сразу отдать полную цену.
# Это ровно принцип «слишком большой шаг от статьи к покупке», уже
# применённый в трёх кластерах из семи.

pains:

  MP-1:
    title: Работы выполнены — денег нет
    money_impact: MI-1
    free: [materialy/dengi.html]
    entry: {sku: t1, price: 990,
            name: "Претензия, расчёт процентов, порядок действий"}
    core: {sku: p1, price: 2490,
           name: "Акты выполненных работ, КС-2 и КС-3: закрытие и взыскание"}
    cross_sell: [p5, p2]
    # Искового заявления во входном нет намеренно: оно в p1 и есть
    # причина доплатить (решение владельца 31.07.2026).
    ladder_complete: true

  MP-2:
    title: Не принимают и не подписывают КС
    money_impact: MI-2
    free: [materialy/vozvrat-ks.html]
    entry: {sku: t3, price: 990,
            name: "Односторонний акт или зачёт: возражения в срок"}
    core: {sku: p3, price: 1990,
           name: "КС-2 без возврата: сдайте с первой попытки"}
    cross_sell: [p10, p12, p1]
    ladder_complete: true

  MP-3:
    title: Не оплачивают дополнительные работы
    money_impact: MI-3
    free: [materialy/dop-raboty.html]
    # РАЗРЫВ: входной ступени нет. От бесплатной проверки сразу к 2 490 ₽.
    entry: null
    core: {sku: p2, price: 2490,
           name: "Дополнительные работы: как получить оплату"}
    cross_sell: [p13, p1]
    ladder_complete: false

  MP-4:
    title: Не возвращают удержания
    money_impact: MI-4
    free: [materialy/uderzhaniya.html]
    entry: {sku: t3, price: 990,
            name: "Односторонний акт или зачёт: возражения в срок"}
    core: {sku: p5, price: 2990,
           name: "Гарантийное удержание: возврат, оспаривание штрафов"}
    cross_sell: [p1, p10]
    ladder_complete: true

  MP-5:
    title: Исполнительная документация блокирует приёмку и оплату
    money_impact: MI-5
    free: [materialy/ispolnitelnaya-dokumentaciya.html,
           materialy/akt-skrytyh-rabot.html]
    entry: {sku: t2, price: 990,
            name: "Передача документации: письмо, опись, акт приёма-передачи"}
    core: {sku: p4, price: 2990,
           name: "Акты скрытых работ и исполнительная документация"}
    cross_sell: [p3, p1]
    ladder_complete: true

  # Входная ступень MP-6 заведена 15.08.2026 из товара, уже стоящего в
  # кассе: t6 «Предлагают квартиры вместо денег: запросы до подписи» —
  # это проверка условий до подписи, то есть ровно рамка этой боли, а
  # разрыв «входной ступени нет» здесь был назван прямо. Состав каталога
  # не менялся: товар был, у него не было места в лестнице.
  #
  # ПРЕДЛОЖЕНИЕ ВЛАДЕЛЬЦУ (Р-047): t5 «Требуют вернуть аванс: первый ответ
  # в срок» поставлен допродажей к MP-6 рядом с p8. Он про аванс, то есть
  # про условие договора, но сама ситуация «уже требуют вернуть» — это
  # спор, а не подготовка. Возможно, ему нужна своя боль. Решение о
  # составе лестницы за владельцем; пока товар привязан, чтобы у него был
  # хоть один вход, а не ноль.
  MP-6:
    title: Опасные условия договора
    money_impact: MI-6
    free: [materialy/dogovor.html, materialy/avans.html,
           materialy/raschet-metrami.html]
    # РАЗРЫВ: входной ступени нет, а комплектов сразу четыре — человек
    # выбирает сам, чего делать не должен.
    entry: {sku: t6, price: 990,
            name: "Предлагают квартиры вместо денег: запросы до подписи"}
    core: {sku: p7, price: 2490,
           name: "Договор субподряда: образец, красные флаги, протокол"}
    cross_sell: [p8, p11, p13, t5]
    ladder_complete: false

  MP-7:
    title: Контрагент становится неплатёжеспособным
    money_impact: MI-7
    free: [materialy/bankrotstvo.html]
    # Разрыв закрыт 15.08.2026. До него шаг от бесплатной проверки до
    # 2 990 ₽ здесь был дороже всего по последствиям: боль срочная, срок
    # заявления требования ограничен, а проверить нас покупателю было
    # нечем. Ступень продаётся не темой, а первым днём.
    entry: {sku: t4, price: 990,
            name: "Генподрядчик банкротится: первые действия"}
    core: {sku: p9, price: 2990,
           name: "Реестр требований кредиторов: заявить требование, сроки"}
    cross_sell: [p1]
    ladder_complete: true

# Комплекты, не привязанные ни к одной боли как основные. Это не дефект:
# они работают допродажей. Но если у товара нет ни одной боли, где он
# основной, его некому продавать по прямому спросу.
supporting: [p8, p10, p11, p12, p13]

# Составных комплектов на продаже нет: p6 снят решением владельца
# 11.08.2026. Пары, которые напрашиваются по маршрутам money-graph и по
# допродаже выше, — предложение, а не решение:
bundle_candidates:
  - {pains: [MP-1, MP-4], skus: [p1, p5], reason: "неоплата и удержание —
     один спор о деньгах за сданные работы"}
  - {pains: [MP-3, MP-2, MP-1], skus: [p2, p3, p1], reason: "маршрут
     money-graph: допработы → КС → приёмка → неоплата"}
  - {pains: [MP-5, MP-2], skus: [p4, p3], reason: "документация и приёмка
     закрывают один отказ"}
  - {pains: [MP-6], skus: [p7, p8], reason: "договор и аванс проверяются
     до подписи в одном заходе"}

# Отложенные решения владельца. Стоят здесь, а не в переписке, по двум
# причинам: разрыв остаётся под контролем проверки и не исчезает из
# вывода, а следующая сессия не заводит товар заново и не «чинит» то, что
# отложено сознательно. Условие пересмотра названо, чтобы отложенное
# отличалось от забытого.
deferred:

  - id: MP-3-entry
    what: >-
      Входная ступень 990 ₽ для MP-3 «Не оплачивают дополнительные работы».
      Разрыв остаётся в выводе проверки строкой выше и не прячется.
    status: DEFERRED
    decided: "2026-08-16"
    why: >-
      Продаж нет, движение по этой боли не измерено. Новый SKU при таких
      данных — преждевременная продуктовая разработка: ступень строилась бы
      под путь, по которому пока никто не прошёл.
    revisit_any_of:
      - измеренный поисковый спрос или трафик по MP-3
      - просмотры товара или попытки оформления по допработам
      - показано, что покупку блокирует именно отсутствие входной ступени

  - id: home-entry-tier
    what: >-
      Входная ступень 990 ₽ на витрине главной. Сейчас шесть карточек, все
      комплекты; минимальная видимая цена 1 990 ₽. Товары t1–t6 продаются и
      линкуются с 24 страниц, но на главной их нет.
    status: DEFERRED
    decided: "2026-08-16"
    why: >-
      Нужен чистый замер после починки счёта переходов 16.08.2026: до неё
      считалась только часть ссылок, и вся витрина была слепой. Правка
      витрины сейчас сменила бы два слоя разом, и первый чистый замер стал
      бы нечитаемым.
    revisit_when: >-
      есть чистые числа воронки после исправления: заход на страницу →
      открытие товара → оформление → покупка
