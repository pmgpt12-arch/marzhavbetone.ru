  MI-6:
    title: Договор создаёт будущую потерю денег
    priority: 6
    products: [p7, p8, p11]
    markers:
      - "договор субподряда"
      - "красные флаги"
      - "протокол разногласий"
      - "аванс"
      - "банковская гарантия"
      - "передачи строительной площадки"
      - "передача площадки"
      - "переуступка"
      - "работы за квартиры"
      - "расчёт метрами"
      - "расчет метрами"
