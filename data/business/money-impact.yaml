# Money Impact: к какой денежной проблеме подрядчика относится страница.
#
# Семь категорий заданы владельцем в постановке этапа Revenue Intelligence.
# Здесь они выражены признаками, по которым страница относится к категории,
# и связкой «категория → комплект каталога».
#
# Что здесь есть и чего нет. Есть принадлежность — это структура, она
# известна без единого замера. Нет ни одного числа: показы, клики, покупки
# и выручка берутся из Вебмастера, Search Console и Метрики, и пока ни один
# из трёх токенов не заведён, колонки метрик остаются пустыми. Пусто здесь
# значит «не измерено», а не «ноль».
#
# Порядок проверки — от денег назад по процессу: MI-1 (деньги уже не
# пришли) перебивает MI-2 (работы не приняты), тот перебивает MI-3 и так
# далее. Иначе «не подписывают КС-2, оплаты нет» уедет в приёмку, тогда как
# человек уже потерял деньги.

categories:

  MI-1:
    title: Выполнено, но не оплачено
    priority: 1
    products: [p1, t1]
    markers:
      - "не оплачивает"
      - "не оплатил"
      - "не платит"
      - "не заплатил"
      - "не перечислил"
      - "оплаты нет"
      - "денег нет"
      - "неоплаченный акт"
      - "долг закрывали"
      - "неоплата закрытых объёмов"
      - "выручка пока нет"
      - "просрочка оплаты"
      - "срок оплаты"
      - "задолженность"
      - "взыскание"
      - "взыскать"
      - "проценты за пользование"
      - "доказательства выполнения"
      - "доказательств"
      - "заставят заплатить"
      - "не значит, что вам заплатят"

  MI-2:
    title: Работы выполнены, но не приняты
    priority: 2
    products: [p3, t3, p10, p12]
    markers:
      - "не подписывает"
      - "не подписан"
      - "отказ от приемки"
      - "отказ от приёмки"
      - "не приняты"
      - "не принимает"
      - "уклоняется от приёмки"
      - "замечания"
      - "возврат кс"
      - "вернуть акт"
      - "проверка кс-2"
      - "односторонний акт"
      - "ответ на претензию"
      - "спор с суммой"

  MI-3:
    title: Выполнены дополнительные работы
    priority: 3
    products: [p2, p13]
    markers:
      - "дополнительные работы"
      - "допработы"
      - "без соглашения"
      - "без допсоглашения"
      - "не включены в смету"
      - "объемы не принимают"
      - "объёмы не принимают"
      - "смета"
      - "мусор"
      - "всё включено"
      - "все включено"

  MI-4:
    title: Удержания
    priority: 4
    products: [p5, t3]
    markers:
      - "гарантийное удержание"
      - "удержание"
      - "удержания"
      - "штраф"
      - "неустойка"
      - "зачет"
      - "зачёт"
      - "backcharge"
      - "затраты генподрядчика"
      - "коммуналк"
      - "чужую коммуналку"
      - "генподрядчик зарабатывает"

  MI-5:
    title: Исполнительная документация
    priority: 5
    products: [p4, t2]
    markers:
      - "исполнительная документация"
      - "исполнительной документации"
      - "акт скрытых работ"
      - "акты скрытых работ"
      - "освидетельствования"
      - "скрытых работ"
