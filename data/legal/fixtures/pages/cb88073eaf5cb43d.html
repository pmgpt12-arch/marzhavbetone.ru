	function setCookieSignStatus(value){
		var today = new Date();
		today.setDate(today.getDate() + 7);
		document.cookie="show_sign_status" + "=" + value + "; expires=" + today.toGMTString();
		parseCookies();
	}
	function delCookieSignStatus(){
		var today = new Date();

	}
