# Реестр норм, на которые опираются юридические документы линейки.
#
# Здесь реквизиты и адрес источника, а не текст закона. Копировать кодексы
# в репозиторий незачем: файл не обновляется сам, а устаревшая копия нормы
# опаснее её отсутствия — она выглядит проверенной.
#
# `source_class` — главное поле, и оно решает судьбу вердикта:
#
#   official     — текст нормы прочитан у официального публикатора
#   secondary    — текст получен через посредника (поиск, правовая база)
#   not_verified — действующую редакцию подтвердить не удалось
#
# Вторичный источник сам по себе PASS не даёт (`tools/normative_gate.py`).
# Это не перестраховка, а вывод из замера 15.08.2026: из рабочей среды
# закрыты `pravo.gov.ru`, `consultant.ru`, `base.garant.ru`, `vsrf.ru`,
# `arbitr.ru`, `cbr.ru`, `sudact.ru` — все дают `CONNECT tunnel failed,
# response 403`. Сверка D-06 прошла на дословных цитатах из поисковой
# выдачи, и назвать это чтением официальной публикации нельзя.
#
# Отсюда исходное состояние гейта — красное, и это осознанный выбор:
# ложная зелень дороже честного отказа.
#
# `recheck_after` — срок перепроверки, а не предсказание изменения закона.
# Его истечение сообщается `tools/normative_scope.py` и не роняет чужой PR.

