# Реестр норм, на которые опираются юридические документы линейки.
#
# Здесь реквизиты и адрес источника, а не текст закона. Копировать кодексы
# в репозиторий незачем: файл не обновляется сам, а устаревшая копия нормы
# опаснее её отсутствия — она выглядит проверенной.
#
# Здесь только реквизиты нормы и адрес, где её читать. Ни класса
# источника, ни доказательства тут нет намеренно: адрес говорит, где
# смотреть, а не что написано, и молча меняется вместе с текстом.
#
# Доказательство — сам сохранённый текст статьи и его хеш, слой
# `data/legal/evidence/<norm_id>.yaml`. Добывается
# `tools/fetch_legal_evidence.py` с машины, у которой есть сеть; в CI он не
# запускается. Один факт — одно место: класс источника живёт при
# доказательстве, а не при реквизитах.
#
# Замер 15.08.2026: из рабочей среды `pravo.gov.ru` и
# `publication.pravo.gov.ru` дают 403 на CONNECT, `consultant.ru` и
# `base.garant.ru` не резолвятся. Доказательств сегодня нет ни по одной
# норме, и гейт по всем шести документам красный. Это верный исход, а не
# поломка: ложная зелень дороже честного отказа.
#
# `recheck_after` — срок перепроверки, а не предсказание изменения закона.
# Его истечение сообщается `tools/normative_scope.py` и не роняет чужой PR.

