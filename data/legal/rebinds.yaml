# Переносы вердикта на новую версию файла, когда правка юридически пуста.
#
# Запись здесь — не разрешение, а заявка. Годность проверяет
# `tools/legal_rebind.py` равенством текстов: из нового текста подставляется
# обратно старый токен, и результат обязан совпасть со старым побайтно.
# Любая правка сверх объявленного токена равенство ломает, и перенос
# отклоняется. Что механизм ловить обязан — закреплено размеченными
# случаями в `tools/test_legal_rebind.py`.
#
# `kind` перечисляет вид правки, и список закрыт: сегодня в нём одна
# позиция — `date`, календарная дата в предложении о собственной сверке.
# Неизвестный вид даёт отказ, а не разрешение.
#
# Перенос не заменяет сверку. Он говорит ровно одно: между этими двумя
# версиями нет правовой разницы, поэтому прежний вердикт относится и к новой.

