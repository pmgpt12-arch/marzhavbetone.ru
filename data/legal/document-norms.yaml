# Какой документ от каких норм зависит, и чем он собирается.
#
# Прямой индекс живёт здесь; обратный — «норма изменилась, какие документы
# задеты» — строится кодом (`tools/normative_scope.py`) и вторым файлом не
# дублируется: два перечня одного и того же разъезжаются на первой правке.
#
# `scope` объявляет, где гейт вообще смотрит, а `out_of_scope` — что внутри
# этой области сознательно не покрыто и почему. Смысл разделения в том,
# чтобы новый файл, положенный в покрытую папку, не остался незамеченным:
# он не попадёт ни в `documents`, ни в `out_of_scope`, и гейт покраснеет.
# Именно так дефект D-06 и жил — шесть документов продавались без сверки, и
# ни одна проверка про них не знала.
#
# `generator` — канонический источник документа. Правка собранного файла
# поверх выдачи теряется при следующей сборке (это класс дефекта D-05),
# поэтому источником считается генератор, а связка «генератор → артефакт»
# держится хешами в `product/legal/artifact-bindings.yaml` (ai-business-os).

meta:
  updated: 2026-08-15
  phase: P0 — комплект P1, документы 11–16

