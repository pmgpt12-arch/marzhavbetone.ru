text: Статья 28. Компетенция арбитражных судов по экономическим спорам и иным делам, возникающим
  из гражданских правоотношений (Наименование в редакции Федерального закона от 28.11.2018
  № 451-ФЗ ) Арбитражные суды рассматривают в порядке искового производства возникающие из
  гражданских правоотношений экономические споры и другие дела, связанные с осуществлением
  предпринимательской и иной экономической деятельности юридическими лицами и индивидуальными
  предпринимателями, а в случаях, предусмотренных настоящим Кодексом и иными федеральными
  законами, другими организациями и гражданами, за исключением дел, рассматриваемых Московским
  городским судом в соответствии с частью третьей статьи 26 Гражданского процессуального кодекса
  Российской Федерации . (В редакции Федерального закона от 02.07.2013 № 187-ФЗ )
