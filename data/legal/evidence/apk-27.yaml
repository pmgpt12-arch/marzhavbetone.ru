text: 'Статья 27. Споры, относящиеся к компетенции арбитражных судов (Наименование в редакции
  Федерального закона от 28.11.2018 № 451-ФЗ ) 1. Арбитражный суд рассматривает дела по экономическим
  спорам и другие дела, связанные с осуществлением предпринимательской и иной экономической
  деятельности. (В редакции Федерального закона от 28.11.2018 № 451-ФЗ ) 2. Арбитражные суды
  разрешают экономические споры и рассматривают иные дела с участием организаций, являющихся
  юридическими лицами, граждан, осуществляющих предпринимательскую деятельность без образования
  юридического лица и имеющих статус индивидуального предпринимателя, приобретенный в установленном
  законом порядке (далее - индивидуальные предприниматели), а в случаях, предусмотренных настоящим
  Кодексом и иными федеральными законами, с участием Российской Федерации, субъектов Российской
  Федерации, муниципальных образований, государственных органов, органов местного самоуправления,
  иных органов, должностных лиц, образований, не имеющих статуса юридического лица, и граждан,
  не имеющих статуса индивидуального предпринимателя (далее - организации и граждане). 3.
  К компетенции арбитражных судов федеральным законом могут быть отнесены и иные дела. (В
  редакции Федерального закона от 28.11.2018 № 451-ФЗ ) 4. Заявление, принятое арбитражным
  судом к своему производству с соблюдением правил компетенции , должно быть рассмотрено им
  по существу, хотя бы в дальнейшем к участию в деле будет привлечен гражданин, не имеющий
  статуса индивидуального предпринимателя, в качестве третьего лица, не заявляющего самостоятельных
  требований относительно предмета спора. (В редакции Федерального закона от 28.11.2018 №
  451-ФЗ ) 5. Арбитражные суды рассматривают относящиеся к их компетенции дела с участием
  российских организаций, граждан Российской Федерации, а также иностранных организаций, международных
  организаций, иностранных граждан, лиц без гражданства, осуществляющих предпринимательскую
  деятельность, организаций с иностранными инвестициями, если иное не предусмотрено международным
  договором Российской Федерации. (В редакции Федерального закона от 28.11.2018 № 451-ФЗ )
  6. Независимо от того, являются ли участниками правоотношений, из которых возникли спор
  или требование, юридические лица, индивидуальные предприниматели или иные организации и
  граждане, арбитражные суды рассматривают дела: 1) о несостоятельности (банкротстве); 2)
  по спорам, указанным в статье 225.1 настоящего Кодекса; 3) по спорам об отказе в государственной
  регистрации, уклонении от государственной регистрации юридических лиц, индивидуальных предпринимателей;
  4) по спорам, вытекающим из деятельности депозитариев, связанной с учетом прав на акции
  и иные ценные бумаги и с осуществлением предусмотренных федеральным законом иных прав и
  обязанностей; 5) по спорам, вытекающим из деятельности публично-правовых компаний, государственных
  компаний, государственных корпораций и связанным с их правовым положением, порядком управления
  ими, их созданием, реорганизацией, ликвидацией, организацией и с полномочиями их органов,
  ответственностью лиц, входящих в их органы; 6) по спорам о защите интеллектуальных прав
  с участием организаций, осуществляющих коллективное управление авторскими и смежными правами,
  а также по спорам, отнесенным к подсудности Суда по интеллектуальным правам в соответствии
  с частью 4 статьи 34 настоящего Кодекса; 7) о защите деловой репутации в сфере предпринимательской
  и иной экономической деятельности; 7.1) по спорам, указанным в статье 248.1 настоящего Кодекса;
  (Дополнение пунктом - Федеральный закон от 08.06.2020 № 171-ФЗ ) 8) другие дела, возникающие
  при осуществлении предпринимательской и иной экономической деятельности, в случаях, предусмотренных
  федеральным законом. (Дополнение частью - Федеральный закон от 29.12.2015 № 409-ФЗ ) 7.
  При обращении в арбитражный суд с заявлением, содержащим несколько связанных между собой
  требований, из которых одни подсудны арбитражному суду, другие - суду общей юрисдикции,
  если разделение требований невозможно, дело подлежит рассмотрению и разрешению в суде общей
  юрисдикции. Если разделение требований возможно, судья выносит определение о принятии требований,
  подсудных арбитражному суду, и о возвращении заявления в части требований, подсудных суду
  общей юрисдикции. (Дополнение частью - Федеральный закон от 28.11.2018 № 451-ФЗ )'
