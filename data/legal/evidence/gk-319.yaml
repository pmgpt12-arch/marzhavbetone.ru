text: Статья 319. Очередность погашения требований по денежному обязательству Сумма произведенного
  платежа, недостаточная для исполнения денежного обязательства полностью, при отсутствии
  иного соглашения погашает прежде всего издержки кредитора по получению исполнения, затем
  - проценты, а в оставшейся части - основную сумму долга.
