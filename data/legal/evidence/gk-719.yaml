text: Статья 719. Неисполнение заказчиком встречных обязанностей по договору подряда 1. Подрядчик
  вправе не приступать к работе, а начатую работу приостановить в случаях, когда нарушение заказчиком
  своих обязанностей по договору подряда, в частности непредоставление материала, оборудования, технической
  документации или подлежащей переработке (обработке) вещи, препятствует исполнению договора подрядчиком,
  а также при наличии обстоятельств, очевидно свидетельствующих о том, что исполнение указанных обязанностей
  не будет произведено в установленный срок (статья 328). 2. Если иное не предусмотрено договором
  подряда, подрядчик при наличии обстоятельств, указанных в пункте 1 настоящей статьи, вправе отказаться
  от исполнения договора и потребовать возмещения убытков.
