text: 'Статья 4. Право на обращение в арбитражный суд 1. Заинтересованное лицо вправе обратиться
  в арбитражный суд за защитой своих нарушенных или оспариваемых прав и законных интересов,
  в том числе с требованием о присуждении ему компенсации за нарушение права на судопроизводство
  в разумный срок или права на исполнение судебного акта в разумный срок, в порядке, установленном
  настоящим Кодексом. (В редакции Федерального закона от 30.04.2010 № 69-ФЗ ) 2. В случаях,
  предусмотренных настоящим Кодексом, в арбитражный суд вправе обратиться и иные лица. 3.
  Отказ от права на обращение в суд недействителен. 4. Обращение в арбитражный суд осуществляется
  в форме: искового заявления - по экономическим спорам и иным делам, возникающим из гражданских
  правоотношений; заявления - по делам, возникающим из административных и иных публичных правоотношений,
  по делам о несостоятельности (банкротстве), по делам особого производства, по делам приказного
  производства и в иных случаях, предусмотренных настоящим Кодексом; (В редакции федеральных
  законов от 28.06.2014 № 186-ФЗ ; от 02.03.2016 № 47-ФЗ ) жалобы - при обращении в арбитражный
  суд апелляционной и кассационной инстанций, а также в иных случаях, предусмотренных настоящим
  Кодексом и иными федеральными законами; представления - при обращении Генерального прокурора
  Российской Федерации и его заместителей о пересмотре судебных актов в порядке надзора. 5.
  Гражданско-правовые споры о взыскании денежных средств по требованиям, возникшим из договоров,
  других сделок, вследствие неосновательного обогащения, могут быть переданы на разрешение
  арбитражного суда после принятия сторонами мер по досудебному урегулированию по истечении
  тридцати календарных дней со дня направления претензии (требования), если иные срок и (или)
  порядок не установлены законом или договором. Иные споры, возникающие из гражданских правоотношений,
  передаются на разрешение арбитражного суда после соблюдения досудебного порядка урегулирования
  спора только в том случае, если такой порядок установлен федеральным законом или договором.
  Экономические споры, возникающие из административных и иных публичных правоотношений, могут
  быть переданы на разрешение арбитражного суда после соблюдения досудебного порядка урегулирования
  спора в случае, если такой порядок установлен федеральным законом. Соблюдения досудебного
  порядка урегулирования спора не требуется по делам об установлении фактов, имеющих юридическое
  значение, делам о присуждении компенсации за нарушение права на судопроизводство в разумный
  срок или права на исполнение судебного акта в разумный срок, делам о несостоятельности (банкротстве),
  делам по корпоративным спорам, делам о защите прав и законных интересов группы лиц, делам
  приказного производства, делам, связанным с выполнением арбитражными судами функций содействия
  и контроля в отношении третейских судов, делам о признании и приведении в исполнение решений
  иностранных судов и иностранных арбитражных решений, а также, если иное не предусмотрено
  законом, при обращении в арбитражный суд прокурора, государственных органов, органов местного
  самоуправления и иных органов в защиту публичных интересов, прав и законных интересов организаций
  и граждан в сфере предпринимательской и иной экономической деятельности (статьи 52, 53 настоящего
  Кодекса). (Часть в редакции Федерального закона от 01.07.2017 № 147-ФЗ ) 6. По соглашению
  сторон относящийся к компетенции арбитражного суда спор, возникший из гражданско-правовых
  отношений, до принятия арбитражным судом первой инстанции судебного акта, которым заканчивается
  рассмотрение дела по существу, может быть передан сторонами на рассмотрение третейского
  суда, если иное не предусмотрено настоящим Кодексом и федеральным законом. (В редакции федеральных
  законов от 29.12.2015 № 409-ФЗ , от 28.11.2018 № 451-ФЗ ) 7. Исковое заявление, заявление,
  жалоба, представление и иные документы могут быть поданы в суд на бумажном носителе или
  в электронном виде, в том числе в форме электронного документа. Исковое заявление, заявление,
  жалоба, представление и иные документы в электронном виде могут быть поданы в суд посредством
  федеральной государственной информационной системы "Единый портал государственных и муниципальных
  услуг (функций)" (далее - единый портал государственных и муниципальных услуг), либо информационной
  системы, определенной Верховным Судом Российской Федерации, Судебным департаментом при Верховном
  Суде Российской Федерации, либо систем электронного документооборота участников арбитражного
  процесса с использованием единой системы межведомственного электронного взаимодействия.
  Исковое заявление, заявление, жалоба, представление и иные документы, которые подаются посредством
  единого портала государственных и муниципальных услуг, информационной системы, определенной
  Верховным Судом Российской Федерации, Судебным департаментом при Верховном Суде Российской
  Федерации, могут быть подписаны простой электронной подписью в соответствии с законодательством
  Российской Федерации и порядком, определяемым Верховным Судом Российской Федерации, Судебным
  департаментом при Верховном Суде Российской Федерации, если настоящим Кодексом не установлено,
  что указанные документы должны быть подписаны усиленной квалифицированной электронной подписью.
  Исковое заявление, заявление, жалоба, представление и иные документы, которые подаются посредством
  систем электронного документооборота участников арбитражного процесса, должны быть подписаны
  усиленной квалифицированной электронной подписью. (Дополнение частью - Федеральный закон
  от 23.06.2016 № 220-ФЗ ) (В редакции Федерального закона от 30.12.2021 № 440-ФЗ ) 8. Стороны
  после обращения в арбитражный суд вправе использовать примирительные процедуры для урегулирования
  спора. (Дополнение частью - Федеральный закон от 26.07.2019 № 197-ФЗ )'
