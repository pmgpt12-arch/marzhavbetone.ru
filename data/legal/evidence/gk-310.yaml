text: Статья 310. Недопустимость одностороннего отказа от исполнения обязательства 1. Односторонний
  отказ от исполнения обязательства и одностороннее изменение его условий не допускаются,
  за исключением случаев, предусмотренных настоящим Кодексом, другими законами или иными правовыми
  актами. 2. Одностороннее изменение условий обязательства, связанного с осуществлением всеми
  его сторонами предпринимательской деятельности, или односторонний отказ от исполнения этого
  обязательства допускается в случаях, предусмотренных настоящим Кодексом, другими законами,
  иными правовыми актами или договором. В случае, если исполнение обязательства связано с
  осуществлением предпринимательской деятельности не всеми его сторонами, право на одностороннее
  изменение его условий или отказ от исполнения обязательства может быть предоставлено договором
  лишь стороне, не осуществляющей предпринимательской деятельности, за исключением случаев,
  когда законом или иным правовым актом предусмотрена возможность предоставления договором
  такого права другой стороне. 3. Предусмотренное настоящим Кодексом, другим законом, иным
  правовым актом или договором право на односторонний отказ от исполнения обязательства, связанного
  с осуществлением его сторонами предпринимательской деятельности, или на одностороннее изменение
  условий такого обязательства может быть обусловлено по соглашению сторон необходимостью
  выплаты определенной денежной суммы другой стороне обязательства. (Статья в редакции Федерального
  закона от 08.03.2015 № 42-ФЗ )
