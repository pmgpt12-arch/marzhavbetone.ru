text: Статья 328. Встречное исполнение обязательства 1. Встречным признается исполнение обязательства
  одной из сторон, которое обусловлено исполнением другой стороной своих обязательств. 2.
  В случае непредоставления обязанной стороной предусмотренного договором исполнения обязательства
  либо при наличии обстоятельств, очевидно свидетельствующих о том, что такое исполнение не
  будет произведено в установленный срок, сторона, на которой лежит встречное исполнение,
  вправе приостановить исполнение своего обязательства или отказаться от исполнения этого
  обязательства и потребовать возмещения убытков. Если предусмотренное договором исполнение
  обязательства произведено не в полном объеме, сторона, на которой лежит встречное исполнение,
  вправе приостановить исполнение своего обязательства или отказаться от исполнения в части,
  соответствующей непредоставленному исполнению. 3. Ни одна из сторон обязательства, по условиям
  которого предусмотрено встречное исполнение, не вправе требовать по суду исполнения, не
  предоставив причитающегося с нее по обязательству другой стороне. 4. Правила, предусмотренные
  пунктами 2 и 3 настоящей статьи, применяются, если законом или договором не предусмотрено
  иное. (Статья в редакции Федерального закона от 08.03.2015 № 42-ФЗ ) Глава 23. Обеспечение
  исполнения обязательств § 1. Общие положения
