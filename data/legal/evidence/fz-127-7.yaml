text: Статья 7. Право на обращение в арбитражный суд 1. Правом на обращение в арбитражный
  суд с заявлением о признании должника банкротом обладают должник, конкурсный кредитор, уполномоченные
  органы, а также работник, бывший работник должника, имеющие требования о выплате выходных
  пособий и (или) об оплате труда. (В редакции Федерального закона от 29.06.2015 № 186-ФЗ
  ) 2. Право на обращение в арбитражный суд возникает у конкурсного кредитора, работника,
  бывшего работника должника, уполномоченного органа по денежным обязательствам с даты вступления
  в законную силу решения суда, арбитражного суда или судебного акта о выдаче исполнительных
  листов на принудительное исполнение решений третейского суда о взыскании с должника денежных
  средств. (В редакции Федерального закона от 29.06.2015 № 186-ФЗ ) Право на обращение в арбитражный
  суд возникает у конкурсного кредитора - кредитной организации, у кредитного управляющего
  по договору синдицированного кредита (займа) (глава X 1 настоящего Федерального закона),
  а также у конкурсного кредитора - государственной корпорации "ВЭБ.РФ" с даты возникновения
  у должника признаков банкротства, установленных настоящим Федеральным законом. (В редакции
  Федерального закона от 22.12.2020 № 447-ФЗ ) Право на обращение в арбитражный суд возникает
  у уполномоченного органа по обязательным платежам по истечении тридцати дней с даты принятия
  решения, указанного в абзаце втором пункта 3 статьи 6 настоящего Федерального закона. (Пункт
  в редакции Федерального закона от 29.12.2014 № 482-ФЗ ) 2.1. Право на обращение в арбитражный
  суд возникает у конкурсного кредитора, должника, работника, бывшего работника должника в
  порядке, установленном пунктом 2 настоящей статьи, при условии предварительного, не менее
  чем за пятнадцать календарных дней до обращения в арбитражный суд, опубликования уведомления
  о намерении обратиться с заявлением о признании должника банкротом путем включения его в
  Единый федеральный реестр сведений о фактах деятельности юридических лиц. (В редакции Федерального
  закона от 29.07.2017 № 218-ФЗ ) По истечении тридцати дней со дня опубликования указанного
  уведомления сведения, содержащиеся в нем, утрачивают силу. (Дополнение абзацем - Федеральный
  закон от 12.11.2019 № 377-ФЗ ) (Дополнение пунктом - Федеральный закон от 29.12.2014 № 482-ФЗ
  ) 3. Частичное исполнение требований конкурсного кредитора, работника, бывшего работника
  должника, уполномоченного органа не является основанием для отказа арбитражным судом в принятии
  заявления о признании должника банкротом, если сумма неисполненных требований составляет
  не менее чем размер, определяемый в соответствии с пунктом 2 статьи 6 настоящего Федерального
  закона. (В редакции Федерального закона от 29.06.2015 № 186-ФЗ )
