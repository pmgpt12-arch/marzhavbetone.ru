text: 37. По смыслу статьи 319 ГК РФ под упомянутыми в ней процентами понимаются проценты, являющиеся
  платой за пользование денежными средствами (например, статьи 317 1 , 809 , 823 ГК РФ). Проценты,
  являющиеся мерой гражданско-правовой ответственности, например, проценты, предусмотренные статьей
  395 ГК РФ, к указанным в статье 319 ГК РФ процентам не относятся и погашаются после суммы основного
  долга. Положения статьи 319 ГК РФ, устанавливающие очередность погашения требований по денежному
  обязательству, могут быть изменены соглашением сторон. Однако соглашением сторон может быть изменен
  порядок погашения только тех требований, которые названы в статье 319 ГК РФ. Иная очередность погашения
  требований по денежному обязательству также может быть предусмотрена законом. В частности, к отношениям
  по договорам потребительского кредита (займа), заключенным после введения в действие Федерального
  закона от 21 декабря 2013 года № 353-ФЗ «О потребительском кредите (займе)», подлежит применению
  очередность погашения требований, предусмотренная частью 20 статьи 5 данного закона.
