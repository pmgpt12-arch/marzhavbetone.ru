text: '42. Если законом или соглашением сторон установлена неустойка за нарушение денежного
  обязательства, на которую распространяется правило абзаца первого пункта 1 статьи 394 ГК
  РФ, то положения пункта 1 статьи 395 ГК РФ не применяются. В этом случае взысканию подлежит
  неустойка, установленная законом или соглашением сторон, а не про центы, предусмотренные
  статьей 395 ГК РФ (пункт 4 статьи 395 ГК РФ). 48. Сумма процентов, подлежащих взысканию
  по правилам статьи 395 ГК РФ, определяется на день вынесения решения судом исходя из периодов,
  16 имевших место до указанного дня. Проценты за пользование чужими денежными средствами
  по требованию истца взимаются по день уплаты этих средств кредитору. Одновременно с установлением
  суммы процентов, подлежащих взысканию, суд при наличии требования истца в резолютивной части
  решения указывает на взы скание процентов до момента фактического исполнения обязательства
  (пункт 3 статьи 395 ГК РФ). При этом день фактического исполнения обязательства, в частности
  уплаты задолженности кредитору, включается в период расчета процентов. Расч е т процентов,
  начисляе мых после вынесения решения, осуществляется в процессе его исполнения судебным
  приставом - исполнителем, а в случаях, установленных законом, – иными органами, организациями,
  в том числе органами казначейства, банками и иными кредитными организациями, должнос тными
  лицами и гражданами (часть 1 статьи 7 , статья 8, пункт 16 части 1 статьи 64 и часть 2 статьи
  70 Закона об исполнительном производстве). Размер процентов, начисленных за периоды просрочки,
  имевшие место с 1 июня 2015 года по 31 июля 2016 года включит ельно, определяется по средним
  ставкам банковского процента по вкладам физических лиц, а за периоды, имевшие место после
  31 июля 2016 года, – исходя из ключевой ставки Банка Ро ссии, действовавшей в соответствующие
  периоды после вынесения решения. В случае неясности судебный пристав - исполнитель, иные
  лица, исполняющие судебный акт, вправе обратиться в суд за разъяснением его исполнения,
  в том числе по вопросу о том, какая именно сумма подлежит взысканию с должника ( статья
  202 ГПК РФ , статья 179 АПК РФ). К р а змер у процентов, взыскиваемых по пункту 1 статьи
  3 95 ГК РФ, по общему правилу, положения статьи 333 ГК РФ не применяются (пункт 6 статьи
  395 ГК РФ). 84. В связи с принятием настоящего п остановления признать не подлежащими применению:
  пункты 2, 42, 50 – 5 2, абзац второй пункта 56 постановления Пленума Верховного Суда Российской
  Федерации и Пленума Высшего Арбитражного Суда Российской Федерации от 1 июля 1996 года №
  6/8 О некоторых вопросах , связанных с применением части первой Гражданского кодекса Российской
  Федерации; пункты 1 – 3, 5 – 11, абзац шестой пункта 15, пункты 23 – 29 постановлени я Пленума
  Верховного Суда Российской Федерации и Пленума Высшего Арбитражного Суда Российской Федерации
  от 8 октября 1998 года № 13/14 О практике применения положений Гражданского кодекса Российской
  Федерации о процентах за пользование чужими денежными средствами; пункты 1 , 3 – 7, 10 постановления
  Пленума Высшего Арбитражного Суда Российской Федерации от 22 де кабря 2011 года № 81 О некоторых
  вопросах применения статьи 333 Гражданско го кодекса Российской Федерации; постановление
  Пленума Высшего Арбитражного Суда Российской Федерации от 4 апреля 2014 года № 22 О некоторых
  вопросах присуждения взыскателю денежн ых средств за неисполнение судебного акта . Председатель
