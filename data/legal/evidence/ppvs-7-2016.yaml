text: 42. Если законом или соглашением сторон установлена неустойка за нарушение денежного обязательства,
  на которую распространяется правило абзаца первого пункта 1 статьи 394 ГК РФ, то положения пункта
  1 статьи 395 ГК РФ не применяются. В этом случае взысканию подлежит неустойка, установленная законом
  или соглашением сторон, а не проценты, предусмотренные статьей 395 ГК РФ (пункт 4 статьи 395 ГК
  РФ). 48. Сумма процентов, подлежащих взысканию по правилам статьи 395 ГК РФ, определяется на день
  вынесения решения судом исходя из периодов, имевших место до указанного дня. Проценты за пользование
  чужими денежными средствами по требованию истца взимаются по день уплаты этих средств кредитору.
  Одновременно с установлением суммы процентов, подлежащих взысканию, суд при наличии требования
  истца в резолютивной части решения указывает на взыскание процентов до момента фактического исполнения
  обязательства (пункт 3 статьи 395 ГК РФ). При этом день фактического исполнения обязательства,
  в частности уплаты задолженности кредитору, включается в период расчета процентов. Расчет процентов,
  начисляемых после вынесения решения, осуществляется в процессе его исполнения судебным приставом-исполнителем,
  а в случаях, установленных законом, - иными органами, организациями, в том числе органами казначейства,
  банками и иными кредитными организациями, должностными лицами и гражданами (часть 1 статьи 7, статья
  8, пункт 16 части 1 статьи 64 и часть 2 статьи 70 Закона об исполнительном производстве). Размер
  процентов, начисленных за периоды просрочки, имевшие место с 1 июня 2015 года по 31 июля 2016 года
  включительно, определяется по средним ставкам банковского процента по вкладам физических лиц, а
  за периоды, имевшие место после 31 июля 2016 года, - исходя из ключевой ставки Банка России, действовавшей
  в соответствующие периоды после вынесения решения. В случае неясности судебный пристав-исполнитель,
  иные лица, исполняющие судебный акт, вправе обратиться в суд за разъяснением его исполнения, в
  том числе по вопросу о том, какая именно сумма подлежит взысканию с должника (статья 202 ГПК РФ,
  статья 179 АПК РФ). К размеру процентов, взыскиваемых по пункту 1 статьи 395 ГК РФ, по общему правилу,
  положения статьи 333 ГК РФ не применяются (пункт 6 статьи 395 ГК РФ).
