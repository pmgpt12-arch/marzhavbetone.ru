text: Статья 753. Сдача и приемка работ 1. Заказчик, получивший сообщение подрядчика о готовности
  к сдаче результата выполненных по договору строительного подряда работ либо, если это предусмотрено
  договором, выполненного этапа работ, обязан немедленно приступить к его приемке. 2. Заказчик организует
  и осуществляет приемку результата работ за свой счет, если иное не предусмотрено договором строительного
  подряда. В предусмотренных законом или иными правовыми актами случаях в приемке результата работ
  должны участвовать представители государственных органов и органов местного самоуправления. 3.
  Заказчик, предварительно принявший результат отдельного этапа работ, несет риск последствий гибели
  или повреждения результата работ, которые произошли не по вине подрядчика. 4. Сдача результата
  работ подрядчиком и приемка его заказчиком оформляются актом, подписанным обеими сторонами. При
  отказе одной из сторон от подписания акта в нем делается отметка об этом и акт подписывается другой
  стороной. Односторонний акт сдачи или приемки результата работ может быть признан судом недействительным
  лишь в случае, если мотивы отказа от подписания акта признаны им обоснованными. 5. В случаях, когда
  это предусмотрено законом или договором строительного подряда либо вытекает из характера работ,
  выполняемых по договору, приемке результата работ должны предшествовать предварительные испытания.
  В этих случаях приемка может осуществляться только при положительном результате предварительных
  испытаний. 6. Заказчик вправе отказаться от приемки результата работ в случае обнаружения недостатков,
  которые исключают возможность его использования для указанной в договоре строительного подряда
  цели и не могут быть устранены подрядчиком или заказчиком.
