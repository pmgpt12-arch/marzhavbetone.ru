text: Статья 746. Оплата работ 1. Оплата выполненных подрядчиком работ производится заказчиком в
  размере, предусмотренном сметой, в сроки и в порядке, которые установлены законом или договором
  строительного подряда. При отсутствии соответствующих указаний в законе или договоре оплата работ
  производится в соответствии со статьей 711 настоящего Кодекса. 2. Договором строительного подряда
  может быть предусмотрена оплата работ единовременно и в полном объеме после приемки объекта заказчиком.
