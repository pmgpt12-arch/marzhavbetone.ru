text: 57 . Встречным признается исполнение обязательства одной из сторон, которо е обусловлено исполнением
  другой стороной своих обязательств, вне зависимости от того, предусмотрели ли стороны очередность
  исполнения своих обязанностей (пункт 1 статьи 328 ГК РФ). Например, по общему правилу в договоре
  купли - продажи обязанность продавца передать товар в собственность покупателя и обязанность последнего
  оплатить товар являются встречными по отношению друг к другу. Если иное не предусмотрено законом
  или договором, в случае непредоставления обязанной стороной исполнения обязательства либо пр и
  наличии обстоятельств, очевидно свидетельствующих о том, что такое исполнение не будет произведено
  в установленный срок, сторона, на которой лежит встречное исполнение, вправе приостановить исполнение
  своего 18 обязательства или отказаться от исполнения это го обязательства и потребовать возмещения
  убытков (пункт 2 статьи 328 ГК РФ). Сторона , намеревающаяся приостановить исполнение своего обязательства
  или отказаться от его исполнения лишь на основании обстоятельств, очевидно свидетельствующих о
  том, что друг ая сторона не произведет исполнение в установленный срок, обязана в разумный срок
  предупредить последнюю об этом (пункт 3 статьи 307 ГК РФ).
