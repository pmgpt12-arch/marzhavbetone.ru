text: '1) при подаче искового заявления имущественного характера, подлежащего оценке, при цене иска:
  до 100 000 рублей - 10 000 рублей; от 100 001 рубля до 1 000 000 рублей - 10 000 рублей плюс 5
  процентов суммы, превышающей 100 000 рублей; от 1 000 001 рубля до 10 000 000 рублей - 55 000 рублей
  плюс 3 процента суммы, превышающей 1 000 000 рублей; от 10 000 001 рубля до 50 000 000 рублей -
  325 000 рублей плюс 1 процент суммы, превышающей 10 000 000 рублей; свыше 50 000 000 рублей - 725
  000 рублей плюс 0,5 процента суммы, превышающей 50 000 000 рублей, но не более 10 000 000 рублей;'
