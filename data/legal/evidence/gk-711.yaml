text: Статья 711. Порядок оплаты работы 1. Если договором подряда не предусмотрена предварительная
  оплата выполненной работы или отдельных ее этапов, заказчик обязан уплатить подрядчику обусловленную
  цену после окончательной сдачи результатов работы при условии, что работа выполнена надлежащим
  образом и в согласованный срок, либо с согласия заказчика досрочно. 2. Подрядчик вправе
  требовать выплаты ему аванса либо задатка только в случаях и в размере, указанных в законе
  или договоре подряда.
