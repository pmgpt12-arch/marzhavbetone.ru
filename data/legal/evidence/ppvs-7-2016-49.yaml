text: 49. Исходя из положений статьи 319 ГК РФ об очередности погашения требований по денежному обязательству,
  при недостаточности суммы произведенного платежа судам следует учитывать, что под процентами, погашаемыми
  ранее основной суммы долга, понимаются проценты за пользование денежными средствами, подлежащие
  уплате по денежному обязательству, в частности проценты за пользование суммой займа, кредита, аванса,
  предоплаты и т.д. (статьи 3171, 809, 823 ГК РФ). Проценты, предусмотренные статьей 395 ГК РФ за
  неисполнение или просрочку исполнения денежного обязательства, к указанным в статье 319 ГК РФ процентам
  не относятся и погашаются после суммы основного долга. Положения статьи 319 ГК РФ не лишают кредитора
  права до погашения основной суммы долга предъявить иск о взыскании с должника неустойки или процентов,
  взыскиваемых на основании статьи 395 ГК РФ.
