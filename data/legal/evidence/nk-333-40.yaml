text: '1. Уплаченная государственная пошлина подлежит возврату частично или полностью в случае: 1)
  уплаты государственной пошлины в большем размере, чем это предусмотрено настоящей главой; 2) возвращения
  заявления, жалобы или иного обращения или отказа в их принятии судами либо отказа в совершении
  нотариальных действий уполномоченными на то органами и (или) должностными лицами. Если государственная
  пошлина не возвращена, ее сумма засчитывается в счет уплаты государственной пошлины при повторном
  предъявлении иска, административного иска, если не истек трехгодичный срок со дня вынесения предыдущего
  решения и к повторному иску, административному иску приложен первоначальный документ об уплате
  государственной пошлины; 3) прекращения производства по делу (административному делу) или оставления
  заявления (административного искового заявления) без рассмотрения Верховным Судом Российской Федерации,
  судами общей юрисдикции или арбитражными судами. При заключении мирового соглашения (соглашения
  о примирении), отказе истца (административного истца) от иска (административного иска), признании
  ответчиком (административным ответчиком) иска (административного иска), в том числе по результатам
  проведения примирительных процедур, до принятия решения судом первой инстанции возврату истцу (административному
  истцу) подлежит 70 процентов суммы уплаченной им государственной пошлины, на стадии рассмотрения
  дела судом апелляционной инстанции - 50 процентов, на стадии рассмотрения дела судом кассационной
  инстанции, пересмотра судебных актов в порядке надзора - 30 процентов.'
