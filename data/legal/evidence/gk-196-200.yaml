text: Статья 196. Общий срок исковой давности 1. Общий срок исковой давности составляет три
  года со дня, определяемого в соответствии со статьей 200 настоящего Кодекса. 2. Срок исковой
  давности не может превышать десять лет со дня нарушения права, для защиты которого этот
  срок установлен, за исключением случаев, установленных Федеральным законом от 6 марта 2006
  года № 35-ФЗ "О противодействии терроризму" и Федеральным законом от 30 ноября 2010 года
  № 327-ФЗ "О передаче религиозным организациям имущества религиозного назначения, находящегося
  в государственной или муниципальной собственности" . (В редакции федеральных законов от
  02.11.2013 № 302-ФЗ , от 10.06.2026 № 167-ФЗ ) (Статья в редакции Федерального закона от
  07.05.2013 № 100-ФЗ ) Статья 200. Начало течения срока исковой давности 1. Если законом
  не установлено иное, течение срока исковой давности начинается со дня, когда лицо узнало
  или должно было узнать о нарушении своего права и о том, кто является надлежащим ответчиком
  по иску о защите этого права. 2. По обязательствам с определенным сроком исполнения течение
  срока исковой давности начинается по окончании срока исполнения. По обязательствам, срок
  исполнения которых не определен или определен моментом востребования, срок исковой давности
  начинает течь со дня предъявления кредитором требования об исполнении обязательства, а если
  должнику предоставляется срок для исполнения такого требования, исчисление срока исковой
  давности начинается по окончании срока, предоставляемого для исполнения такого требования.
  При этом срок исковой давности во всяком случае не может превышать десять лет со дня возникновения
  обязательства. 3. По регрессным обязательствам течение срока исковой давности начинается
  со дня исполнения основного обязательства. (Статья в редакции Федерального закона от 07.05.2013
  № 100-ФЗ )
