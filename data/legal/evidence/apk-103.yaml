text: 'Статья 103. Цена иска 1. Цена иска определяется: 1) по искам о взыскании денежных средств,
  исходя из взыскиваемой суммы; 2) по искам о признании не подлежащим исполнению исполнительного
  или иного документа, по которому взыскание производится в бесспорном (безакцептном) порядке,
  исходя из оспариваемой денежной суммы; 3) по искам об истребовании имущества, исходя из
  стоимости истребуемого имущества; 4) по искам об истребовании земельного участка, исходя
  из стоимости земельного участка. В цену иска включаются также указанные в исковом заявлении
  суммы неустойки (штраф, пени) и проценты. Цена иска, состоящего из нескольких самостоятельных
  требований, определяется суммой всех требований. 2. По исковым заявлениям о признании права,
  в том числе права собственности, права пользования, права владения, права распоряжения,
  государственная пошлина уплачивается в размерах, установленных для исковых заявлений неимущественного
  характера. 3. Цена иска указывается заявителем. В случае неправильного указания заявителем
  цены иска она определяется арбитражным судом.'
