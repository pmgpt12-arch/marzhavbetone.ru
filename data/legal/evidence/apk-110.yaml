text: Статья 110. Распределение судебных расходов между лицами, участвующими в деле 1. Судебные
  расходы, понесенные лицами, участвующими в деле, в пользу которых принят судебный акт, взыскиваются
  арбитражным судом со стороны. В случае, если иск удовлетворен частично, судебные расходы
  относятся на лиц, участвующих в деле, пропорционально размеру удовлетворенных исковых требований.
  2. Расходы на оплату услуг представителя, понесенные лицом, в пользу которого принят судебный
  акт, взыскиваются арбитражным судом с другого лица, участвующего в деле, в разумных пределах.
  3. Государственная пошлина, от уплаты которой в установленном порядке истец был освобожден,
  взыскивается с ответчика в доход федерального бюджета пропорционально размеру удовлетворенных
  исковых требований, если ответчик не освобожден от уплаты государственной пошлины. 4. При
  соглашении лиц, участвующих в деле, о распределении судебных расходов арбитражный суд относит
  на них судебные расходы в соответствии с этим соглашением. 5. Судебные расходы, понесенные
  лицами, участвующими в деле, в связи с рассмотрением апелляционной, кассационной жалобы,
  распределяются по правилам, установленным настоящей статьей. 5.1. Судебные издержки, понесенные
  третьими лицами, не заявляющими самостоятельных требований относительно предмета спора и
  участвовавшими в деле на стороне, в пользу которой принят судебный акт по делу, могут быть
  возмещены им, если их фактическое поведение как участников судебного процесса способствовало
  принятию данного судебного акта. (Дополнение частью - Федеральный закон от 28.11.2018 №
  451-ФЗ ) 5.2. Если третье лицо, не заявляющее самостоятельных требований относительно предмета
  спора, реализовало право на обжалование судебного акта и его жалоба была оставлена без удовлетворения,
  судебные издержки, понесенные лицами, участвующими в деле, в связи с рассмотрением данной
  жалобы, могут быть взысканы с этого третьего лица. (Дополнение частью - Федеральный закон
  от 28.11.2018 № 451-ФЗ ) 6. Неоплаченные или не полностью оплаченные расходы на проведение
  экспертизы подлежат взысканию в пользу эксперта или государственного судебно-экспертного
  учреждения с лиц, участвующих в деле, пропорционально размеру удовлетворенных исковых требований.
  (Дополнение частью - Федеральный закон от 28.06.2009 № 124-ФЗ )
