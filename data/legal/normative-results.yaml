      через несколько выходных подряд читается однозначно. Оговорка о границе: продолжение «и просрочка
      начинается со следующего за ним дня» самой ст. 193 не устанавливается — это следствие окончания
      срока, а не текст нормы. Ссылка «(ст. 193 ГК РФ)» стоит внутри первой части фразы и на это следствие
      не распространяется, поэтому приписывания норме чужого содержания нет и расширения объёма сверки
      не требуется. Правовой смысл следствия фрагментом не искажён.'
