  - norm_id: apk-4-5
    source_hash: sha256:6603e670456f0ab3a8ec287c3626d56613e7623428a3c7ba937c8b0cc1a67d44
    source_class: official
    quote_obtained: true
    verdict: соответствует
    note: 'Фрагменты 1, 3, 6, 8. Ч. 5 ст. 4 (ред. от 15.12.2025, действует с 01.01.2026) устанавливает
      срок, по истечении которого спор о взыскании денежных средств по требованиям из договоров может
      быть передан в арбитражный суд, и считает его со дня направления претензии (требования), «если иные
      срок и (или) порядок не установлены законом или договором». Документ так её и излагает: срок отсчитывается
      со дня направления, число в файл не записано (Р-009), обязанности ответить норма не устанавливает
      — в тексте нормы такой обязанности нет. Прежний дефект снят проверяемо: «ст. 4 АПК» встречается
      трижды (фрагменты 1, 3, 8), «срок ответа» — один раз и только как срок из договора ({{СРОК_ОТВЕТА_НА_ПРЕТЕНЗИЮ}});
      ни в одном предложении АПК не назван источником срока ответа. Заголовок шага 4 (фрагмент 6) совпадает
      с языком нормы («досудебное урегулирование»). Фрагмент 1 не обещает большего, чем норма: модальности
      «может считаться» и «оценивает суд по содержанию» удержаны, норма прямо говорит «претензии (требования)»,
      то есть не связывает досудебный порядок с названием документа. Точнее было бы назвать и «законом»
      рядом с «договором» как источник иного срока (фрагменты 3, 8) — правового смысла для подрядного
      спора это не меняет, в issues не вынесено.'
  - norm_id: fz-127-7
    source_hash: sha256:98c23588fc9bdfa76b4d38ea25317c12e0cf5eaab1419cff7dc12b7c9fd39735
    source_class: official
    quote_obtained: true
    verdict: соответствует
    note: 'Фрагмент 2. П. 2.1 ст. 7 подтверждает существование признака, на который опирается развилка:
      опубликование уведомления о намерении обратиться с заявлением о признании должника банкротом в ЕФРСФДЮЛ
      предшествует обращению в суд, то есть «сообщение о намерении» — проверяемый факт, а не оборот речи.
      Расширения за пределы пакета нет: после правки абзац не называет ни одного конкретного срока предъявления
      требований кредиторов и ни одного последствия их пропуска, а прямо отсылает к юристу; снятое утверждение
      о неизбежной потере долга в тексте отсутствует. Довод «обычный маршрут претензия — иск в банкротстве
      не работает» дополнительно поддерживается ч. 5 ст. 4 АПК РФ, исключающей досудебный порядок по делам
      о несостоятельности. Оговорка объёма: конкретные порядки и сроки предъявления требований (ст. 71,
      100, 142 Закона № 127-ФЗ) пакетом не покрыты и не сверялись — они и не утверждаются документом.'
