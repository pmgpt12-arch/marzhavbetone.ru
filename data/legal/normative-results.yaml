  - id: I-16-1
    severity: low
    where: Приложения, позиция 12 (фрагмент 8)
    text: 'Утверждение «Пункт 4 ч. 1 ст. 126 АПК РФ, который требовал этот документ, утратил силу» проверяемо
      только наполовину. Утрата силы п. 4 подтверждена действующим текстом (в перечне он значится как
      утративший силу по ФЗ от 25.12.2023 № 667-ФЗ), и практический вывод «в обязательный перечень не
      входит» верен. Прежнее содержание п. 4 — то, что он требовал именно копию свидетельства о государственной
      регистрации, — из действующего текста не следует и в объёме сверки источником не подтверждено: для
      этого нужна прежняя редакция статьи. Вердикт по этой части — «не найдена», требует проверки владельцем.
      Правового смысла позиции 12 это не меняет: документ и так помечен «по желанию».'
  recheck: Один заход по одному месту — позиция 12 перечня приложений (фрагмент 8). Проверить по редакции
    ч. 1 ст. 126 АПК РФ, действовавшей до ФЗ от 25.12.2023 № 667-ФЗ, что утративший силу п. 4 требовал
    именно копию свидетельства о государственной регистрации; либо снять историческую оговорку, оставив
    вывод «в обязательный перечень документ не входит», который действующим текстом подтверждён. Остальные
    восемь фрагментов сверены и повторной проверки не требуют.
