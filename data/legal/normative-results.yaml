    verdict: соответствует
    note: 'Контрольная линия времени: «Общий срок исковой давности установлен Гражданским кодексом РФ
      (глава 12, ст. 196)». Ст. 196 названа верно и стоит в главе 12 «Исковая давность»; порядок исчисления
      — ст. 200, к которой ст. 196 и отсылает. Продолжительность в файл не зашита — требование Р-009 соблюдено.'
