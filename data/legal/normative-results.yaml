    note: 'Шаг 6, первый пункт сверен построчно. Ч. 1: «исполнительный документ о взыскании денежных средств
      или об их аресте может быть направлен в банк или иную кредитную организацию непосредственно взыскателем»
      — документ передаёт это как право направить, минуя приставов, верно. Ч. 2 существует в приведённом
      смысле: одновременно с исполнительным документом взыскатель представляет заявление с перечисленными
      сведениями. Ч. 3.1 существует и даёт названное последствие: документ, поступивший без сведений,
      предусмотренных ч. 2 или 2.1, возвращается без исполнения направившему лицу. «Перечень сведений
      правился» подтверждается пометками редакций 451-ФЗ от 28.11.2018 и 624-ФЗ от 29.12.2022 внутри ч.
      2 и ч. 3.1. Второй пункт: утверждения о месте предъявления в тексте нет, оставлена отсылка к действующей
