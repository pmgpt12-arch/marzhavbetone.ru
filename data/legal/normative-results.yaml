# файл существует. Отчёт от 15.08.2026 не должен пропускать документ,
# изменённый 16.08: хеш другой, значит результата для этой версии нет.
#
# Модель отсюда не вызывается. Гейт `tools/normative_gate.py` только
# проверяет, что годный результат существует; добывает его отдельный заход
# `normative-checker` — сегодня руками, автоматический запуск по diff это
# следующий этап, и обещать его до доказанного P0 нельзя.
#
# `source_hash` у каждой нормы — хеш offline-доказательства, против
# которого сверялись. Пусто значит «результат ни к какой редакции не
# привязан»: сверка D-06 шла по поисковой выдаче, сохранённого текста
# нормы за ней не стоит. Гейт такой результат не принимает.
#
# `recheck` заполняется, когда вердикт был PASS_WITH_CORRECTIONS или FAIL:
