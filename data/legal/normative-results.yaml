  issues:
  - Приложение «8. Копия свидетельства о государственной регистрации Истца либо лист записи ЕГРЮЛ» — это
    требование п. 4 ч. 1 ст. 126 АПК РФ, а в прочитанном тексте нормы стоит «4) (Пункт утратил силу -
    Федеральный закон от 25.12.2023 № 667-ФЗ)». Действующий перечень ч. 1 ст. 126 такого приложения не
    содержит.
  - 'В перечне приложений нет документов, названных п. 5 ч. 1 ст. 126 АПК РФ помимо доверенности: «копии
    документов о высшем юридическом образовании или об ученой степени по юридической специальности представителя,
    подписавшего исковое заявление, либо документов, удостоверяющих его статус адвоката, патентного поверенного,
    арбитражного управляющего, единоличного органа управления организации». Приложение 9 ограничено доверенностью
    и полномочиями; при подписании иска представителем по доверенности комплект неполон, и это основание
    оставить заявление без движения по ч. 1 ст. 128 АПК РФ.'
  - Шаблон объявлен пригодным для сторон-ИП («обе стороны — юридические лица или индивидуальные предприниматели»),
    но шапка содержит только организационный набор реквизитов (наименование, ИНН, ОГРН, адрес). П. 2 и
    3 ч. 2 ст. 125 АПК РФ для гражданина-предпринимателя требуют фамилию, имя, отчество, дату и место
