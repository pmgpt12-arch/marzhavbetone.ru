    note: 'Фрагмент 4. П. 1 ст. 719 даёт право не приступать к работе и приостановить начатую в двух случаях:
      нарушение заказчиком обязанностей препятствует исполнению договора подрядчиком и наличие обстоятельств,
      очевидно свидетельствующих, что эти обязанности не будут исполнены в установленный срок. Добавленное
      вторым правкой основание воспроизведено верно и отнесено к тому же пункту верно; п. 1 сам отсылает
      к ст. 328.'
  - norm_id: gk-753
