    note: 'Фрагмент 2. Вариант «Истец — ИП» сверен дословно с п. 2 ч. 2 ст. 125: ФИО (при наличии отчества),
      дата и место рождения, место жительства или место пребывания, дата и место государственной регистрации
      в качестве ИП, один из идентификаторов (СНИЛС, ИНН, документ, удостоверяющий личность, водительское
      удостоверение), номера телефонов, факсов, адреса электронной почты. Состав полный, лишнего нет;
      ветка «место работы» для ИП правомерно не взята — норма даёт её через «или». ОГРНИП в п. 2 отсутствует
      и в варианте истца его нет — верно. Вариант «Ответчик — ИП» сверен с п. 3 ч. 2 ст. 125: ФИО, дата
      и место рождения, место жительства или место пребывания, место работы (если известно) и один из
      идентификаторов (СНИЛС, ИНН, документ, удостоверяющий личность, ОГРНИП, водительское удостоверение).
      Состав полный, ОГРНИП присутствует — в п. 3 он есть. Телефонов/факсов/почты в варианте ответчика
      нет — п. 3 их и не требует. Разница составов п. 2 и п. 3, найденная прежним заходом, в правке отражена
      верно. Фрагмент 7. Позиция 7 приложений: п. 9 ч. 1 ст. 126 существует, требует выписку ЕГРЮЛ/ЕГРИП
      по истцу и ответчику и содержит срок «не ранее чем за ... до дня обращения истца в арбитражный суд».
      Отсылка к пункту вместо числа корректна. Фрагмент 8. Позиция 9 — п. 6 ч. 1 ст. 126 (копии определения
      об обеспечении имущественных интересов до предъявления иска) — номер и предмет совпадают. Позиция
      10 — п. 7.1 ч. 1 ст. 126 (документы о действиях, направленных на примирение, если такие действия
      предпринимались и документы имеются) — совпадает дословно. Позиция 12 — п. 4 ч. 1 ст. 126 значится
      в тексте как утративший силу (ФЗ от 25.12.2023 № 667-ФЗ); вывод «в обязательный перечень не входит»
      подтверждён. Оговорка о прежнем содержании п. 4 — см. I-16-1. Полнота перечня приложений: обязательные
      позиции ч. 1 ст. 126 закрыты — п. 1 позицией 1, п. 2 позицией 2, п. 3 позициями 3 и 4, п. 5 позицией
      8, п. 6 позицией 9, п. 7 позицией 6, п. 7.1 позицией 10, п. 9 позицией 7. Обязательной пропущенной
      позиции нет. Не представлен только п. 8 (проект договора) — он обусловлен требованием о понуждении
      заключить договор и к иску о взыскании задолженности неприменим; дефектом не считаю.'
