    note: 'Фрагмент 7. П. 4 ст. 753: односторонний акт может быть признан судом недействительным лишь
      в случае, если мотивы отказа от подписания признаны судом обоснованными. Документ излагает это как
      риск («может быть признан недействительным»), модальность нормы удержана; прежнее утверждение заменено
