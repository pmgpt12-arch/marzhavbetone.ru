  task: FINAL LEGAL CLOSURE P1 — узкий заход по изменённым фрагментам
  norms_checked:
  - norm_id: apk-4-5
    source_hash: sha256:6603e670456f0ab3a8ec287c3626d56613e7623428a3c7ba937c8b0cc1a67d44
    source_class: official
    verdict: соответствует
    note: 'Текст прочитан в этом заходе из data/legal/evidence/apk-4-5.yaml (source_class official, retrieved_at
      2026-08-16, edition_marker «ред. от 15.12.2025, действует с 01.01.2026»); прямой доступ к публикатору
      из сессии закрыт. Часть 5 устанавливает только срок ожидания — передача спора о взыскании денежных
      средств по требованиям из договоров возможна по истечении тридцати календарных дней со дня направления
      претензии (требования), если иные срок и (или) порядок не установлены законом или договором. Никакого
      процессуального последствия несоблюдения эта часть не называет. Проверено по вопросу 4 задания:
      во фрагменте 3 раздела «Следующий шаг» документ статей не называет вовсе и последствий («возвращение
      искового заявления», «оставление иска без рассмотрения») части 5 статьи 4 не приписывает. Противоречия
      между частью 5 статьи 4 и статьями 128/148 нет: первая задаёт условие передачи спора в суд, вторые
      — реакцию суда на поданное заявление; предметы разные, взаимного исключения в текстах нет. Вывод
      не противоречит подтверждённому ранее Ф-2 (счёт срока ожидания со дня направления письма).'
  - norm_id: gk-395
    source_hash: sha256:07ae25b8650a6efb592a911c1ae0c8ff2ff876dfb8da065293113f120ac338bd
    source_class: official
    verdict: соответствует
    note: 'Текст прочитан в этом заходе из data/legal/evidence/gk-395.yaml (source_class official, retrieved_at
      2026-08-16, edition_marker «ред. ФЗ от 03.07.2016 № 315-ФЗ»). К предмету этого захода — фрагменту
      3 раздела «Следующий шаг» — статья 395 отношения не имеет: процессуальных последствий подачи иска
      она не устанавливает, и фрагмент 3 на неё не опирается. Норма включена в norms_checked по требованию
      полноты покрытия (правило 8а). Расхождений с фрагментом 3 нет; ранее подтверждённый Ф-1 (пункт 4
      статьи 395, соотношение договорной неустойки и процентов) с выводом этого захода не спорит. Порядок
      расчёта процентов — входное поле документа и в этом заходе не пересчитывался, значение ставки не
      сверялось и не называется.'
  - norm_id: apk-128-148
    source_hash: sha256:5ab245b1975ce0794aaa5595c88088d4fa12e607e23d34c37bea8932e9b9628e
    source_class: official
    verdict: соответствует
    note: 'Текст прочитан в этом заходе из data/legal/evidence/apk-128-148.yaml (source_class official,
      retrieved_at 2026-08-16). Оговорка о качестве доказательства: поле edition_marker в этом файле пустое,
      в отличие от apk-4-5 и gk-395; редакция подтверждается только внутренними отметками самого текста
      (по статье 148 — вплоть до ФЗ от 02.03.2016 № 47-ФЗ, по статье 128 отметок нет). Состав прочитанного:
      статья 128 частей 1–4, статья 148 части 1 (пункты 1–9) и 2. Вопрос 1 — разведение последствий. По
      тексту статьи 148 части 1 пункта 2 арбитражный суд оставляет исковое заявление без рассмотрения,
      если ПОСЛЕ ЕГО ПРИНЯТИЯ К ПРОИЗВОДСТВУ установит, что истцом не соблюден претензионный или иной
      досудебный порядок урегулирования спора с ответчиком (за исключением случаев, если его соблюдение
      не предусмотрено федеральным законом). То есть несоблюдение досудебного порядка даёт именно оставление
      без рассмотрения, и стадия — после принятия к производству. По тексту статьи 128 части 1 нарушение
      требований, установленных статьями 125 и 126 (форма заявления и приложения), даёт оставление заявления
      без движения, и стадия — рассмотрение вопроса о принятии заявления к производству; по части 4, если
      обстоятельства не устранены в срок, суд возвращает исковое заявление и прилагаемые документы в порядке
      статьи 129. Значит возвращение заявления привязано текстом к неустранению нарушений формы и приложений
      и наступает на стадии принятия. Документ называет оба последствия их собственными терминами кодекса
      и местами их не меняет: он нигде не приписывает оставлению без рассмотрения стадию принятия, а возвращению
      — стадию после принятия, и вообще стадий не называет. Разведение по существу верно. Вопрос 2 — третье
      последствие. Оставление заявления без движения в тексте есть (статья 128 части 1–3), документ его
      не называет и с двумя названными не смешивает: термин «без движения» во фрагменте не встречается,
      а «без рассмотрения» использован в значении статьи 148. Пропуск не создаёт ошибки и согласуется
      с частью 3 статьи 128: при устранении обстоятельств в назначенный судом срок заявление считается
      поданным в день первоначального поступления и принимается к производству, то есть само по себе оставление
      без движения той потери, которую фрагмент считает деньгами и временем, не даёт. Вопрос 3 — ширина
      обещания. Здесь единственная неподтверждённая позиция, вынесена в issues как I-13-1. Оборот «из-за
      спора о досудебном порядке» отнесён во фрагменте сразу к обоим последствиям. Для оставления иска
      без рассмотрения связь подтверждается дословно (статья 148 часть 1 пункт 2). Для возвращения искового
      заявления прочитанный текст такой связи не даёт: статья 128 часть 4 связывает возвращение с неустранением
      нарушений статей 125 и 126, а перечня собственных оснований возвращения (статья 129) в пакете доказательств
      нет, как нет и текста статьи 126, по которому можно было бы установить, входит ли документ о направлении
      претензии в состав обязательных приложений. Расхождением это не названо: прочитанному тексту фраза
      не противоречит, возвращение как реальное последствие стадии принятия статьёй 128 частью 4 подтверждено,
      — но и подтверждённой связь с досудебным спором не является, поэтому позиция помечена «не найдена»
      и адресована владельцу. Вопрос 4 — приписывание последствия норме. Не приписывает: см. note по apk-4-5.'
  verdict: PASS_WITH_CORRECTIONS
  issues:
  - id: I-13-1
    severity: low
    where: 'Раздел «Следующий шаг», последний абзац (фрагмент 3): «...дешевле, чем возвращение искового
      заявления или оставление иска без рассмотрения из-за спора о досудебном порядке»'
    text: 'Позиция «не найдена», требует проверки владельцем. Оборот «из-за спора о досудебном порядке»
      отнесён к обоим названным последствиям. Для оставления иска без рассмотрения связь подтверждена
      дословно (статья 148 часть 1 пункт 2 АПК РФ: несоблюдение претензионного или иного досудебного порядка,
      стадия — после принятия к производству). Для возвращения искового заявления прочитанный текст прямой
      связи с досудебным порядком не даёт: статья 128 часть 4 связывает возвращение с неустранением нарушений
      статей 125 и 126 в назначенный судом срок и отсылает к порядку статьи 129, текста которой в пакете
      доказательств нет. Правового вреда покупателю нет: обещание шире нормы в сторону более осторожного
      действия — рекомендация «берите первый ход» от этого не меняется и риск не занижается. Но утверждение
      о процессуальном последствии стоит в документе неподтверждённым, и молчать о нём нельзя.'
  corrections:
  - id: C-13-1
    for: I-13-1
    kind: предложение автору документа; правка в этом заходе не вносилась
    proposal: 'Привести оборот в границы подтверждённого текста — например: «...дешевле, чем оставление
      иска без рассмотрения из-за спора о досудебном порядке или возвращение заявления, если суд не увидит
      в приложениях подтверждения досудебного порядка и вы не устраните это в назначенный им срок». Вариант
      короче: снять «возвращение искового заявления» из перечня и оставить одно подтверждённое последствие.
      Выбор формулировки и решение вообще её менять — за владельцем; альтернатива правке названа в поле
      recheck.'
  recheck: 'Требуется один заход при условии, что владелец решит сохранить фразу в нынешнем виде: добавить
    в контур документа норму «АПК РФ, статья 129» (основания возвращения искового заявления) и сверить
    по её официальному тексту, значится ли несоблюдение претензионного или иного досудебного порядка самостоятельным
    основанием возвращения на стадии принятия. Попутно — при том же заходе — добрать текст статьи 126
    (состав приложений) для второй возможной опоры и заполнить пустое поле edition_marker в data/legal/evidence/apk-128-148.yaml.
    Если владелец примет предложенную правку corrections.C-13-1, повторная сверка по этому документу не
    требуется: оставшаяся связь подтверждена дословно.'
