# Money graph: связи по процессу подрядчика, а не по похожести тем.
#
# Читает `tools/money_graph.py`. Смысл файла в одном: ссылка «читайте
# также» отвечает на вопрос «о чём ещё есть текст», а подрядчику нужен
# ответ «что у меня дальше». Порядок здесь — реальная последовательность
# событий на объекте, и по ней проверяется, ведёт ли страница вперёд.
#
# Маршруты заданы владельцем в постановке этапа. Шаги сопоставлены с уже
# опубликованными страницами: ни одного адреса, которого нет на сайте.
# Шаг без своей страницы записан как `page: ~` и попадает в отчёт дырой —
# это кандидат на CREATE, а не повод завести URL молча.
#
# Что чем считается:
#   next_problem — куда человек попадает, если пошло не так;
#   previous_problem — откуда он пришёл;
#   free_material — бесплатная проверка на этом шаге;
#   paid_product — комплект, закрывающий этот шаг.
# Первые два ставятся здесь, вторые два берутся из самой страницы:
# дублировать их значило бы завести второй источник истины.

chains:

  # Маршрут 1 из постановки: допработы → фиксация → объёмы → КС-2 →
  # приёмка → срок оплаты → неоплата → претензия.
  dopraboty_to_pretenziya:
    title: От допработ до претензии
    steps:
      - step: допработы возникли
        page: articles/dopolnitelnye-raboty-v-stroitelstve.html
      - step: поручение не зафиксировано
        page: articles/dopraboty-bez-soglasheniya.html
      - step: объёмы и смета расходятся
        page: articles/stroitelnyy-musor-v-smete.html
      - step: КС-2 предъявлена
        page: articles/proverka-ks-2-pered-sdachey.html
      - step: работы не приняты
        page: articles/raboty-ne-prinyaty.html
      - step: акт подписан, срок оплаты идёт
        page: articles/podpisannaya-ks2-ne-znachit-chto-zaplatyat.html
      - step: оплаты нет
        page: articles/zakazchik-ne-oplachivaet-vypolnennye-raboty.html
      - step: доказательства для требования
        page: articles/pyat-dokazatelstv-vypolneniya.html

  # Маршрут 2 из постановки: ИД → замечания → отказ в приёмке → КС →
  # оплата.
  id_to_oplata:
    title: От исполнительной документации до оплаты
    steps:
      - step: состав комплекта
        page: articles/ispolnitelnaya-dokumentaciya-sostav.html
      - step: скрытые работы актируются
        page: articles/akty-skrytyh-rabot-kakie.html
      - step: акт возвращают с замечаниями
        page: articles/akt-skrytyh-rabot-obrazec.html
      - step: заключение о соответствии
        page: articles/zos-v-stroitelstve.html
      - step: работы не приняты
        page: articles/raboty-ne-prinyaty.html
      - step: оплаты нет
        page: articles/zakazchik-ne-oplachivaet-vypolnennye-raboty.html

  # Удержания: деньги уже заработаны и удержаны. Кластер владельца № 4.
  uderzhaniya:
    title: Гарантийное удержание от подписи до возврата
    steps:
      - step: что это и сколько стоит
        page: articles/garantiynoe-uderzhanie-chto-eto.html
      - step: где показывать в формах
        page: articles/garantiynoe-uderzhanie-v-ks-2-i-ks-3.html
      - step: от какого события идёт срок
        page: articles/srok-garantiynogo-uderzhaniya.html
      - step: срок подошёл, деньги не вернули
        page: articles/vozvrat-garantiynogo-uderzhaniya.html

  # Аванс: деньги пришли вперёд и стали обязательством.
  avans:
    title: Аванс от получения до возврата
    steps:
      - step: чем аванс опасен
        page: articles/avans-eto-ne-dengi-eto-kryuchok.html
      - step: чем обеспечен возврат
        page: articles/bankovskaya-garantiya-na-vozvrat-avansa.html
      - step: требуют вернуть
        page: articles/vozvrat-avansa-po-dogovoru-podryada.html
      - step: считать надо разницу
        page: articles/neotrabotannyy-avans.html

  # Договор: единственный маршрут, который идёт до объекта, а не после.
  dogovor:
    title: Договор до подписи
    steps:
      - step: разделы, от которых зависит оплата
        page: articles/dogovor-subpodryada-obrazec.html
      - step: формулировки, на которых надо остановиться
        page: articles/krasnye-flagi-dogovora-subpodryada.html
      - step: как заявить разногласия
        page: articles/protokol-raznoglasiy-k-dogovoru.html
      - step: площадку принимают с замечаниями
        page: articles/akt-peredachi-stroitelnoy-ploshchadki-obrazec.html

  # Банкротство: маршрут, на котором обычный путь к деньгам закрыт.
  bankrotstvo:
    title: Банкротство генподрядчика
    steps:
      - step: признаки за год до первого акта
        page: articles/bankrotstvo-genpodryadchika-5-markerov.html
      - step: что такое реестр требований
        page: articles/reestr-trebovaniy-kreditorov.html
      - step: срок включения
        page: articles/srok-vklyucheniya-v-reestr-trebovaniy-kreditorov.html
      - step: порядок действий
        page: articles/vklyuchenie-v-reestr-trebovaniy-kreditorov.html
      - step: заявление
        page: articles/zayavlenie-o-vklyuchenii-v-reestr-trebovaniy.html
      - step: запрос управляющему
        page: articles/zapros-arbitrazhnomu-upravlyayushchemu.html
