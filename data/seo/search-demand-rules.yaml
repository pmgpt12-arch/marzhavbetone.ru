# Правила предварительной разметки поискового спроса.
#
# Читает `tools/search_demand.py`. Здесь, а не в коде, потому что это не
# вычисление, а суждение: маркер, который сегодня верен, завтра ловит
# чужой запрос, и править его должен человек без правки инструмента.
#
# Разметка предварительная. Вердикт по строке — решение владельца, как
# пороги и состав каталога: инструмент ставит гипотезу, а не приговор.
#
# Порядок проверки жёсткий и обратный приоритету: IRRELEVANT → MONEY →
# PROBLEM → INFORMATION. Сначала отсекается чужой запрос, иначе «работа
# вахтой» попадёт в MONEY по слову «оплата».
#
# business_value назначается автоматически: MONEY → A, PROBLEM → B,
# INFORMATION → C, IRRELEVANT → D. Отдельного списка нет намеренно —
# два источника истины разъедутся.

# Готовность к действию — отдельная ось от четырёх выше, читает её
# колонка commercial_intent. intent называет природу боли, commercial_intent —
# близость к покупке: «как оформить акт скрытых работ» по природе PROBLEM,
# но человек уже собирает документ, и путь до комплекта у него короче, чем
# у запроса «не платят», где сначала статья. Порядок жёсткий: IRRELEVANT
# отсекает первым — чужой запрос не получает категории вовсе, сколько бы
# «купить» и «цена» в нём ни стояло; затем маркер действия; без маркера
# категория наследует intent. Маркер действия — человек делает или ищет
# сам документ, а не спрашивает о нём.
action:
  - "образец"
  - "бланк"
  - "шаблон"
  - "скачать"
  - "форма кс"
  - "как составить"
  - "составить акт"
  - "как заполнить"
  - "как оформить"
  - "оформить акт"
  - "опись передачи"
  - "акт передачи"

# Не наша аудитория и не наша бизнес-модель. Стоит первым: отсекает
# раньше, чем сработает денежный маркер.
irrelevant:
  - "вакансии"
  - "работа вахтой"
  - "зарплата прораба"
  - "калькулятор бетона"
  - "купить бетон"
  - "цена за куб"
  - "материалы оптом"
  - "снип"
  - "гост на бетон"
  - "ремонт квартиры"
  - "частный дом"
  - "дизайн проект"

# У человека уже есть денежная проблема: деньги не пришли, их удержали,
# их требуют назад. Максимальный приоритет.
money:
  - "не платит"
  - "не оплачивает"
  - "не оплатил"
  - "не заплатил"
  - "не перечислил"
  - "задолженность"
  - "долг за работы"
  - "взыскать"
  - "взыскание"
  - "претензия"
  - "неустойка"
  - "проценты за пользование"
  - "395"
  - "вернуть удержание"
  - "вернуть гарантийное удержание"
  - "вернуть обеспечение"
  - "возврат гарантийного удержания"
  - "не возвращает"
  - "просрочка оплаты"
  - "срок оплаты истек"
  - "срок оплаты истёк"
  - "деньги нет"
  - "денег нет"
  # «кс-2 подписана, оплаты нет» — пример владельца, отданный правилами в
  # INFORMATION по слову «кс-2»: денежного маркера на «оплаты нет» не было.
  - "оплаты нет"
  - "оплата не поступила"
  - "не поступила оплата"
  - "не поступили деньги"
  - "оплаты так и нет"
  - "оплата по кс"
  - "оплата выполненных работ"
  - "банкротство генподрядчика"
  - "реестр требований кредиторов"

# Денежного риска ещё не назвали, но человек стоит вплотную к нему:
# документ не подписан, работы не приняты, допы не оформлены.
problem:
  - "не подписывает"
  - "не подписан"
  - "отказ от приемки"
  - "отказ от приёмки"
  - "не принимает работы"
  - "работы не приняты"
  - "замечания"
  - "возврат кс"
  - "вернули кс"
  - "односторонний акт"
  - "без допсоглашения"
  - "без согласования"
  - "дополнительные работы"
  - "допработы"
  - "гарантийное удержание"
  - "удержание"
  - "штраф"
  - "зачет"
  - "зачёт"
  - "аванс"
  - "не принята документация"
  - "исполнительная документация не"
  - "протокол разногласий"
  # Различает не объект, а действие. Примеры владельца: «как оформить акт
  # скрытых работ» — PROBLEM (человек делает и рискует), «кто подписывает
  # акт скрытых работ» — INFORMATION (справочный вопрос). Поэтому в
  # PROBLEM попадает глагол с объектом, а не объект сам по себе.
  - "оформить акт скрытых работ"
  - "составить акт скрытых работ"
  - "оформить допработы"
  - "зафиксировать допработы"
  - "оформить дополнительные работы"
  - "расхождение объемов"
  - "расхождение объёмов"
  - "объемы не совпадают"

# Профессиональный вопрос без названного риска. Развивать там, где виден
# путь к денежной проблеме, и только там.
information:
  - "что такое"
  # «что входит в папку которую собирает пто» — реальный запрос базы
  # 15.08.2026, тот же вопрос, что «состав», другими словами.
  - "что входит"
  - "кто подписывает"
  - "как заполнить"
  - "как оформить"
  - "образец"
  - "форма кс"
  - "состав"
  - "срок"
  - "порядок"
  - "кс-2"
  - "кс-3"
  - "акт скрытых работ"
  - "исполнительная документация"
  - "договор субподряда"
  - "смета"
