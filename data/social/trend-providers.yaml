# Источники референсов для роликов: реестр, а не подключение.
#
# ЗАЧЕМ ФАЙЛ. Ролик без разобранного референса — угадывание. Требование
# владельца 23.08.2026: до сценария на руках должно быть 3–5 реальных
# роликов с числами, разобранных по механике. Отсюда слой провайдера:
# источник меняется, конвейер роликов не переписывается.
#
# ЧТО ЗДЕСЬ НЕ ДЕЛАЕТСЯ. Скрейпинг чужого интерфейса браузером не
# заводится, пока есть провайдер с объявленным API: он ломается на первой
# правке вёрстки и нарушает условия площадки. Отказ провайдера с кодом
# ответа — довод; «наверное, закрыто» — нет.
#
# СОСТОЯНИЕ ПРОВЕРКИ. `checked` говорит, чем именно проверено:
#   docs   — прочитана документация, ключа нет, вызова не было
#   probe  — вызов сделан, ответ получен, поля сверены
#   used   — по нему собраны карточки, лежащие в content/reels/references/
# Ни один провайдер не считается подключённым по документации.

# Провайдер по умолчанию. `file` не ходит в сеть вовсе: читает выгрузку,
# которую владелец кладёт руками. Это не заглушка, а рабочий режим —
# им контур живёт, пока не заведён ключ.
active: file

providers:

  file:
    title: Выгрузка владельца
    kind: local
    checked: used
    checked_at: 2026-08-23
    input: content/reels/references/inbox/
    formats: [json, yaml]
    key_env: null
    cost: 0
    limits: >-
      столько, сколько владелец выгрузил. Числа берутся из выгрузки как
      есть; чего в ней нет, того нет и в карточке
    note: >-
      Ручной шаг владельца здесь оправдан не удобством, а тем, что из
      облачной сессии не открывается ни один провайдер (см. blocked_egress).

  scrapecreators:
    title: ScrapeCreators
    kind: api
    checked: docs
    checked_at: 2026-08-23
    base_url: https://api.scrapecreators.com
    key_env: SCRAPECREATORS_API_KEY
    auth: header x-api-key
    endpoints:
      profile_reels: /v1/instagram/user/reels
      post_info: /v1/instagram/post
      search: /v1/instagram/search
    free_tier: 100 кредитов при регистрации, карта не требуется
    cost: >-
      пакетами: $47 за 25 000 кредитов (~$1,88 за 1000 запросов),
      $497 за 500 000 (~$0,99 за 1000). Кредиты не сгорают, попадание в
      кэш стоит ноль
    login_required: false
    mcp: объявлен
    note: >-
      Проверено чтением документации 23.08.2026, вызова не было: домен
      закрыт выходным прокси сессии. Цена и состав полей до первого вызова
      считаются заявленными, а не измеренными.

  captapi:
    title: Captapi
    kind: api
    checked: docs
    checked_at: 2026-08-23
    base_url: https://api.captapi.com
    key_env: CAPTAPI_API_KEY
    auth: header x-api-key
    endpoints:
      profile_reels: /instagram/profile/reels
      reels_by_audio: /instagram/reels/by-audio-id
      post_info: /instagram/post
    free_tier: 100 кредитов при регистрации, карта не требуется
    cost: >-
      по эндпоинту: простые обращения 1–4 кредита, список последних роликов
      профиля ~12, подборка по звуку ~28 (1,4 за результат). Кэш бесплатен,
      отказ не тарифицируется
    login_required: false
    mcp: "@captapi/mcp, плюс CLI и узел n8n"
    note: >-
      Тот же статус: документация прочитана, вызова не было. Заявлены 32
      площадки и 178 эндпоинтов — для наших задач нужны три.

  virale:
    title: Virale (ChatPlace)
    kind: ui
    checked: docs
    checked_at: 2026-08-23
    key_env: null
    programmatic_access: not_found
    note: >-
      Открытого API, MCP, вебхука или выгрузки не найдено. Продукт описан
      как агент внутри своего интерфейса: разбирает аккаунт и ниши и отдаёт
      сценарии человеку. Официальная интеграция с Meta, о которой говорит
      описание, — про то, откуда Virale берёт данные, а не про интерфейс
      для нас. Проверить вызовом из этой сессии нечем: домен закрыт.
      Вывод: программно не подключён. Скрейпинг его интерфейса не
      заводится — есть провайдеры с объявленным API.
      Пересмотр — если у продукта появится страница разработчика.

# Почему ни один сетевой провайдер не проверен вызовом.
blocked_egress:
  measured_at: 2026-08-23
  command: curl -sS -o /dev/null --max-time 20 https://<домен>
  result: 'curl: (56) CONNECT tunnel failed, response 403'
  hosts:
    - api.scrapecreators.com
    - captapi.com
    - virale.io
    - api.telegram.org
  note: >-
    Закрыт выход сессии, а не провайдер. У раннера GitHub Actions выход
    есть — поэтому запрос к провайдеру живёт в прогоне
    `.github/workflows/trends.yml`, а не в сессии. Ключ заводит владелец:
    из сессии секрет репозитория не создаётся.
