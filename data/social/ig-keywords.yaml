# Слово в комментарии → бесплатный материал, который уйдёт в личные сообщения.
#
# Слова пишутся так, как их наберёт человек с телефона: без регистра, без
# пробелов внутри, без буквы «ё». Сравнение идёт по нормализованному виду
# (`ig_reply.php`), поэтому «КС2», «кс-2» и «Кс 2» — одно и то же слово.
#
# Ключ материала берётся из `lead.php`: список там закрытый, и расхождение
# ловит `tools/check_ig_keywords.py`. Придумывать здесь новый ключ нельзя —
# по нему нечего выдать.
#
# ЧТО УХОДИТ В СООБЩЕНИЕ. `deliver` решает, ссылка на страницу материала
# или прямая ссылка на архив:
#
#   page — страница с формой. Контакт остаётся у нас, дальше человек
#          получает архив тем же порядком, что и с сайта. Один лишний шаг.
#   file — архив напрямую. Шаг короче, контакта нет вовсе, и продолжить
#          разговор потом нечем.
#
# Значение по умолчанию — `page`: канал заводится ради продаж, а не ради
# скачиваний, и без контакта скачивание измеримо только как клик. Смена на
# `file` — решение владельца, правится здесь без кода.
defaults:
  deliver: page
  utm_source: instagram
  utm_medium: dm

keywords:
  - слова: [кс2, кс-2, кс]
    материал: dengi
    подпись: "КС подписаны, денег нет: первые 7 проверок"

  - слова: [аванс, авансом]
    материал: avans
    подпись: "Аванс и обеспечение: что проверить до подписи"

  - слова: [удержание, удержания, гарантийное]
    материал: uderzhaniya
    подпись: "Гарантийное удержание: что проверить до подписи"

  - слова: [допработы, допы, доп]
    материал: dop-raboty
    подпись: "Допработы: как зафиксировать поручение до начала"

  - слова: [договор, субподряд]
    материал: dogovor
    подпись: "Договор субподряда: красные флаги до подписи"

  - слова: [банкротство, банкрот]
    материал: bankrotstvo
    подпись: "Банкротство заказчика: проверка контрагента до подписи"

  - слова: [возврат, вернули, переделка]
    материал: vozvrat-ks
    подпись: "КС без возврата: проверочный лист комплекта"

  - слова: [квартиры, метры, взаимозачёт, взаимозачет]
    материал: raschet-metrami
    подпись: "Красные флаги сделки «работы за квартиры»"

  - слова: [исполнительная, идшка, ид]
    материал: ispolnitelnaya-dokumentaciya
    подпись: "Исполнительная документация: проверка комплекта до передачи"

  - слова: [скрытые, освидетельствование]
    материал: akt-skrytyh-rabot
    подпись: "Акт скрытых работ: какие работы его требуют и что в нём проверяют"
