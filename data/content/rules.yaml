# Правила контентного контура: когда материал нужен, а когда нет.
#
# Читает `tools/content_router.py`. Главное правило этапа записано первым,
# потому что оно противоположно привычному: нормальный результат работы —
# «сегодня публиковать нечего». Регулярность здесь не показатель.

# --- Классы материала -------------------------------------------------------
classes:
  A: Revenue — прямой денежный интент, ведёт на комплект
  B: Risk Prevention — проблема ещё не возникла, но приведёт к потере денег
  C: Evidence — исследование и разбор практики, работает на доверие
  D: Distribution — делается ради канала, обязан вести в A, B или C
  E: News Reaction — только если событие меняет действие подрядчика

# --- Роли каналов -----------------------------------------------------------
# Каналы не равнозначны. Попытка сделать их равными размывает и сайт, и
# соцсети: у каждого своя работа.
channels:
  site:      глубина и продажа, источник истины
  dzen:      поиск и рекомендации, обнаружение
  instagram: внимание, знакомство
  telegram:  удержание и повторное касание
  max:       удержание, второй мессенджер

# Пользователь, готовый купить с сайта, покупает с сайта. Телеграм — слой
# удержания, а не обязательная ступень воронки.
funnel_rule: не заставлять проходить через канал ради канала

# --- Приоритет ---------------------------------------------------------------
# Пять факторов, и вирусности среди них нет намеренно.
priority_factors:
  - money_impact: связь темы с деньгами подрядчика
  - demand: фактический интерес, замеренный, а не предполагаемый
  - novelty: есть ли новый вывод, а не пересказ
  - product_fit: естественная связь с комплектом
  - distribution: можно ли распространить

# --- Решение маршрутизатора --------------------------------------------------
decisions:
  - IGNORE
  - UPDATE_EXISTING
  - CREATE_ARTICLE
  - CREATE_RESEARCH
  - CREATE_FREE_MATERIAL
  - UPDATE_PRODUCT
  - CREATE_DZEN
  - CREATE_TELEGRAM
  - CREATE_REELS
  - CREATE_MULTI_CHANNEL_PACKAGE

# По умолчанию ищется существующий адрес. Новый заводится только под
# самостоятельный интент: это защита от каннибализации и разрастания.
default_decision: UPDATE_EXISTING

# --- Стандарт UTM ------------------------------------------------------------
# Не выдуман: закреплён тот, что уже используется в content/dzen,
# content/social и content/reels. Второй стандарт развёл бы отчётность.
utm:
  sources: [dzen, instagram, telegram, max]
  mediums: [article, post, reels, carousel, story]
  campaign: слаг темы или кампании, латиницей через дефис
  content: необязательно; когда нужен — идентификатор варианта

# Ссылка из внешнего канала без разметки не измеряется вовсе, поэтому
# отсутствие utm_source — дефект, а не мелочь.
require_utm_on_external: true

# --- Запреты -----------------------------------------------------------------
# Крючок с числом — утверждение о мире. Без ссылки на доказательство он
# ничем не отличается от выдумки, а в юридической теме стоит дороже охвата.
hook_number_requires_evidence: true

# Обороты, по которым крючок считается содержащим утверждение о факте.
factual_markers:
  - "млн"
  - "тыс"
  - "рублей"
  - "₽"
  - "%"
  - "дел"
  - "споров"
  - "решений"
  - "суд решил"
  - "суд взыскал"

# --- Частота -----------------------------------------------------------------
# Отсутствие публикации — допустимый и ожидаемый результат цикла.
no_publication_is_valid: true
