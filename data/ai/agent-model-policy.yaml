# Какая модель у какого исполнителя и почему. Правило 3 политики Р-060.
#
# Политика канонически живёт в соседнем репозитории —
# `ai-business-os/docs/AI_Execution_Policy.md`, второго её изложения здесь
# нет. Реестр при этом свой, и это не дубль: проверка обязана ловить нового
# исполнителя, а увидеть его она может только там, где он лежит. Схема
# общая с `ai-business-os/docs/Agent_Model_Policy.yaml`.
#
# ЗАЧЕМ. Замер 16.08.2026: ни в одном определении обоих репозиториев модель
# не задана, и в инциденте правового контура P1 это дало 804 вызова
# исполнителей из 843 на самой сильной модели — наследованием, а не
# решением. Пока выбор невидим, он и не обсуждается.
#
# Файл моделей не назначает: назначать их до замера качества по типам задач
# значило бы менять одну догадку на другую. Он требует объявленного режима.
#
#   python3 tools/check_agent_models.py

meta:
  rule: Р-060
  policy: ai-business-os/docs/AI_Execution_Policy.md
  updated: 2026-08-16
  agents_dir: .claude/agents
  # Реестр объявляет режим, мост его исполняет: без него запись `router`
  # оставалась пожеланием — нативный запуск `Agent` брал модель у среды.
  # Хук `PreToolUse` в `.claude/settings.json`. Маршруты и логика решения
  # живут у соседа; запрет держится и без него.
  bridge: tools/agent_bridge.py
  routes: ai-business-os/docs/Model_Ladder.yaml → routes

modes: [router, fixed, inherit_approved, unknown]

agents:
  # Все четверо — поисковый контур. Каждый в принципе исполним через API:
  # чтение файлов репозитория, разбор разметки, правки по названному
  # перечню. Замера, что дешёвая модель этого не тянет, нет ни одного,
  # поэтому честный статус — router, а не «наследуем, потому что так вышло».
  - agent: marzha-seo-auditor
    mode: router
    task_type: audit
    note: технический разбор по файлам; ничего не меняет
  - agent: marzha-seo-strategist
    mode: router
    task_type: research
    note: >-
      решает, какие страницы нужны; планка выше остальных трёх, но чем
      именно она держится — не измерено
  - agent: marzha-seo-implementer
    mode: router
    task_type: mechanical
    note: правки по уже разобранному перечню; суждения почти не требует
  - agent: marzha-seo-verifier
    mode: router
    task_type: review
    note: >-
      независимая проверка закрытия дефекта; автору правок на слово не верит,
      и это свойство задания, а не класса модели
