# «Кому подойдёт» и «Когда применять» для каждого комплекта.
#
# Замер 15.08.2026 (`tools/product_page_audit.py`): «кому подойдёт» стояло
# на одной странице товара из восемнадцати, «когда применять» — почти
# нигде. Это не мелочь оформления: этими двумя блоками покупатель узнаёт
# свою ситуацию до того, как начнёт читать состав. Не узнал — состав ему
# ни о чём не говорит, сколько файлов в нём ни перечисляй.
#
# Полей три, и они отвечают на три разных вопроса покупателя:
#
#   `result`  что окажется на руках после того, как комплектом
#             воспользовались. Не исход спора — исход зависит от договора и
#             от второй стороны, и обещать его нечем;
#   `when`    в какой точке процесса комплект берут;
#   `fit`     по каким признакам покупатель узнаёт свою ситуацию.
#
# Правила, по которым написано:
#
#   · признак — это положение дел на объекте, а не отрасль покупателя.
#     «Работы выполнены, КС-2 передана, подписания нет третью неделю», а
#     не «подходит строительным организациям»;
#   · `when` называет точку процесса, а не время суток: до подписи, по
#     ходу работ, после передачи комплекта, после наступления срока
#     оплаты;
#   · ни один блок не обещает исход спора. Комплект даёт документы и
#     порядок, а не результат;
#   · текст пишется под конкретный комплект. Общий текст, подходящий
#     любому товару, здесь запрещён: он ровно так же ничего не сообщает,
#     как и его отсутствие.
#
# Разметку собирает `tools/build_product_fit.py`. Руками в HTML не
# правится: восемнадцать независимых блоков в разметке разойдутся с
# каталогом на первой же правке линейки.

products:

  p1:
    result: Объём закрыт комплектом актов, а при неоплате есть готовый блок — уведомление, претензия, иск и расчёт процентов.
    when: Работы приняты или переданы, срок оплаты по договору наступил.
    fit:
      - КС-2 и КС-3 подписаны, срок оплаты прошёл, деньги не поступили.
      - Заказчик ссылается на «получение средств от своего заказчика».
      - Нужно закрыть объём так, чтобы к комплекту не было вопросов, и
        одновременно предъявить требование.
      - Переписка идёт третий месяц, а письменного следа с датами нет.

  p2:
    result: "Допобъём оформлен так, что его можно предъявить к оплате: задание, согласование цены, акт, переписка."
    when: Дополнительный объём уже выполнен либо его просят начать.
    fit:
      - Просили «начинать, потом оформим» — и объём вырос.
      - Заказчик отказывается принимать допработы, ссылаясь на договор.
      - Работы выполнены, но приказа, задания и согласованной цены нет.
      - Нужно зафиксировать объём так, чтобы его можно было закрыть.

  p3:
    result: Комплект КС проверен до отправки по чек-листу, а на типовые замечания есть готовый ответ.
    when: Комплект КС готовится к передаче — до отправки, а не после.
    fit:
      - КС-2 возвращают с замечаниями по второму и третьему разу.
      - Подписание затягивают, конкретных претензий не формулируют.
      - Нужен проверочный лист, чтобы поймать возврат у себя до передачи.
      - Хочется понимать типовые замечания заранее и иметь на них ответ.

  p4:
    result: Исполнительная собрана по перечню, с заготовками актов скрытых работ под ваши виды работ.
    when: Работы закрываются актами скрытых работ, комплект готовится к сдаче.
    fit:
      - Исполнительную возвращают, а к самим работам вопросов нет.
      - Нужны заготовки актов скрытых работ под разные виды работ.
      - Комплект собирается впервые и непонятно, что в нём обязательно.
      - Приёмка стоит, пока документация не принята.

  p5:
    result: Удержанное посчитано, на возврат отправлена претензия, на штраф и зачёт — возражение с контррасчётом.
    when: Часть суммы удержана либо срок возврата удержания подошёл.
    fit:
      - Гарантийное удержание не вернули, хотя срок по договору наступил.
      - Из оплаты вычли штраф или неустойку, расчёт не приложили.
      - Пришло уведомление о зачёте встречных требований.
      - Нужно посчитать, во что обходится замороженная сумма.

  p7:
    result: Опасные условия чужого договора названы поимённо, а правки оформлены протоколом разногласий.
    when: Договор ещё не подписан — условия правятся только сейчас.
    fit:
      - Прислали типовой договор субподряда, править его надо к сроку.
      - В проекте есть «оплата после оплаты», удержания и штрафы.
      - Нужен протокол разногласий, а не переписка в свободной форме.
      - Хочется увидеть опасные условия до подписи, а не после.

  p8:
    result: Условия аванса посчитаны до подписи, а после расторжения — неотработанный остаток и сальдо расчётов.
    when: Обсуждается размер и порядок погашения аванса — до подписания.
    fit:
      - Аванс предлагают под банковскую гарантию или обеспечение.
      - Непонятно, как аванс будет погашаться из КС-2 и что останется.
      - Договор расторгается, и надо посчитать неотработанный остаток.
      - Аванс и гарантийное удержание вычитаются из одного платежа.

  p9:
    result: Требование в реестр подготовлено, срок посчитан, переписка с управляющим идёт по заготовкам.
    when: У контрагента появились признаки неплатёжеспособности либо процедура уже введена.
    fit:
      - Заказчик перестал платить, пошли слухи о банкротстве.
      - Опубликованы сведения о введении процедуры, срок пошёл.
      - Нужно заявить требование и понять, куда именно его подавать.
      - Непонятно, где заканчивается ваша работа и начинается юрист.

  p10:
    result: Письменный ответ по своему сценарию — брак, срок, простой, гарантия — и разграничение ответственности до следующего спора.
    when: Претензия уже пришла — отвечать надо в срок.
    fit:
      - Пришла претензия по качеству, срокам или простою.
      - Ответ нужен письменный и по сценарию, а не «мы не согласны».
      - Молчание грозит тем, что претензию сочтут признанной.
      - Нужно разграничить ответственность со смежниками до спора.

  p11:
    result: Статус объекта и счёт эскроу запрошены письменно, а шесть шагов проверки дают решение «продолжать» или «стоп» до подписи.
    when: Расчёт метрами предложен, но договор и уступка ещё не подписаны.
    fit:
      - Вместо денег предлагают квартиры — уступку прав по ДДУ.
      - Непонятно, оплачено ли передаваемое право и пополнен ли эскроу.
      - Скидка от цены метра выглядит выгодной, и это настораживает.
      - Нужны готовые запросы о статусе объекта и состоянии эскроу.

  p12:
    result: "База по спору собрана: ответ, контррасчёт, работа с осмотром и экспертизой, опись доказательств."
    when: Спор о сумме уже идёт, базового ответа на претензию не хватает.
    fit:
      - Претензии приходят серией, суммы растут и зачитываются.
      - Нужен контррасчёт, а не только возражение по существу.
      - Требуется методика оспаривания, а не единичный документ.
      - База по спору собирается для передачи юристу.

  p13:
    result: Выпадающие затраты посчитаны до подписи, а разногласия по смете оформлены протоколом.
    when: Смета прислана, договор ещё не подписан.
    fit:
      - В смете нет вывоза мусора, подъёма на этаж, бытовки, зимнего удорожания.
      - Считаете, что «мелочи» съедят прибыль, но не знаете сколько.
      - Нужно увидеть выпадающие затраты до подписи, пока их можно включить.
      - Требуется протокол разногласий именно по смете.

  t1:
    result: Претензия с расчётом процентов отправлена так, что получение подтверждается.
    when: Первый неоплаченный акт — до того, как переписка стала спором.
    fit:
      - Срок оплаты прошёл, писем ещё не было.
      - Нужен мягкий первый шаг, а не сразу иск.
      - Надо посчитать проценты за просрочку и приложить расчёт.
      - Полный комплект пока не нужен — нужен первый ход.

  t2:
    result: "Передача зафиксирована: сопроводительное, опись с листажом и акт, отделяющий передачу от приёмки."
    when: Комплект исполнительной документации передаётся другой стороне.
    fit:
      - Передаёте документацию и хотите зафиксировать сам факт передачи.
      - Спорят не о качестве бумаг, а о том, что и когда было передано.
      - Нужна опись, которая сама считает листаж и позиции.
      - Важно отделить передачу от приёмки.

  t3:
    result: Возражение на акт или на зачёт отправлено в срок и способом, который подтверждает получение.
    when: Пришёл односторонний акт или уведомление о зачёте — счёт идёт на дни.
    fit:
      - Другая сторона прислала свою версию событий актом.
      - Из оплаты объявили зачёт встречных требований.
      - Возражение надо отправить в срок, иначе документ станет фактом.
      - Нужен порядок первого дня, а не разбор всей методики.

  t4:
    result: "Первый день пройден по шагам: требование и сроки понятны, ветка «срок уже прошёл» разобрана отдельно."
    when: Стало известно о банкротстве контрагента — первые дни.
    fit:
      - Появились публикации о процедуре или заявлении о банкротстве.
      - Претензия и иск в обычном порядке здесь уже не работают.
      - Нужен порядок действий одного дня и ветка «срок уже прошёл».
      - Пока непонятно, что делать самому, а с чем идти к юристу.

  t5:
    result: Первый ответ отправлен в срок, а документы, на которых построено требование, запрошены.
    when: Пришло требование вернуть аванс — ответить надо в срок.
    fit:
      - Требуют возврата всей перечисленной суммы, без расчёта.
      - Часть аванса отработана, но это нигде не зафиксировано.
      - Нужен ответ, который отправляется сразу, до полного расчёта.
      - Надо запросить документы, на которых построено требование.

  t6:
    result: Два запроса отправлены, и есть формулировка, которой можно не подписывать до ответа.
    when: Расчёт квартирами предложен — до подписания договора и уступки.
    fit:
      - Предлагают закрыть долг метрами вместо денег.
      - Непонятно, что именно передают: оплаченное право или долг за него.
      - Нужны два готовых запроса и формулировка отказа подписать.
      - Решение нужно сегодня, а разбираться в 214-ФЗ некогда.
