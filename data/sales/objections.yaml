# Что останавливает покупателя у цены — коротко и рядом с кнопкой.
#
# Замер 15.08.2026: ответы на возражения на страницах товаров были, но
# лежали в разделе «Вопросы до покупки» — ниже состава, ниже раздела «чего
# здесь нет», то есть примерно на четвёртом экране. Человек, который
# засомневался у цены, до них не доходит: он закрывает вкладку там же, где
# засомневался.
#
# Отсюда устройство блока: три-пять строк сразу под кнопкой, каждая —
# возражение и ответ на него одной фразой. Это не второй FAQ: развёрнутые
# ответы остаются внизу, здесь только то, что снимает сомнение на месте.
#
# Правила, по которым написано:
#
#   · ответ содержит проверяемый факт, а не уговор. «Ссылка приходит на
#     почту, плановый срок — до 5 минут», а не «доставка мгновенная»;
#   · исход спора не обещается ни одной строкой. Комплект даёт документы
#     и порядок; всё остальное зависит от договора и второй стороны;
#   · `common` одинаков у всех товаров намеренно — это факты продажи, и
#     они действительно одинаковы. Запрет на общий текст (см.
#     `product-fit.yaml`) касается описания ситуации покупателя: там общая
#     фраза не сообщает ничего. Здесь общий ответ сообщает факт;
#   · `products` — то, что спрашивают именно про этот комплект. Ровно по
#     одной строке: список из десяти возражений сам становится возражением.
#
# Разметку собирает `tools/build_objections.py`.

common:
  - q: Придут ли файлы сразу
    a: >
      Ссылка на скачивание уходит на указанную при заказе почту после
      подтверждения оплаты. Плановый срок автоматической выдачи — до пяти
      минут, ждать ответа человека не нужно.
  - q: Подойдёт ли под мой договор
    a: >
      Файлы редактируются в Word и Excel, поля для заполнения выделены в
      самих документах. Шаблон адаптируется под ваш договор — приоритет
      всегда у него, и в документах об этом сказано прямо.
  - q: А если не подойдёт
    a: >
      Порядок возврата зависит от того, отправлена ли уже ссылка на
      скачивание, и описан на странице <a href="/refund.html">«Возврат»</a>.
      При технической проблеме сначала восстанавливается доступ или
      заменяются файлы.

products:

  p1:
    q: Восемнадцать файлов — не многовато на одну задачу
    a: >
      Это два блока в одной папке: формы закрытия объёма и блок при
      неоплате — уведомление, претензия, расчёт процентов, исковое.
      Нужен только второй — он продаётся отдельно за 990 ₽.

  p2:
    q: Работы уже сделаны — задним числом это вообще оформляется
    a: >
      Часть да, часть нет, и комплект разделяет одно от другого: что ещё
      можно зафиксировать сейчас и чем подтверждать объём, когда
      согласования до начала работ не было.

  p3:
    q: У нас свой ПТО, зачем нам чужой проверочный лист
    a: >
      Затем, что возврат приходит не от вашего ПТО, а от чужого. Лист
      собран из типовых замечаний принимающей стороны — это её взгляд на
      ваш комплект, а не второй экземпляр вашего.

  p4:
    q: Формы актов есть в любом поиске
    a: >
      Формы — да. Здесь к ним перечень того, что обязательно в комплекте,
      порядок сборки и разбор типовых замечаний с ответами: возвращают
      обычно не из-за формы, а из-за состава.

  p5:
    q: Удержание прописано в договоре — что тут оспаривать
    a: >
      Условие об удержании и его применение — разные вещи. Комплект
      считает удержанное, проверяет наступление срока возврата и
      отвечает на штраф и зачёт письменно, а не спорит с самим условием.

  p7:
    q: Договор всё равно правит другая сторона
    a: >
      Поэтому в комплекте протокол разногласий, а не только образец
      договора: это форма, которой правят чужой текст, и разбор условий,
      по которым правки стоит требовать.

  p8:
    q: Аванс — это же просто деньги вперёд
    a: >
      Пока не начался спор. Комплект показывает, как условия аванса
      двигают вашу кассу, и считает неотработанный остаток при
      расторжении — тот, который потом требуют вернуть.

  p9:
    q: Тут же нужен юрист, а не шаблоны
    a: >
      Нужен, и комплект прямо называет, где он начинается. До этого есть
      работа, которую делаете вы: срок, маркеры, переписка с управляющим
      и подготовка требования.

  p10:
    q: Мы и так ответим письмом
    a: >
      Ответ по существу и ответ «мы не согласны» — разные документы.
      Здесь форма по каждому требованию отдельно и сценарии под брак,
      срок, простой и гарантию.

  p11:
    q: Расчёт метрами — обычная практика
    a: >
      Была до эскроу. Комплект проверяет ровно то, что изменилось:
      оплачены ли передаваемые права и не переходит ли к вам обязанность
      внести деньги на счёт.

  p12:
    q: 9 900 ₽ — почему дороже остальных
    a: >
      Это не один документ, а девятнадцать файлов на весь спор: ответ,
      контррасчёт, работа с осмотром и экспертизой, опись доказательств,
      профилактика. Нужен только ответ на претензию — он продаётся
      отдельно за 2 990 ₽.

  p13:
    q: Смету считает сметчик
    a: >
      Считает. Комплект про другое — про затраты, которых в смете нет:
      вывоз мусора, подъём на этаж, бытовка, зимнее удорожание. Их
      находят до подписи или не находят вовсе.

  t1:
    q: Пять файлов за 990 ₽ — что там может быть
    a: >
      Первый ход целиком: уведомление о просрочке, претензия, расчёт
      процентов и порядок действий. Полный комплект по этой ситуации —
      отдельный товар, и до него можно доплатить позже.

  t2:
    q: Мы и так передаём документацию под подпись
    a: >
      Тогда вопрос в том, что именно подтверждает подпись. Здесь опись,
      которая сама считает листаж и позиции, и акт, отделяющий факт
      передачи от приёмки.

  t3:
    q: Возражение можно написать и своими словами
    a: >
      Можно. Сложность не в словах, а в сроке и в подтверждении
      получения: комплект ведёт день по шагам и даёт две формы — на акт
      и на зачёт.

  t4:
    q: Мы ещё не уверены, что это банкротство
    a: >
      Первый файл про это и есть: маркеры, по которым отличают слухи от
      процедуры, и что делать до того, как о ней сообщат официально.

  t5:
    q: Расчёт всё равно готовить долго
    a: >
      Поэтому в комплекте ответ, который отправляется до расчёта, и
      запрос документов, на которых построено требование. Срок ответа
      идёт независимо от того, готовы вы или нет.

  t6:
    q: Решение нужно сегодня, читать некогда
    a: >
      Комплект собран под один день: два готовых запроса, порядок дня и
      формулировка отказа подписать до ответа. Разбор 214-ФЗ здесь не
      требуется.
