# Реестр проверок репозитория — единственный список, из которого их берут.
#
# Прежде список жил шагами `.github/workflows/checks.yml`, и это было не
# просто неудобно: шаги идут последовательно на `bash -e`, поэтому первая
# упавшая проверка отменяла все следующие. Замер 27.08.2026 — гейт умирал
# на `test_search_demand`, и `check_packages`, `check_free_materials`,
# `check_rss` не исполнялись в CI ни на одном PR.
#
# ПОЛЯ
#   id         — короткое имя, по нему же `--only`
#   команда    — что запускается, из корня репозитория
#   класс      — public: про выложенный сайт и выдачу покупателю;
#                internal: про внутреннюю кухню, витрины не касается
#   блокирует  — красит ли прогон. Только public может блокировать
#   зачем      — что охраняет, одной строкой; попадает в лог и в аннотацию
#   требует    — входные файлы. Нет файла — проверка не запускается и
#                печатается строкой «НЕТ ДАННЫХ» с именем пути. Это не
#                тихий пропуск: он назван и снимается сам, когда файл
#                вернётся
#   решение    — почему проверка не блокирует; для унаследованных — вердикт
#
# Прогон: python3 tools/run_checks.py --class public
