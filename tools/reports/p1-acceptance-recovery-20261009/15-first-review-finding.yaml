      "why": "Договор назван источником и для продолжительности срока исковой давности. Сохранённый текст п. 1 ст. 196 ГК РФ устанавливает общий срок сам и не допускает иного по договору. Договор влияет только на начало течения: по п. 2 ст. 200 давность начинается по окончании срока исполнения, а срок оплаты задаёт договор. Утверждение о продолжительности сильнее нормы. Если покупатель положится на договорное условие о сроке давности, он может пропустить срок.",
