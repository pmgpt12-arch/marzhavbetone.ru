      "location": "Вводный блок до раздела А",
      "old": "Важно, прочитайте до использования\nЭто типовой шаблон, а не юридическая консультация и не гарантия взыскания. Он рассчитан на типовую ситуацию: работы приняты, акты подписаны обеими сторонами без замечаний, встречных требований нет.\nНормативная сверка сопоставляет формулировки, сроки и порядок со статьями закона; она не заменяет юридическую консультацию и проверку обстоятельств вашего спора. Шаблон не заменяет консультацию по конкретной ситуации: выводы зависят от условий вашего договора, состава подписанных документов и обстоятельств спора, и приоритет всегда у договора. Если заказчик оспаривает объёмы или качество, заявляет зачёт, если акты подписаны неуполномоченным лицом или в картотеке арбитражных дел появилось дело о банкротстве должника — типовой текст создаёт ложную уверенность. В этих случаях обращайтесь к юристу до отправки.\nСтавок, сроков и размеров пошлин числом в шаблоне нет намеренно: они меняются, а скачанный файл не обновляется. Каждое число вы берёте из названного источника на дату составления документа.\nЗачем этот документ\nОн связывает остальные файлы комплекта: на каждом шаге назван документ, которым шаг закрывается, и названа развилка, на которой маршрут меняется. Основная ветка — раздел А — для случая, когда акты КС-2 и КС-3 подписаны заказчиком. Если заказчик уклоняется от подписания, это раздел Б, и там нужен юрист.",
