    {
      "id": "C-1",
      "old": "Первое письмо о долге: рабочий тон, но по содержанию — досудебное требование. Шаблон и инструкция.",
      "new": "Первое письмо о долге: рабочий тон, но по содержанию — досудебное требование. Форма письма и порядок заполнения.",
      "verdict": "подтверждена",
      "reason": "Изменено только название состава материала. Квалификация письма как досудебного требования сохранена без изменений и соответствует ч. 5 ст. 4 АПК РФ, где названа «претензия (требование)».",
      "norm_ids": ["apk-4-5"]
    },
    {
      "id": "C-2",
      "old": "Важно, прочитайте до использования",
      "new": "",
      "verdict": "подтверждена",
      "reason": "Удалён заголовок без правового содержания. Нормативного утверждения не было и не появилось.",
      "norm_ids": []
    },
    {
      "id": "C-3",
      "old": "Это типовой шаблон, а не юридическая консультация и не гарантия взыскания. Он рассчитан на типовую ситуацию: работы приняты, акты подписаны обеими сторонами без замечаний, встречных требований нет.",
      "new": "",
      "verdict": "подтверждена",
      "reason": "Удалена оговорка без ссылки на норму. Неизменённый текст письма по-прежнему исходит из принятых работ по КС-2/КС-3. Удаление не создаёт утверждения о результате взыскания, которое противоречило бы сохранённым нормам.",
      "norm_ids": []
    },
    {
      "id": "C-4",
      "old": "Нормативная сверка сопоставляет формулировки, сроки и порядок со статьями закона; она не заменяет юридическую консультацию и проверку обстоятельств вашего спора. Шаблон не заменяет консультацию по конкретной ситуации: выводы зависят от условий вашего договора, состава подписанных документов и обстоятельств спора, и приоритет всегда у договора. Если заказчик оспаривает объёмы или качество, заявляет зачёт, если акты подписаны неуполномоченным лицом или в картотеке арбитражных дел появилось дело о банкротстве должника — типовой текст создаёт ложную уверенность. В этих случаях обращайтесь к юристу до отправки.",
      "new": "",
      "verdict": "подтверждена",
      "reason": "Удалена оговорка без ссылки на норму. Условия применения в связанной части перенесены в C-10 как действие проверки. Требование сверять договор сохранено в неизменённых абзацах о сроке, неустойке и п. 4 ст. 395 ГК РФ. Противоречия с сохранёнными текстами норм нет.",
      "norm_ids": []
    },
    {
      "id": "C-5",
      "old": "Ставок, сроков и размеров пошлин числом в шаблоне нет намеренно: они меняются, а скачанный файл не обновляется. Каждое число вы берёте из названного источника на дату составления документа.",
      "new": "",
      "verdict": "подтверждена",
      "reason": "Удалено пояснение. В текущем тексте нет числовой ставки, пошлины или длительности досудебного срока: срок назван «применимым сроком досудебного урегулирования» с проверкой по закону или договору, что соответствует оговорке ч. 5 ст. 4 АПК РФ «если иные срок и (или) порядок не установлены законом или договором».",
      "norm_ids": ["apk-4-5"]
    },
    {
      "id": "C-6",
      "old": "Зачем этот документ",
      "new": "Результат применения",
      "verdict": "подтверждена",
      "reason": "Изменён заголовок раздела без правового содержания.",
      "norm_ids": []
    },
    {
      "id": "C-7",
      "old": "Часть 5 ст. 4 АПК РФ говорит о претензии или ином требовании и формы обращения не устанавливает. Поэтому текст ниже намеренно собран как требование: в нём есть основание, сумма, срок исполнения и названные последствия неисполнения. Достаточно ли конкретного письма для соблюдения досудебного порядка, оценивает суд по его содержанию — гарантии здесь не даёт ни один шаблон, и чем полнее изложено требование, тем меньше повод для спора.",
      "new": "Часть 5 ст. 4 АПК РФ говорит о претензии или ином требовании и формы обращения не устанавливает. Поэтому текст ниже намеренно собран как требование: в нём есть основание, сумма, срок исполнения и названные последствия неисполнения. Достаточно ли конкретного письма для соблюдения досудебного порядка, оценивает суд по его содержанию — поэтому изложите основание, сумму и срок исполнения и сохраните доказательства отправки.",
      "verdict": "подтверждена",
      "reason": "Правовая часть не изменилась: ч. 5 ст. 4 АПК РФ говорит о «претензии (требования)» и формы не устанавливает. Новое действие («сохраните доказательства отправки») согласуется с нормой, по которой срок исчисляется «со дня направления претензии (требования)». Утверждения сильнее нормы нет: новый текст не обещает, что суд признает порядок соблюдённым.",
      "norm_ids": ["apk-4-5"]
    },
    {
      "id": "C-8",
      "old": "Чего этот документ не делает",
      "new": "Что учесть при отправке",
      "verdict": "подтверждена",
      "reason": "Изменён заголовок раздела без правового содержания.",
      "norm_ids": []
    },
    {
      "id": "C-9",
      "old": "Не отказывается от процентов. Право на проценты по ст. 395 ГК РФ возникает с начала просрочки независимо от мягкости формулировок; исключение — п. 4 ст. 395: если соглашением сторон (в договоре или отдельным соглашением) предусмотрена неустойка за неисполнение или ненадлежащее исполнение денежного обязательства, проценты по ст. 395 не подлежат взысканию, если иное не предусмотрено законом или договором.",
      "new": "Мягкий тон письма сохраняет возможность заявить проценты по ст. 395 ГК РФ с начала просрочки. При договорной неустойке за денежное обязательство проверьте применение п. 4 ст. 395 ГК РФ и условия договора.",
      "verdict": "подтверждена",
      "reason": "П. 1 ст. 395 ГК РФ связывает проценты с «иной просрочкой в их уплате» и не ставит их в зависимость от тона требования, поэтому утверждение о сохранении возможности заявить проценты с начала просрочки верно. Адрес исключения указан правильно: именно п. 4 ст. 395 говорит о неустойке, предусмотренной «соглашением сторон», за неисполнение денежного обязательства. Оговорка «если иное не предусмотрено законом или договором» передана через проверку условий договора. «Договорная неустойка» соответствует неустойке, определённой договором, по п. 1 ст. 330 ГК РФ. Новый текст не сильнее нормы: он говорит о возможности заявить проценты, а не об их гарантированном взыскании.",
      "norm_ids": ["gk-395", "gk-330"]
    },
    {
      "id": "C-10",
      "old": "Не заменяет консультацию юриста в спорной ситуации: заказчик оспаривает акты, заявляет зачёт, есть признаки банкротства.",
      "new": "При оспаривании актов, зачёте или признаках банкротства сопоставьте переписку, договор и акты перед направлением требования.",
      "verdict": "подтверждена",
      "reason": "Новый текст ставит действие проверки на место направления к специалисту и не содержит правового утверждения. Он не противоречит п. 4 ч. 1 ст. 148 АПК РФ (требование, которое по федеральному закону рассматривается в деле о банкротстве): документ не утверждает, что при признаках банкротства иск подаётся в общем порядке.",
      "norm_ids": ["apk-128-148"]
    },
    {
      "id": "C-11",
      "old": "О тоне",
      "new": "",
      "verdict": "подтверждена",
      "reason": "Удалён заголовок без правового содержания.",
      "norm_ids": []
    },
    {
      "id": "C-12",
      "old": "Тон намеренно рабочий: задача — получить дату платежа, не сжигая отношения. Но требование при этом названо требованием и последствия указаны прямо — иначе документ пришлось бы потом доказывать как претензию. Мягкость здесь в формулировках, а не в содержании. Абзац о выбранных процентах или неустойке оставьте: он лишает заказчика довода «мы не знали, что счёт идёт».",
      "new": "",
      "verdict": "подтверждена",
      "reason": "Удалено пояснение без ссылки на норму. Абзац о начислении процентов или неустойки остаётся в тексте письма. Инструкция «оставьте одну и ту же ветку» в разделе «Проценты или договорная неустойка» не изменилась. Ст. 395 и ст. 330 ГК РФ не требуют уведомлять о начислении, поэтому удаление пояснения не лишает документ нормативно обязательного элемента.",
      "norm_ids": ["gk-395", "gk-330"]
    },
    {
      "id": "C-13",
      "old": "В описи вложения указывайте наименование из шапки письма — «Требование (претензия) об оплате задолженности», а не «уведомление»: опись доказывает, что направлено было именно требование.",
      "new": "В описи укажите название из шапки: «Требование (претензия) об оплате задолженности».",
      "verdict": "подтверждена",
      "reason": "Действие осталось тем же: в описи указывается наименование «Требование (претензия)». Обоснование сохранено в предыдущем неизменённом абзаце («она доказывает, что направлено было именно это требование»). Это соответствует формулировке «претензия (требование)» и моменту «направления» в ч. 5 ст. 4 АПК РФ.",
      "norm_ids": ["apk-4-5"]
    },
    {
      "id": "C-14",
      "old": "Порядок целиком — в файле «Алгоритм действий при задержке оплаты». Если сомневаетесь, какой ход ваш, берите первый: он дороже на неделю и дешевле, чем возвращение искового заявления или оставление иска без рассмотрения из-за спора о досудебном порядке.",
      "new": "Полный порядок и развилки приведены в файле «Алгоритм действий при задержке оплаты». При сомнении направьте развёрнутую претензию с расчётом и сохраните подтверждение её доставки.",
      "verdict": "подтверждена",
      "reason": "Удалены утверждения о последствиях: возвращение искового заявления (п. 5 ч. 1 ст. 129 АПК РФ) и оставление без рассмотрения (п. 2 ч. 1 ст. 148 АПК РФ). Удалена и оценка срока «на неделю». Новых утверждений о последствиях не появилось. Новое действие (направить претензию и сохранить подтверждение доставки) — это сбор доказательств. Оно не переносит начало срока: в неизменённом абзаце «Следующий шаг» срок по-прежнему отсчитывается «со дня направления письма», как в ч. 5 ст. 4 АПК РФ.",
      "norm_ids": ["apk-4-5", "apk-129", "apk-128-148"]
    }
  ],
