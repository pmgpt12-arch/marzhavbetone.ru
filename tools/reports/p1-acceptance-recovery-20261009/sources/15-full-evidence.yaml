  text: 2.1. Право на обращение в арбитражный суд возникает у конкурсного кредитора, должника, работника, бывшего
    работника должника в порядке, установленном пунктом 2 настоящей статьи, при условии предварительного, не менее
    чем за пятнадцать календарных дней до обращения в арбитражный суд, опубликования уведомления о намерении обратиться
    с заявлением о признании должника банкротом путем включения его в Единый федеральный реестр сведений о фактах
    деятельности юридических лиц. По истечении тридцати дней со дня опубликования указанного уведомления сведения,
    содержащиеся в нем, утрачивают силу.
