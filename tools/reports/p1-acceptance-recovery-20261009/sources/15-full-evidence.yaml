  note: ''
  text: 'Статья 8. Исполнение требований, содержащихся в судебных актах, актах других органов и должностных лиц,
    банками и иными кредитными организациями 1. Исполнительный документ о взыскании денежных средств или об их аресте
    может быть направлен в банк или иную кредитную организацию непосредственно взыскателем. 2. Одновременно с исполнительным
    документом взыскатель представляет в банк или иную кредитную организацию заявление, в котором указываются: 1)
    реквизиты банковского счета взыскателя, открытого в российской кредитной организации, или его казначейского
    счета, на которые следует перечислить взысканные денежные средства; (В редакции Федерального закона от 29.12.2022
    № 624-ФЗ ) 2) фамилия, имя, отчество, гражданство, реквизиты документа, удостоверяющего личность, место жительства
    или место пребывания, идентификационный номер налогоплательщика (при его наличии), данные миграционной карты
    и документа, подтверждающего право на пребывание (проживание) в Российской Федерации взыскателя-гражданина;
    3) наименование, идентификационный номер налогоплательщика или код иностранной организации, государственный
    регистрационный номер, адрес взыскателя - юридического лица. (В редакции Федерального закона от 28.11.2018 №
    451-ФЗ ) 2.1. Гражданин Республики Беларусь или организация Республики Беларусь, являющиеся взыскателем по исполнительному
    документу о взыскании алиментов на детей, о возмещении вреда, причиненного жизни или здоровью (в том числе о
    возмещении вреда в связи со смертью кормильца), о возмещении ущерба, причиненного преступлением, вправе в заявлении
    о направлении в банк или иную кредитную организацию такого исполнительного документа указать реквизиты своего
    банковского счета, открытого в белорусской кредитной организации, или счета Министерства финансов Республики
    Беларусь (его территориального органа), открытого в белорусском банке, на которые следует перечислить взысканные
    денежные средства. (Дополнение частью - Федеральный закон от 29.12.2025 № 536-ФЗ ) 3. Представитель взыскателя
    представляет документ, удостоверяющий его полномочия, и сведения, указанные в части 2 настоящей статьи, о взыскателе
    и о себе. 3.1. Исполнительный документ, поступивший для исполнения в банк или иную кредитную организацию без
    указания сведений, предусмотренных частью 2 или 2.1 настоящей статьи, возвращается без исполнения направившему
    его лицу. (Дополнение частью - Федеральный закон от 29.12.2022 № 624-ФЗ ) (В редакции Федерального закона от
    29.12.2025 № 536-ФЗ ) 4. (Часть утратила силу - Федеральный закон от 28.07.2012 № 144-ФЗ ) 5. Банк или иная
    кредитная организация, осуществляющие обслуживание счетов должника, исполняет содержащиеся в исполнительном
    документе требования о взыскании денежных средств или об их аресте с учетом требований, предусмотренных пунктом
    14 части 2 статьи 43, статьями 99 и 101 настоящего Федерального закона. (Дополнение частью - Федеральный закон
    от 21.02.2019 № 12-ФЗ ) (В редакции Федерального закона от 23.11.2024 № 391-ФЗ ) 6. Должник-гражданин вправе
    обратиться в банк или иную кредитную организацию, осуществляющие обслуживание его счетов и исполняющие содержащиеся
    в исполнительном документе требования о взыскании денежных средств или об их аресте, с заявлением о сохранении
    заработной платы и иных доходов ежемесячно в размере прожиточного минимума трудоспособного населения в целом
    по Российской Федерации (прожиточного минимума, установленного в субъекте Российской Федерации по месту жительства
    должника-гражданина для соответствующей социально-демографической группы населения, если величина указанного
    прожиточного минимума превышает величину прожиточного минимума трудоспособного населения в целом по Российской
    Федерации) при обращении взыскания на его доходы. Указанный прожиточный минимум может быть сохранен банком или
    иной кредитной организацией только на одном из счетов должника-гражданина. (Дополнение частью - Федеральный
    закон от 30.12.2021 № 444-ФЗ ) 7. В заявлении, предусмотренном частью 6 настоящей статьи, должник-гражданин
    указывает: 1) фамилию, имя, отчество (при его наличии), гражданство, реквизиты документа, удостоверяющего личность,
    место жительства или место пребывания, номер контактного телефона; 2) реквизиты открытого ему в данном банке
    или иной кредитной организации банковского счета, на котором необходимо сохранять заработную плату и иные доходы
    ежемесячно в размере прожиточного минимума трудоспособного населения в целом по Российской Федерации (прожиточного
    минимума, установленного в субъекте Российской Федерации по месту жительства должника-гражданина для соответствующей
    социально-демографической группы населения, если величина указанного прожиточного минимума превышает величину
    прожиточного минимума трудоспособного населения в целом по Российской Федерации). (Дополнение частью - Федеральный
    закон от 30.12.2021 № 444-ФЗ ) 8. При наличии лиц, находящихся на иждивении должника-гражданина, должник-гражданин
    вправе обратиться в суд с заявлением о сохранении ему заработной платы и иных доходов ежемесячно в размере,
    превышающем прожиточный минимум трудоспособного населения в целом по Российской Федерации (прожиточный минимум,
    установленный в субъекте Российской Федерации по месту жительства должника-гражданина для соответствующей социально-демографической
    группы населения, если величина указанного прожиточного минимума превышает величину прожиточного минимума трудоспособного
    населения в целом по Российской Федерации). (Дополнение частью - Федеральный закон от 30.12.2021 № 444-ФЗ )'
