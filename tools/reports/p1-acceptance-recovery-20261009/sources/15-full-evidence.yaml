  text: Статья 330. Понятие неустойки 1. Неустойкой (штрафом, пеней) признается определенная законом или договором
    денежная сумма, которую должник обязан уплатить кредитору в случае неисполнения или ненадлежащего исполнения
    обязательства, в частности в случае просрочки исполнения. По требованию об уплате неустойки кредитор не обязан
    доказывать причинение ему убытков. 2. Кредитор не вправе требовать уплаты неустойки, если должник не несет ответственности
    за неисполнение или ненадлежащее исполнение обязательства.
