  note: Полная статья сверена с сохранённой официальной цитатой; текст совпал.
  text: Статья 719. Неисполнение заказчиком встречных обязанностей по договору подряда 1. Подрядчик вправе не приступать
    к работе, а начатую работу приостановить в случаях, когда нарушение заказчиком своих обязанностей по договору
    подряда, в частности непредоставление материала, оборудования, технической документации или подлежащей переработке
    (обработке) вещи, препятствует исполнению договора подрядчиком, а также при наличии обстоятельств, очевидно
    свидетельствующих о том, что исполнение указанных обязанностей не будет произведено в установленный срок (статья
    328). 2. Если иное не предусмотрено договором подряда, подрядчик при наличии обстоятельств, указанных в пункте
    1 настоящей статьи, вправе отказаться от исполнения договора и потребовать возмещения убытков.
- norm_id: gk-753
  official_url: https://www.consultant.ru/document/cons_doc_LAW_9027/6b2d751a0d605616a9a1012cb7c7fbac1b6d84b3/
  retrieved_at: '2026-10-08'
  retrieved_by: 'P1 source reading: ConsultantPlus / Supreme Court'
  edition_marker: ГК РФ ч. II, ред. 24.06.2025, с изм. 09.06.2026; прочитано 08.10.2026
  source_class: secondary
  source_text_hash: sha256:c2003cc8858044118a3d988f0bf1f00276df9799cdbe7fc466398d632975c604
  normalization: NFC, пробелы схлопнуты; в хеш входит edition_marker
  note: Полная статья сверена с сохранённой официальной цитатой; текст совпал.
  text: Статья 753. Сдача и приемка работ 1. Заказчик, получивший сообщение подрядчика о готовности к сдаче результата
    выполненных по договору строительного подряда работ либо, если это предусмотрено договором, выполненного этапа
    работ, обязан немедленно приступить к его приемке. 2. Заказчик организует и осуществляет приемку результата
    работ за свой счет, если иное не предусмотрено договором строительного подряда. В предусмотренных законом или
    иными правовыми актами случаях в приемке результата работ должны участвовать представители государственных органов
    и органов местного самоуправления. 3. Заказчик, предварительно принявший результат отдельного этапа работ, несет
    риск последствий гибели или повреждения результата работ, которые произошли не по вине подрядчика. 4. Сдача
    результата работ подрядчиком и приемка его заказчиком оформляются актом, подписанным обеими сторонами. При отказе
    одной из сторон от подписания акта в нем делается отметка об этом и акт подписывается другой стороной. Односторонний
    акт сдачи или приемки результата работ может быть признан судом недействительным лишь в случае, если мотивы
    отказа от подписания акта признаны им обоснованными. 5. В случаях, когда это предусмотрено законом или договором
    строительного подряда либо вытекает из характера работ, выполняемых по договору, приемке результата работ должны
    предшествовать предварительные испытания. В этих случаях приемка может осуществляться только при положительном
    результате предварительных испытаний. 6. Заказчик вправе отказаться от приемки результата работ в случае обнаружения
    недостатков, которые исключают возможность его использования для указанной в договоре строительного подряда
    цели и не могут быть устранены подрядчиком или заказчиком.
