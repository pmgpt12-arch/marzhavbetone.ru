  note: ''
  text: 'Статья 128. Оставление искового заявления без движения 1. Арбитражный суд, установив при рассмотрении вопроса
    о принятии искового заявления к производству, что оно подано с нарушением требований, установленных статьями
    125 и 126 настоящего Кодекса, выносит определение об оставлении заявления без движения. 2. В определении арбитражный
    суд указывает основания для оставления искового заявления без движения и срок, в течение которого истец должен
    устранить обстоятельства, послужившие основанием для оставления искового заявления без движения. Копия определения
    об оставлении искового заявления без движения направляется истцу не позднее следующего дня после дня его вынесения.
    3. В случае, если обстоятельства, послужившие основанием для оставления искового заявления без движения, будут
    устранены в срок, установленный в определении арбитражного суда, заявление считается поданным в день его первоначального
    поступления в суд и принимается к производству арбитражного суда. 4. В случае, если указанные в части 2 настоящей
    статьи обстоятельства не будут устранены в срок, установленный в определении, арбитражный суд возвращает исковое
    заявление и прилагаемые к нему документы в порядке, предусмотренном статьей 129 настоящего Кодекса. Статья 148.
    Основания для оставления искового заявления без рассмотрения 1. Арбитражный суд оставляет исковое заявление
    без рассмотрения, если после его принятия к производству установит, что: (В редакции Федерального закона от
    19.07.2009 № 205-ФЗ ) 1) в производстве арбитражного суда, суда общей юрисдикции, третейского суда имеется дело
    по спору между теми же лицами, о том же предмете и по тем же основаниям; 2) истцом не соблюден претензионный
    или иной досудебный порядок урегулирования спора с ответчиком, за исключением случаев, если его соблюдение не
    предусмотрено федеральным законом; (В редакции Федерального закона от 02.03.2016 № 47-ФЗ ) 3) при рассмотрении
    заявления об установлении фактов, имеющих юридическое значение, выясняется, что возник спор о праве; 4) заявлено
    требование, которое в соответствии с федеральным законом должно быть рассмотрено в деле о банкротстве; 5) имеется
    соглашение сторон о рассмотрении данного спора третейским судом, если любая из сторон не позднее дня представления
    своего первого заявления по существу спора в арбитражном суде первой инстанции заявит по этому основанию возражение
    в отношении рассмотрения дела в арбитражном суде, за исключением случаев, если арбитражный суд установит, что
    это соглашение недействительно, утратило силу или не может быть исполнено; 6) стороны заключили соглашение о
    передаче спора на разрешение третейского суда во время судебного разбирательства до принятия судебного акта,
    которым заканчивается рассмотрение дела по существу, если любая из сторон заявит по этому основанию возражение
    в отношении рассмотрения дела в арбитражном суде, за исключением случаев, если арбитражный суд установит, что
    это соглашение недействительно, утратило силу или не может быть исполнено; 7) исковое заявление не подписано
    или подписано лицом, не имеющим права подписывать его, либо лицом, должностное положение которого не указано;
    8) заявлено исковое требование о взыскании судебных расходов, которое подлежит рассмотрению в соответствии со
    статьей 112 настоящего Кодекса; (Дополнение пунктом - Федеральный закон от 27.07.2010 № 228-ФЗ ) 9) истец повторно
    не явился в судебное заседание, в том числе по вызову суда, и не заявил ходатайство о рассмотрении дела в его
    отсутствие или об отложении судебного разбирательства, а ответчик не требует рассмотрения дела по существу.
    (Дополнение пунктом - Федеральный закон от 27.07.2010 № 228-ФЗ ) 2. Арбитражный суд оставляет исковое заявление
    без рассмотрения по иным основаниям, предусмотренным настоящим Кодексом. (Дополнение частью - Федеральный закон
    от 19.07.2009 № 205-ФЗ )'
