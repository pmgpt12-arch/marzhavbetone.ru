  attributive_references:
  - ref: ГОСКОМСТАТ:100
    reason: Документ говорит «Формы введены постановлением Госкомстата России от 11.11.1999 № 100» и тут же — «с
      переходом на необязательность унифицированных форм договор может предусматривать собственные формы». Это указание
      происхождения формы и прямой отказ от утверждения об обязательности. Право требовать оплату, досудебный порядок
      и проценты — выводы претензии — на этот акт не опираются ни одним звеном.
  mechanisms:
  - обязательный досудебный порядок и точка отсчёта срока ожидания
  - соотношение процентов по ст. 395 и договорной неустойки
