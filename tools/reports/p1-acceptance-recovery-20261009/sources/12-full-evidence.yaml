  edition_marker: ГК РФ ч. II, ред. 24.06.2025, с изм. 09.06.2026; прочитано 08.10.2026
  source_class: secondary
  source_text_hash: sha256:beb146d66d840f56a3e8c71be39c74e5eafd338efc6df033d3d0b7eed06bb932
  normalization: NFC, пробелы схлопнуты; в хеш входит edition_marker
  note: Полная статья сверена с сохранённой официальной цитатой; текст совпал.
  text: Статья 711. Порядок оплаты работы 1. Если договором подряда не предусмотрена предварительная оплата выполненной
    работы или отдельных ее этапов, заказчик обязан уплатить подрядчику обусловленную цену после окончательной сдачи
    результатов работы при условии, что работа выполнена надлежащим образом и в согласованный срок, либо с согласия
    заказчика досрочно. 2. Подрядчик вправе требовать выплаты ему аванса либо задатка только в случаях и в размере,
    указанных в законе или договоре подряда.
- norm_id: gk-746
  official_url: https://www.consultant.ru/document/cons_doc_LAW_9027/213b00ab7366c34225e24be2f360912884de054e/
  retrieved_at: '2026-10-08'
  retrieved_by: 'P1 source reading: ConsultantPlus / Supreme Court'
  edition_marker: ГК РФ ч. II, ред. 24.06.2025, с изм. 09.06.2026; прочитано 08.10.2026
  source_class: secondary
  source_text_hash: sha256:30bccfcf469410e8aec868275b6186af9d37d247f8460eaf31eda4f5fd3136f1
  normalization: NFC, пробелы схлопнуты; в хеш входит edition_marker
  note: Полная статья сверена с сохранённой официальной цитатой; текст совпал.
  text: Статья 746. Оплата работ 1. Оплата выполненных подрядчиком работ производится заказчиком в размере, предусмотренном
    сметой, в сроки и в порядке, которые установлены законом или договором строительного подряда. При отсутствии
    соответствующих указаний в законе или договоре оплата работ производится в соответствии со статьей 711 настоящего
    Кодекса. 2. Договором строительного подряда может быть предусмотрена оплата работ единовременно и в полном объеме
    после приемки объекта заказчиком.
- norm_id: gk-753
  official_url: https://www.consultant.ru/document/cons_doc_LAW_9027/6b2d751a0d605616a9a1012cb7c7fbac1b6d84b3/
  retrieved_at: '2026-10-08'
  retrieved_by: 'P1 source reading: ConsultantPlus / Supreme Court'
  edition_marker: ГК РФ ч. II, ред. 24.06.2025, с изм. 09.06.2026; прочитано 08.10.2026
  source_class: secondary
  source_text_hash: sha256:c2003cc8858044118a3d988f0bf1f00276df9799cdbe7fc466398d632975c604
  normalization: NFC, пробелы схлопнуты; в хеш входит edition_marker
  note: Полная статья сверена с сохранённой официальной цитатой; текст совпал.
  text: Статья 753. Сдача и приемка работ 1. Заказчик, получивший сообщение подрядчика о готовности к сдаче результата
    выполненных по договору строительного подряда работ либо, если это предусмотрено договором, выполненного этапа
    работ, обязан немедленно приступить к его приемке. 2. Заказчик организует и осуществляет приемку результата
    работ за свой счет, если иное не предусмотрено договором строительного подряда. В предусмотренных законом или
    иными правовыми актами случаях в приемке результата работ должны участвовать представители государственных органов
    и органов местного самоуправления. 3. Заказчик, предварительно принявший результат отдельного этапа работ, несет
    риск последствий гибели или повреждения результата работ, которые произошли не по вине подрядчика. 4. Сдача
    результата работ подрядчиком и приемка его заказчиком оформляются актом, подписанным обеими сторонами. При отказе
    одной из сторон от подписания акта в нем делается отметка об этом и акт подписывается другой стороной. Односторонний
    акт сдачи или приемки результата работ может быть признан судом недействительным лишь в случае, если мотивы
    отказа от подписания акта признаны им обоснованными. 5. В случаях, когда это предусмотрено законом или договором
    строительного подряда либо вытекает из характера работ, выполняемых по договору, приемке результата работ должны
    предшествовать предварительные испытания. В этих случаях приемка может осуществляться только при положительном
    результате предварительных испытаний. 6. Заказчик вправе отказаться от приемки результата работ в случае обнаружения
    недостатков, которые исключают возможность его использования для указанной в договоре строительного подряда
    цели и не могут быть устранены подрядчиком или заказчиком.
- norm_id: gk-395
  official_url: http://pravo.gov.ru/proxy/ips/?docbody=&nd=102033239
  retrieved_at: '2026-08-16'
  retrieved_by: tools/fetch_legal_evidence.py
  edition_marker: ред. ФЗ от 03.07.2016 № 315-ФЗ
  source_class: official
  source_text_hash: sha256:07ae25b8650a6efb592a911c1ae0c8ff2ff876dfb8da065293113f120ac338bd
  normalization: NFC, пробелы схлопнуты; в хеш входит edition_marker
  note: ''
  text: Статья 395. Ответственность за неисполнение денежного обязательства 1. В случаях неправомерного удержания
    денежных средств, уклонения от их возврата, иной просрочки в их уплате подлежат уплате проценты на сумму долга.
    Размер процентов определяется ключевой ставкой Банка России, действовавшей в соответствующие периоды. Эти правила
    применяются, если иной размер процентов не установлен законом или договором. (В редакции Федерального закона
    от 03.07.2016 № 315-ФЗ ) 2. Если убытки, причиненные кредитору неправомерным пользованием его денежными средствами,
    превышают сумму процентов, причитающуюся ему на основании пункта 1 настоящей статьи, он вправе требовать от
    должника возмещения убытков в части, превышающей эту сумму. 3. Проценты за пользование чужими средствами взимаются
    по день уплаты суммы этих средств кредитору, если законом, иными правовыми актами или договором не установлен
    для начисления процентов более короткий срок. 4. В случае, когда соглашением сторон предусмотрена неустойка
    за неисполнение или ненадлежащее исполнение денежного обязательства, предусмотренные настоящей статьей проценты
    не подлежат взысканию, если иное не предусмотрено законом или договором. (Дополнение пунктом - Федеральный закон
    от 08.03.2015 № 42-ФЗ ) 5. Начисление процентов на проценты (сложные проценты) не допускается, если иное не
    установлено законом. По обязательствам, исполняемым при осуществлении сторонами предпринимательской деятельности,
    применение сложных процентов не допускается, если иное не предусмотрено законом или договором. (Дополнение пунктом
    - Федеральный закон от 08.03.2015 № 42-ФЗ ) 6. Если подлежащая уплате сумма процентов явно несоразмерна последствиям
    нарушения обязательства, суд по заявлению должника вправе уменьшить предусмотренные договором проценты, но не
    менее чем до суммы, определенной исходя из ставки, указанной в пункте 1 настоящей статьи. (Дополнение пунктом
    - Федеральный закон от 08.03.2015 № 42-ФЗ )
- norm_id: gk-314
  official_url: http://pravo.gov.ru/proxy/ips/?docbody=&nd=102033239
  retrieved_at: '2026-08-16'
