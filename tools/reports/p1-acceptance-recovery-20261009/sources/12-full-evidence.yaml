  source_text_hash: sha256:8fc58b629bdef50acd16b2bdecef12a48f66248e763b0f8226b060746a92d64f
  normalization: NFC, пробелы схлопнуты; в хеш входит edition_marker
  note: ''
  text: Статья 314. Срок исполнения обязательства 1. Если обязательство предусматривает или позволяет определить
    день его исполнения либо период, в течение которого оно должно быть исполнено (в том числе в случае, если этот
    период исчисляется с момента исполнения обязанностей другой стороной или наступления иных обстоятельств, предусмотренных
    законом или договором), обязательство подлежит исполнению в этот день или соответственно в любой момент в пределах
    такого периода. 2. В случаях, когда обязательство не предусматривает срок его исполнения и не содержит условия,
    позволяющие определить этот срок, а равно и в случаях, когда срок исполнения обязательства определен моментом
    востребования, обязательство должно быть исполнено в течение семи дней со дня предъявления кредитором требования
    о его исполнении, если обязанность исполнения в другой срок не предусмотрена законом, иными правовыми актами,
    условиями обязательства или не вытекает из обычаев либо существа обязательства. При непредъявлении кредитором
    в разумный срок требования об исполнении такого обязательства должник вправе потребовать от кредитора принять
    исполнение, если иное не предусмотрено законом, иными правовыми актами, условиями обязательства или не явствует
    из обычаев либо существа обязательства. (Статья в редакции Федерального закона от 08.03.2015 № 42-ФЗ )
