  note: ''
  text: Статья 309. Общие положения Обязательства должны исполняться надлежащим образом в соответствии с условиями
    обязательства и требованиями закона, иных правовых актов, а при отсутствии таких условий и требований - в соответствии
    с обычаями или иными обычно предъявляемыми требованиями. (В редакции Федерального закона от 08.03.2015 № 42-ФЗ
    ) Условиями сделки может быть предусмотрено исполнение ее сторонами возникающих из нее обязательств при наступлении
    определенных обстоятельств без направленного на исполнение обязательства отдельно выраженного дополнительного
    волеизъявления его сторон путем применения информационных технологий, определенных условиями сделки. (Дополнение
    частью - Федеральный закон от 18.03.2019 № 34-ФЗ )
