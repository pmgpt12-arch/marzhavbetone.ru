  note: ''
  text: 'Статья 202. Приостановление течения срока исковой давности 1. Течение срока исковой давности приостанавливается:
    1) если предъявлению иска препятствовало чрезвычайное и непредотвратимое при данных условиях обстоятельство
    (непреодолимая сила); 2) если истец или ответчик находится в составе Вооруженных Сил Российской Федерации, переведенных
    на военное положение; 3) в силу установленной на основании закона Правительством Российской Федерации отсрочки
    исполнения обязательств (мораторий); 4) в силу приостановления действия закона или иного правового акта, регулирующих
    соответствующее отношение. 2. Течение срока исковой давности приостанавливается при условии, что указанные в
    пункте 1 настоящей статьи обстоятельства возникли или продолжали существовать в последние шесть месяцев срока
    исковой давности, а если этот срок равен шести месяцам или менее шести месяцев, в течение срока исковой давности.
    3. Если стороны прибегли к предусмотренной законом процедуре разрешения спора во внесудебном порядке (процедура
    медиации, посредничество, административная процедура и т.п.), течение срока исковой давности приостанавливается
    на срок, установленный законом для проведения такой процедуры, а при отсутствии такого срока - на шесть месяцев
    со дня начала соответствующей процедуры. 4. Со дня прекращения обстоятельства, послужившего основанием приостановления
    течения срока исковой давности, течение ее срока продолжается. Остающаяся часть срока исковой давности, если
    она составляет менее шести месяцев, удлиняется до шести месяцев, а если срок исковой давности равен шести месяцам
    или менее шести месяцев, до срока исковой давности. (Статья в редакции Федерального закона от 07.05.2013 № 100-ФЗ
    )'
