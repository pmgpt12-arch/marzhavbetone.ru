  text: 'Статья 129. Возвращение искового заявления 1. Арбитражный суд возвращает исковое заявление, если при рассмотрении
    вопроса о принятии заявления установит, что: 1) дело неподсудно данному арбитражному суду или подсудно суду
    общей юрисдикции ; (В редакции Федерального закона от 28.11.2018 № 451-ФЗ ) 2) (Пункт утратил силу - Федеральный
    закон от 19.07.2009 № 205-ФЗ ) 2.1) заявленные требования подлежат рассмотрению в порядке приказного производства;
    (Дополнение пунктом - Федеральный закон от 23.06.2016 № 220-ФЗ ) 3) до вынесения определения о принятии искового
    заявления к производству арбитражного суда от истца поступило ходатайство о возвращении заявления; 4) не устранены
    обстоятельства, послужившие основаниями для оставления искового заявления без движения, в срок, установленный
    в определении суда; 5) истцом не соблюден претензионный или иной досудебный порядок урегулирования спора с ответчиком,
    если такой порядок является обязательным в силу закона; (Дополнение пунктом - Федеральный закон от 02.03.2016
    № 47-ФЗ ) 6) исковое заявление не подписано или исковое заявление подписано лицом, не имеющим полномочий на
    его подписание. (Дополнение пунктом - Федеральный закон от 28.11.2018 № 451-ФЗ ) (В редакции Федерального закона
    от 02.12.2019 № 406-ФЗ ) Арбитражный суд также возвращает исковое заявление, если отклонено ходатайство о предоставлении
    отсрочки, рассрочки уплаты государственной пошлины, об уменьшении ее размера. 2. О возвращении искового заявления
    арбитражный суд выносит определение. В определении указываются основания для возвращения заявления, решается
    вопрос о возврате государственной пошлины из федерального бюджета. 3. Копия определения о возвращении искового
    заявления направляется истцу не позднее следующего дня после дня вынесения определения или после истечения срока,
    установленного судом для устранения обстоятельств, послуживших основанием для оставления заявления без движения,
    вместе с заявлением и прилагаемыми к нему документами. 4. Определение арбитражного суда о возвращении искового
    заявления может быть обжаловано. 5. В случае отмены определения исковое заявление считается поданным в день
    первоначального обращения в арбитражный суд. 6. Возвращение искового заявления не препятствует повторному обращению
    с таким же требованием в арбитражный суд в общем порядке после устранения обстоятельств, послуживших основанием
    для его возвращения. '
