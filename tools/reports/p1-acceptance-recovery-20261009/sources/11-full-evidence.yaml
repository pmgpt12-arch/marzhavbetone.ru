  note: ''
  text: Статья 35. Предъявление иска по адресу или месту жительства ответчика Иск предъявляется в арбитражный суд
    субъекта Российской Федерации по адресу или месту жительства ответчика. (Статья в редакции Федерального закона
    от 28.11.2018 № 451-ФЗ )
- norm_id: apk-37
  official_url: http://pravo.gov.ru/proxy/ips/?docbody=&nd=102079219
  retrieved_at: '2026-08-16'
