  source_class: secondary
  source_text_hash: sha256:30bccfcf469410e8aec868275b6186af9d37d247f8460eaf31eda4f5fd3136f1
  normalization: NFC, пробелы схлопнуты; в хеш входит edition_marker
  note: Полная статья сверена с сохранённой официальной цитатой; текст совпал.
  text: Статья 746. Оплата работ 1. Оплата выполненных подрядчиком работ производится заказчиком в размере, предусмотренном
    сметой, в сроки и в порядке, которые установлены законом или договором строительного подряда. При отсутствии
    соответствующих указаний в законе или договоре оплата работ производится в соответствии со статьей 711 настоящего
    Кодекса. 2. Договором строительного подряда может быть предусмотрена оплата работ единовременно и в полном объеме
    после приемки объекта заказчиком.
- norm_id: gk-711
  official_url: https://www.consultant.ru/document/cons_doc_LAW_9027/46561f5271883fcf47f3e9859d3a59eb56bfcd96/
  retrieved_at: '2026-10-08'
  retrieved_by: 'P1 source reading: ConsultantPlus / Supreme Court'
  edition_marker: ГК РФ ч. II, ред. 24.06.2025, с изм. 09.06.2026; прочитано 08.10.2026
  source_class: secondary
  source_text_hash: sha256:beb146d66d840f56a3e8c71be39c74e5eafd338efc6df033d3d0b7eed06bb932
  normalization: NFC, пробелы схлопнуты; в хеш входит edition_marker
  note: Полная статья сверена с сохранённой официальной цитатой; текст совпал.
  text: Статья 711. Порядок оплаты работы 1. Если договором подряда не предусмотрена предварительная оплата выполненной
    работы или отдельных ее этапов, заказчик обязан уплатить подрядчику обусловленную цену после окончательной сдачи
    результатов работы при условии, что работа выполнена надлежащим образом и в согласованный срок, либо с согласия
    заказчика досрочно. 2. Подрядчик вправе требовать выплаты ему аванса либо задатка только в случаях и в размере,
    указанных в законе или договоре подряда.
