  source_text_hash: sha256:8c4714b2a6784a22607a162b1b5d63dcbc4063219d64100b963a096e80a9edb3
  normalization: NFC, пробелы схлопнуты; в хеш входит edition_marker
  note: ''
  text: Статья 330. Понятие неустойки 1. Неустойкой (штрафом, пеней) признается определенная законом или договором
    денежная сумма, которую должник обязан уплатить кредитору в случае неисполнения или ненадлежащего исполнения
    обязательства, в частности в случае просрочки исполнения. По требованию об уплате неустойки кредитор не обязан
    доказывать причинение ему убытков. 2. Кредитор не вправе требовать уплаты неустойки, если должник не несет ответственности
    за неисполнение или ненадлежащее исполнение обязательства.
- norm_id: apk-103
  official_url: http://pravo.gov.ru/proxy/ips/?docbody=&nd=102079219
  retrieved_at: '2026-08-16'
  retrieved_by: tools/fetch_legal_evidence.py
  edition_marker: ''
  source_class: official
  source_text_hash: sha256:b427064c0a4b88b083abf95d33057d742d97b4a0437fd9cce9be715333b8dcc3
  normalization: NFC, пробелы схлопнуты; в хеш входит edition_marker
  note: ''
  text: 'Статья 103. Цена иска 1. Цена иска определяется: 1) по искам о взыскании денежных средств, исходя из взыскиваемой
    суммы; 2) по искам о признании не подлежащим исполнению исполнительного или иного документа, по которому взыскание
    производится в бесспорном (безакцептном) порядке, исходя из оспариваемой денежной суммы; 3) по искам об истребовании
    имущества, исходя из стоимости истребуемого имущества; 4) по искам об истребовании земельного участка, исходя
    из стоимости земельного участка. В цену иска включаются также указанные в исковом заявлении суммы неустойки
    (штраф, пени) и проценты. Цена иска, состоящего из нескольких самостоятельных требований, определяется суммой
    всех требований. 2. По исковым заявлениям о признании права, в том числе права собственности, права пользования,
    права владения, права распоряжения, государственная пошлина уплачивается в размерах, установленных для исковых
    заявлений неимущественного характера. 3. Цена иска указывается заявителем. В случае неправильного указания заявителем
    цены иска она определяется арбитражным судом.'
