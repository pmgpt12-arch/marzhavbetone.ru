  note: ''
  text: Статья 37. Договорная подсудность Подсудность, установленная статьями 35 и 36 настоящего Кодекса, может
    быть изменена по соглашению сторон до принятия арбитражным судом заявления к своему производству.
- norm_id: gk-330
  official_url: http://pravo.gov.ru/proxy/ips/?docbody=&nd=102033239
  retrieved_at: '2026-08-16'
  retrieved_by: tools/fetch_legal_evidence.py
  edition_marker: ''
