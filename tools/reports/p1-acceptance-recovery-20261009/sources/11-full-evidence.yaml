  normalization: NFC, пробелы схлопнуты; в хеш входит edition_marker
  note: ''
  text: 'Статья 125. Форма и содержание искового заявления 1. Исковое заявление подается в арбитражный суд на бумажном
    носителе или в электронном виде, в том числе в форме электронного документа. Исковое заявление подписывается
    истцом или его представителем. Исковое заявление, подаваемое в электронном виде, содержащее ходатайство об обеспечении
    иска, должно быть подписано усиленной квалифицированной электронной подписью. (Часть в редакции Федерального
    закона от 30.12.2021 № 440-ФЗ ) 2. В исковом заявлении должны быть указаны: 1) наименование арбитражного суда,
    в который подается исковое заявление; 2) сведения об истце: для гражданина - фамилия, имя, отчество (при наличии),
    дата и место рождения, место жительства или место пребывания, место работы или дата и место государственной
    регистрации в качестве индивидуального предпринимателя и один из идентификаторов (страховой номер индивидуального
    лицевого счета, идентификационный номер налогоплательщика, серия и номер документа, удостоверяющего личность,
    серия и номер водительского удостоверения), номера телефонов, факсов, адреса электронной почты; для организации
    - наименование, адрес, идентификационный номер налогоплательщика, номера телефонов, факсов, адреса электронной
    почты; (В редакции Федерального закона от 21.12.2021 № 417-ФЗ ) 3) сведения об ответчике: для гражданина - фамилия,
    имя, отчество (при наличии), дата и место рождения, место жительства или место пребывания, место работы (если
    известно) и один из идентификаторов (страховой номер индивидуального лицевого счета, идентификационный номер
    налогоплательщика, серия и номер документа, удостоверяющего личность, основной государственный регистрационный
    номер индивидуального предпринимателя, серия и номер водительского удостоверения); для организации - наименование,
    адрес, идентификационный номер налогоплательщика и основной государственный регистрационный номер. В случае,
    если гражданину неизвестны дата и место рождения ответчика, один из его идентификаторов, об этом указывается
    в исковом заявлении и такая информация по запросу арбитражного суда предоставляется органами Фонда пенсионного
    и социального страхования Российской Федерации, и (или) налоговыми органами, и (или) органами внутренних дел.
    В этом случае срок принятия искового заявления к производству арбитражного суда, предусмотренный частью 1 статьи
    127 настоящего Кодекса, исчисляется со дня получения арбитражным судом такой информации; (В редакции федеральных
    законов от 21.12.2021 № 417-ФЗ , от 28.12.2022 № 569-ФЗ ) 4) требования истца к ответчику со ссылкой на законы
    и иные нормативные правовые акты, а при предъявлении иска к нескольким ответчикам - требования к каждому из
    них; 5) обстоятельства, на которых основаны исковые требования, и подтверждающие эти обстоятельства доказательства;
    6) цена иска, если иск подлежит оценке; 7) расчет взыскиваемой или оспариваемой денежной суммы; 8) сведения
    о соблюдении истцом претензионного или иного досудебного порядка; (В редакции Федерального закона от 02.03.2016
    № 47-ФЗ ) 8.1) сведения о предпринятых стороной (сторонами) действиях, направленных на примирение, если такие
    действия предпринимались; (Дополнение пунктом - Федеральный закон от 26.07.2019 № 197-ФЗ ) 9) сведения о мерах,
    принятых арбитражным судом по обеспечению имущественных интересов до предъявления иска; 10) перечень прилагаемых
    документов. В заявлении должны быть указаны и иные сведения, если они необходимы для правильного и своевременного
    рассмотрения дела, могут содержаться ходатайства, в том числе ходатайства об истребовании доказательств от ответчика
    или других лиц. (В редакции Федерального закона от 27.07.2010 № 228-ФЗ ) 3. Истец обязан направить другим лицам,
    участвующим в деле, копии искового заявления и прилагаемых к нему документов, которые у них отсутствуют, заказным
    письмом с уведомлением о вручении или в электронном виде посредством единого портала государственных и муниципальных
    услуг либо системы электронного документооборота участника арбитражного процесса с использованием единой системы
    межведомственного электронного взаимодействия . (В редакции Федерального закона от 30.12.2021 № 440-ФЗ ) Статья
    126. Документы, прилагаемые к исковому заявлению 1. К исковому заявлению прилагаются: (В редакции Федерального
    закона от 27.07.2010 № 228-ФЗ ) 1) уведомление о вручении или иные документы, подтверждающие направление другим
    лицам, участвующим в деле, копий искового заявления и приложенных к нему документов, которые у других лиц, участвующих
    в деле, отсутствуют , в том числе в случае подачи в суд искового заявления и приложенных к нему документов в
    электронном виде ; (В редакции Федерального закона от 30.12.2021 № 440-ФЗ ) 2) документ, подтверждающий уплату
    государственной пошлины в установленных порядке и в размере или право на получение льготы по уплате государственной
    пошлины, либо ходатайство о предоставлении отсрочки, рассрочки, об уменьшении размера государственной пошлины;
    3) документы, подтверждающие обстоятельства, на которых истец основывает свои требования; 4) (Пункт утратил
    силу - Федеральный закон от 25.12.2023 № 667-ФЗ ) 5) доверенность или иные документы, подтверждающие полномочия
    на подписание искового заявления , а также копии документов о высшем юридическом образовании или об ученой степени
    по юридической специальности представителя, подписавшего исковое заявление, либо документов, удостоверяющих
    его статус адвоката, патентного поверенного, арбитражного управляющего, единоличного органа управления организации
    ; (В редакции Федерального закона от 25.12.2023 № 667-ФЗ ) 6) копии определения арбитражного суда об обеспечении
    имущественных интересов до предъявления иска; 7) документы, подтверждающие соблюдение истцом претензионного
    или иного досудебного порядка, за исключением случаев, если его соблюдение не предусмотрено федеральным законом;
    (В редакции Федерального закона от 02.03.2016 № 47-ФЗ ) 7.1) документы, подтверждающие совершение стороной (сторонами)
    действий, направленных на примирение, если такие действия предпринимались и соответствующие документы имеются;
    (Дополнение пунктом - Федеральный закон от 26.07.2019 № 197-ФЗ ) 8) проект договора, если заявлено требование
    о понуждении заключить договор; 9) выписка из единого государственного реестра юридических лиц или единого государственного
    реестра индивидуальных предпринимателей с указанием сведений о месте нахождения или месте жительства истца и
    ответчика и (или) приобретении физическим лицом статуса индивидуального предпринимателя либо прекращении физическим
    лицом деятельности в качестве индивидуального предпринимателя или иной документ, подтверждающий указанные сведения
    или отсутствие таковых. Такие документы должны быть получены не ранее чем за тридцать дней до дня обращения
    истца в арбитражный суд. (Дополнение пунктом - Федеральный закон от 27.07.2010 № 228-ФЗ ) 2. Документы, прилагаемые
    к исковому заявлению, могут быть представлены в арбитражный суд в электронном виде. (Дополнение частью - Федеральный
    закон от 27.07.2010 № 228-ФЗ )'
