  "acceptance_note": "Перечит дельты документа 11 между принятой версией a601955c (смысловой хэш e6be1059…, совпадает с записью normative-results.yaml) и текущей версией 3e328b2c… из 46c428f8. Текущий смысловой хэш посчитан в этом заходе: python3 tools/semantic_hash.py products-storage/01-zakrytie-rabot/11-slovar-poley.docx → sha256:3e328b2ceebffb42b0332cf4dbb5feb5cbb674941fd2a5104c63195a71ea466c, совпадает с new_hash в контексте координатора. Хэш принятой версии в этом заходе не пересчитывался: песочница не дала выгрузить blob a601955c во временный файл. Он принят по привязке координатора и совпадению с реестром. Текст текущей версии и дельта взяты из context/11-slovar-poley.txt: прямое извлечение текста DOCX песочница не разрешила, а соответствие контекста файлу подтверждено совпадением смыслового хэша. Изменены семь позиций: три без правовой нагрузки (C-1, C-2 и удалённая часть C-7), четыре правовые (C-3 — п. 9 ч. 1 ст. 126 АПК РФ; C-4 — п. 1 ст. 395 ГК РФ; C-5 и C-6 — ч. 5 ст. 4 АПК РФ; C-7 — отсылка к источникам ставки, сроков и пошлины). Все правовые позиции сопоставлены с полными сохранёнными текстами норм из sources/11-full-evidence.yaml; расхождений с нормой и новых правовых утверждений нет. Все 12 source_hash совпадают в трёх местах: в normative-results.yaml, в пакете и в data/legal/evidence/*.yaml. python3 tools/normative_scope.py пересчитал хэши через legal_evidence.verify: «Норм с годным доказательством: 33», просроченных нет, ближайший срок 2026-10-15 (apk-103). Новые источники не понадобились, WebFetch и WebSearch не применялись. Классы источников взяты из сохранённых доказательств: official — pravo.gov.ru, secondary — consultant.ru; по решению владельца от 08.10.2026 оба допускают PASS. PASS относится только к хэшу 3e328b2c… и не переносится на другие версии. Запрет покупательских формулировок действует для продукта; этот отчёт внутренний и технический, поэтому цитаты прежнего текста C-1 и C-7 приведены дословно. Покупательские файлы, normative-results.yaml, генераторы, цены, оплата, выдача и CI не менялись. Вычиткой юристом отчёт не является. Числовых значений ставки в отчёте нет (Р-009)."
