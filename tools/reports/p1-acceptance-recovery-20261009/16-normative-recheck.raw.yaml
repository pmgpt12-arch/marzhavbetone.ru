changed_positions:
  - id: C-1
    location: подзаголовок документа
    old: «Шаблон иска в арбитражный суд: долг за принятые работы и проценты по ст. 395 ГК РФ.»
    new: «Форма иска в арбитражный суд о долге за принятые работы и процентах по ст. 395 ГК РФ.»
    verdict: подтверждена
    reason: >-
      Меняется только название вида документа. Ссылка на ст. 395 ГК РФ та же; предмет
      (проценты за просрочку уплаты денежных средств) соответствует п. 1 ст. 395 в
      сохранённом тексте. Новой правовой конструкции нет.
    norm_ids: [gk-395]
  - id: C-2
    location: блок «Результат применения» (раньше «Зачем этот документ»)
    old: «Шаблон рассчитан на самый чистый случай: обе стороны — юридические лица или индивидуальные предприниматели, акты подписаны без замечаний, претензионный порядок соблюдён, встречных требований нет. …»
    new: «Форма помогает подготовить иск, когда обе стороны — юридические лица или индивидуальные предприниматели, акты подписаны без замечаний, претензионный порядок соблюдён, встречных требований нет. …»
    verdict: подтверждена
    reason: >-
      Перечень условий применения сохранён дословно: субъектный состав, приёмка без
      замечаний, соблюдённый досудебный порядок, отсутствие встречных требований.
      Изменилась только вводная часть, нормативного утверждения она не несёт. Условия
      совпадают с принятой сверкой по ст. 27, 28 АПК РФ, ч. 5 ст. 4 АПК РФ и ст. 753 ГК РФ.
    norm_ids: [apk-27, apk-28, apk-4-5, gk-753]
  - id: C-3
    location: заголовок и вводная фраза перечня осложнённых обстоятельств
    old: «Когда шаблон откладывается и звонят юристу. Это главный риск файла: типовой текст в осложнённом споре создаёт ложную уверенность. Откладывайте шаблон, если:»
    new: «Дополнительные доказательства и процессуальный маршрут. При следующих обстоятельствах соберите подтверждения и определите требования и процессуальный маршрут с учётом материалов дела:»
    verdict: подтверждена
    reason: >-
      Перечень обстоятельств (оспаривание объёмов или качества, неуполномоченный
      подписант, встречные требования или зачёт, банкротное дело, односторонние акты
      по ст. 753 ГК РФ) не изменился. Юридически значимое условие сохранено: в этих
      случаях типовой маршрут не применяется без дополнительных доказательств и выбора
      маршрута. Изменилось только действие, которое предлагается пользователю.
      Ссылка на ст. 753 ГК РФ при односторонних актах соответствует п. 4 ст. 753 в
      сохранённом тексте: акт, подписанный одной стороной, оспорим, если суд признает
      обоснованными мотивы отказа от подписания. Новых норм и новых правовых выводов нет.
    norm_ids: [gk-753]
  - id: C-4
    location: блок «Проверка перед подачей» (раньше «Чего этот документ не делает»)
    old: >-
      «Не гарантирует взыскание… Не заменяет проверку требований АПК на дату подачи.
      Состав документов и реквизитов установлен ст. 125 и 126 АПК РФ — сверьте с
      действующей редакцией перед подачей. Нарушение этих требований может повлечь
      оставление заявления без движения (ч. 1 ст. 128 АПК РФ) либо возврат в
      предусмотренных ст. 129 АПК РФ случаях. При несоблюдении обязательного
      досудебного порядка до принятия заявления суд возвращает его (п. 5 ч. 1 ст. 129
      АПК РФ), а если нарушение установлено после принятия — оставляет без рассмотрения
      (п. 2 ч. 1 ст. 148 АПК РФ).»
    new: >-
      «Соберите доказательства выполнения и приёмки работ, расчёт долга и подтверждение
      направления претензии. Сверьте реквизиты заявления и приложения со ст. 125 и 126
      АПК РФ на дату подачи; проверьте истечение применимого срока досудебного
      урегулирования. Эта подготовка помогает подать полный комплект и пройти проверку
      суда по ст. 128, 129 и 148 АПК РФ.»
    verdict: подтверждена
    reason: >-
      Ст. 125 (форма и содержание искового заявления) и ст. 126 (прилагаемые документы)
      существуют, их предмет совпадает с сохранённым текстом. Ст. 128, 129 и 148 существуют
      и описывают то, чем суд проверяет заявление: оставление без движения при
      нарушении ст. 125, 126 (ч. 1 ст. 128), возвращение, в том числе при несоблюдении
      обязательного досудебного порядка (п. 4, 5 ч. 1 ст. 129), и оставление без
      рассмотрения после принятия, в том числе при несоблюдении досудебного порядка
      (п. 2 ч. 1 ст. 148). Новая формулировка слабее прежней и ничего сверх нормы не
      утверждает: слово «помогает» не обещает результата. Требование проверить истечение
      срока досудебного урегулирования совпадает с ч. 5 ст. 4 АПК РФ: тридцать
      календарных дней со дня направления претензии, если закон или договор не
      устанавливает иной срок или порядок. Удалённые точные адреса пунктов были верны;
      их удаление ошибки не вносит. Правило «не подавать до истечения срока» осталось
      в разделах 3 «Соблюдение досудебного порядка», «Подача» и «Что проверить перед
      отправкой». Число дней в форме не появилось (Р-009).
    norm_ids: [apk-125-126, apk-128-148, apk-129, apk-4-5]
  - id: C-5
    location: раздел «Госпошлина»
    old: «Размер — по ст. 333.21 Налогового кодекса РФ от цены иска. Числа в шаблоне нет намеренно: ставки пошлины менялись…»
    new: «Размер — по ст. 333.21 Налогового кодекса РФ от цены иска. Число в форме заполняется намеренно: ставки пошлины менялись…»
    verdict: подтверждена
    reason: >-
      Ссылка на ст. 333.21 НК РФ и расчёт от цены иска не изменились. Это соответствует
      сохранённому тексту пп. 1 п. 1 ст. 333.21: шкала зависит от цены иска. Размер
      пошлины по-прежнему вводит пользователь в поле {{РАЗМЕР_ГОСПОШЛИНЫ}}; ставка в
      форме числом не указана. Порядок расчёта не изменился.
    norm_ids: [nk-333-21]
  - id: C-6
    location: удалённый заключительный блок «Важно, прочитайте до использования»
    old: >-
      «Это типовой шаблон, а не юридическая консультация и не гарантия взыскания… Если
      заказчик оспаривает объёмы или качество, заявляет зачёт, если акты подписаны
      неуполномоченным лицом или в картотеке арбитражных дел появилось дело о
      банкротстве должника — типовой текст создаёт ложную уверенность. В этих случаях
      обращайтесь к юристу до отправки. Ставок, сроков и размеров пошлин числом в
      шаблоне нет намеренно…»
    new: блок удалён
    verdict: подтверждена
    reason: >-
      В блоке не было ссылок на нормы, и он не задавал порядок расчёта или реквизиты.
      Условия применения из него остаются в C-3 и в разделе «Когда применяется»;
      правило не указывать ставки и пошлины числом — в C-5 и в полях формы. После
      удаления юридически значимое условие не теряется, новое утверждение не появляется.
    norm_ids: []

