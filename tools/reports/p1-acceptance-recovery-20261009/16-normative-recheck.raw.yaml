acceptance_note: >-
  Смысловой хэш текущего документа посчитан tools/semantic_hash.py:
  sha256:6f3c7539…46e29. Он совпал с new_hash подготовленного контекста, raw sha256 —
  с new_raw_sha256. previous_document_hash взят из принятой записи
  normative-results.yaml и контекста координатора (before_matches_accepted_result:
  true). В этом заходе его не пересчитывали: запуск semantic_hash.py на извлечённом
  blob a601955 (6f738b0c) запросил разрешение песочницы. Все 18 норм из
  document-norms.yaml покрыты. Их source_hash совпадают с source_text_hash
  сохранённых evidence и с принятым результатом. tools/normative_scope.py --today
  2026-10-09 пересчитал хэши: 33 из 33 доказательств годны, просроченных норм нет,
  ближайший срок 2026-10-15 (apk-103). tools/check_legal_coverage.py: непокрытых
  правовых ссылок нет. Новые источники не запрашивались: все изменённые позиции
  сопоставлены с полными текстами, уже сохранёнными в data/legal/evidence. Прежний
  PASS не переносится автоматически: вердикт PASS выставлен этим перечитом для хэша
  sha256:6f3c7539…46e29. Реестр normative-results.yaml не менялся; привязку результата
  к новому хэшу делает координатор. Отчёт внутренний: запрет покупательских
  формулировок относится к продукту, слова «шаблон» и «юрист» здесь только цитируют
  удалённый текст. Вне нормативной части: фраза C-5 «Число в форме заполняется
  намеренно» стилистически неточна, нормативного дефекта в ней нет; оценка языка не
  входит в этот перечит. Сверка не является вычиткой юристом.

