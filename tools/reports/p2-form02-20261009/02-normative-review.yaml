      "edition": "\"Гражданский кодекс Российской Федерации (часть вторая)\" от 26.01.1996 N 14-ФЗ (ред. от 24.06.2025, с изм. от 09.06.2026)",
      "full_text_verified": true,
      "conclusion": "Противоречия нет. Форма не говорит о праве заказчика менять документацию в пределах десяти процентов (п. 1) и о праве подрядчика требовать пересмотра сметы (п. 3). Цена определяется расчётом 07 и предложением допсоглашения 11, то есть отдельным соглашением сторон, и это согласуется с п. 2 о согласованной дополнительной смете. Расчёт 07 форма называет расчётом и согласованной сметой его не объявляет."
    },
