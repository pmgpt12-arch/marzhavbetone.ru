# Готовность продаваемых товаров к трафику — единственный список статусов,
# который читает код сайта.
#
# Потребитель один: tools/build_upsell.py. Блок «что дальше» на success.html
# не ведёт в товар со статусом RED или BLOCKED — вместо него покупатель
# получает нейтральный шаг из своего же 00-START-HERE.txt (раздел «Другая
# ситуация на объекте», диагностика).
#
# Статусы взяты из аудита MB001 без пересмотра: отчёт
# docs/reports/MB001_COMMERCIAL_JOURNEY_ROADMAP.md, редакция 2 от 30.09.2026,
# раздел 4 (ветка claude/marzhavbetone-customer-journey-audit-u58x43, коммит
# 8576587, база сайта 64b210e).
#
#   GREEN   — можно вести трафик;
#   AMBER   — ограниченный трафик, риск назван;
#   RED     — нельзя вести трафик до исправления;
#   BLOCKED — зависит от PR, перечита Р-026 или решения владельца.
#
# Статус меняет тот, кто закрыл названный разрыв, со ссылкой на PR, и в том
# же коммите запускает `python3 tools/build_upsell.py --write`. Забытая
# пересборка ловится tools/test_commercial_journey.py (G-06).
#
# Товар, которого здесь нет, сборщик не примет: статус без названия хуже,
# чем остановка сборки.
