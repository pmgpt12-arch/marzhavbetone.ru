# Пилотное исследование. Вопрос ставится первым, выборка — потом (§6, §53).
#
# Ни одного числа в этом файле нет и до сбора не появится. Файл фиксирует,
# что именно считается и по каким правилам отбора, чтобы результат нельзя
# было подогнать задним числом выбором дел.

research_id: dopolnitelnye-raboty
version: v1
status: planned          # planned → collecting → auditing → published

research_question: >
  Какие доказательства чаще всего определяют исход спора об оплате
  дополнительных строительных работ?

hypothesis: >
  Доказанная письменная фиксация поручения до начала работ связана с
  исходом спора сильнее, чем факт выполнения работ и их использование
  заказчиком. Гипотеза может не подтвердиться — это допустимый результат.

money_cluster: MI-3

business_relevance: >
  Кластер закрыт комплектом p2 «Дополнительные работы: как получить
  оплату» и бесплатным материалом materialy/dop-raboty.html. Вывод
  исследования меняет состав документов комплекта и алгоритм на странице,
  а не только текст статьи.

selection_criteria:
  - спор о взыскании оплаты дополнительных работ по договору подряда
    или субподряда между юридическими лицами
  - работы строительные или связанные со строительством
  - решение вынесено арбитражным судом Российской Федерации
  - в тексте акта установлено, было ли поручение оформлено письменно

exclusion_criteria:
  - государственные и муниципальные контракты — там свой режим
    согласования, смешивать с обычным подрядом нельзя
  - споры с физическими лицами
  - дела, где предмет спора — качество, а не оплата допработ
  - акты без мотивировочной части
  - дела, отменённые вышестоящей инстанцией, — учитывается акт,
    вступивший в силу

period:
  from: not_set          # заполняется при сборе, не задним числом
  to: not_set

minimum_sample: 30       # ниже — уверенность не выше MEDIUM (rules.yaml)

# Инстанции не смешиваются в одну статистику: это отдельная переменная,
# а не деталь. Смешение — один из дефектов, которые ловит research-auditor.
variables:
  - письменное поручение заказчика до начала работ
  - дополнительное соглашение
  - переписка сторон
  - общий журнал работ
  - подписанная КС-2 на спорный объём
  - фактическое использование результата заказчиком
  - уведомление о необходимости допработ
  - согласование стоимости
  - необходимость работ для завершения основных
  - возможность приостановить основные работы
  - судебная экспертиза
  - позиция заказчика в процессе
  - инстанция
  - исход спора

primary_sources:
  - класс SOURCE_B: тексты судебных актов арбитражных судов
  - класс SOURCE_A: нормы ГК РФ, на которые ссылаются акты

limitations:
  - выборка не является случайной: она ограничена доступной публикации
  - опубликованные акты смещены в сторону обжалованных споров
  - формулировка «письменное поручение установлено» берётся из текста
    акта, а не из первичных документов дела
  - вывод описывает связь, а не причину

# Знаменатель объявляется до расчёта. Значение subset разрешено только для
# утверждения о самой подвыборке — см. разобранный пример в rules.yaml.
denominator_scope: full_sample

# Ни одного числа до сбора и до прогона research-auditor.
results: not_collected
