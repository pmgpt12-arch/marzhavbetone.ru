# Озвучка ролика 10. Номер статьи проговаривается словами.
provider: openrouter
model: openai/gpt-audio-mini
voice: onyx
direction: >
  Спокойно и уверенно, в темпе делового объяснения. Без нажима и без
  рекламной интонации.
items:
  - id: 10-vernem-posle-raschetov
    text: >
      Работы сданы, акт подписан, деньги пришли не все. В договоре
      написано: вернём после расчётов с заказчиком. Даты в этой строке нет.
      А событие, которое может не наступить, сроком не является — это
      статья сто девяносто Гражданского кодекса. Спор начинается здесь, а
      не через два года. Проверьте своё условие о возврате. Ссылка в
      профиле.
