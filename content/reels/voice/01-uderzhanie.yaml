# Озвучка ролика 1 — гарантийное удержание.
#
# Прогон: python3 ../ai-business-os/tools/generate_voiceover.py \
#     content/reels/voice/01-uderzhanie.yaml --out <каталог>
#
# Голос следует экранным тезисам и не добавляет новых утверждений.
# Формулировки согласованы с финальным сценарием Reel 1.
provider: openrouter
model: openai/gpt-audio-mini
voice: onyx
direction: >
  Спокойно и уверенно, в темпе делового объяснения. Без нажима, без
  дикторского пафоса и без рекламной интонации. Так говорит человек,
  который объясняет коллеге, где тот теряет деньги.
items:
  - id: 01-uderzhanie
    text: >
      У вас удерживают пять–десять процентов с акта?
      Закрыли работ на сто миллионов — пять–десять миллионов в удержании.
      Банку — шестнадцать–двадцать процентов годовых,
      поставщикам — три–четыре процента в месяц.
      Заказчик пользуется вашими деньгами бесплатно.
      Возврат часто привязан к вводу объекта и дополнительному сроку.
      Как не кредитовать заказчика бесплатно — ссылка в профиле.