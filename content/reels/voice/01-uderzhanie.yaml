# Озвучка ролика 1 — гарантийное удержание.
#
# Прогон: python3 ../ai-business-os/tools/generate_voiceover.py \
#     content/reels/voice/01-uderzhanie.yaml --out <каталог>
#
# Текст не повторяет надписи дословно и не добавляет к ним ничего нового:
# на экране тезис, голосом — та же мысль связной речью. Расхождение между
# сказанным и написанным в юридической теме дороже, чем польза от вариации.
#
# Числа — из разбора, на котором сделан ролик. Придуманная сумма в озвучке
# это утверждение о деле, которого не было.
provider: openrouter
model: openai/gpt-audio-mini
voice: onyx
direction: >
  Спокойно и уверенно, в темпе делового объяснения. Без нажима, без
  дикторского пафоса и без рекламной интонации. Так говорит человек,
  который объясняет коллеге, где тот теряет деньги.
items:
  - id: 01-uderzhanie
    text: >
      Девяносто процентов подрядчиков сами дарят генподрядчику миллионы.
      Вы закрыли объект на сто миллионов. Он подписал КС-2 и заплатил
      девяносто пять. Остальные пять — гарантийное удержание. Вернут через
      два года, если он ещё существует. Два года под ноль процентов.
      Проверьте своё условие о возврате. Ссылка в профиле.
