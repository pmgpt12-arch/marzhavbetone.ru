# Озвучка пилота V2 — допработы по устной команде.
#
# Текст написан по надписям готовой сборки, а не наоборот: правило
# появилось после ролика 2, где голос говорил «приостановлен», а экран —
# «расторгаем», то есть называл другое условие договора.
#
# Номер статьи проговаривается словами: «семьсот сорок три» модель читает
# верно, «743» она произносит как придётся.
#
# Правка 16.08.2026 по нормативной сверке. Было «лишился права требовать
# оплаты» — норма лишает права требовать оплаты **дополнительных** работ, и
# без ограничения фраза читается как утрата права на оплату по договору
# вообще. Добавлена и вторая половина обязанности п. 3: нет ответа десять
# дней — работы приостанавливают. Прежний текст давал «написал и работай
# дальше».
provider: openrouter
model: openai/gpt-audio-mini
voice: onyx
direction: >
  Спокойно и уверенно, в темпе делового объяснения. Без нажима, без
  дикторского пафоса и без рекламной интонации. Так говорит человек,
  который объясняет коллеге, где тот теряет деньги.
items:
  - id: 07-dopraboty
    text: >
      «Делайте, потом оформим» — это не документ. Объём есть в бетоне, а в
      документах его нет. Спор распадается на пять вопросов, и ответ на
      один не закрывает остальные. Пункты три и четыре статьи семьсот
      сорок три Гражданского кодекса: не сообщил заказчику о работах, не
      учтённых в документации, — лишился права требовать оплаты допработ.
      Записка с отметкой о вручении, а нет ответа десять дней — работы
      приостановить. Проверьте пять строк. Ссылка в профиле.
