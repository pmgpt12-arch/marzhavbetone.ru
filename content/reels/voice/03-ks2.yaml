# Озвучка ролика 3 — подписанная КС-2 без оплаты.
provider: openrouter
model: openai/gpt-audio-mini
voice: onyx
direction: >
  Спокойно и уверенно, в темпе делового объяснения. Без нажима, без
  дикторского пафоса и без рекламной интонации. Так говорит человек,
  который объясняет коллеге, где тот теряет деньги.
items:
  - id: 03-ks2
    text: >
      Документ на восемь миллионов. Подписан обеими сторонами. Денег нет
      уже полгода. В договоре одна строка: оплата после получения средств
      от заказчика. Заказчик не платит ему — он не платит вам. И по
      договору это законно. Подпись не решает, когда заплатят. Проверьте
      эту строку до первого КС.
