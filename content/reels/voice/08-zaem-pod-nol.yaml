# Озвучка ролика 8, редакция 17.08.2026.
#
# Правило, появившееся из отказа владельца: голос НЕ читает надписи. На
# экране короткие удары в два-четыре слова, голос ведёт историю связной
# речью. В первой редакции текст почти дословно повторял экран — отсюда и
# лекционное ощущение.
provider: openrouter
model: openai/gpt-audio-mini
voice: onyx
direction: >
  Разговорный темп, как будто объясняешь коллеге в бытовке. Короткие
  фразы, без дикторского пафоса и без рекламной интонации. Первую фразу
  подать как возражение, а не как заголовок.
items:
  - id: 08-zaem-pod-nol
    text: >
      Вы думаете, что дали скидку. Вы дали кредит. Пять процентов с каждого
      акта генподрядчик не платит и держит у себя. Деньги ваши, их обязаны
      вернуть, но работают они на него. Процентов вам никто не начислит.
      Откройте договор: к какому событию привязан возврат. Напишите в
      директ слово удержание — пришлю проверочный лист.
