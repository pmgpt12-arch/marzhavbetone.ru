# Озвучка ролика 8. Текст написан по надписям сборки, а не наоборот.
provider: openrouter
model: openai/gpt-audio-mini
voice: onyx
direction: >
  Спокойно и уверенно, в темпе делового объяснения. Без нажима и без
  рекламной интонации. Так говорит человек, который объясняет коллеге,
  где тот теряет деньги.
items:
  - id: 08-zaem-pod-nol
    text: >
      Пять процентов удержания — это не скидка. Это заём, который вы дали
      генподрядчику под ноль процентов. Строку про удержание вы подписали
      сами. Деньги остаются вашими, но лежат у него. Тело вернут, а платите
      вы временем. Проверьте своё условие о возврате. Ссылка в профиле.
