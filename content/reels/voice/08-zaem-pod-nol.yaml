# Озвучка ролика 8, редакция 23.08.2026 под выбранную механику.
#
# Правило, появившееся из отказа владельца: голос НЕ читает надписи. После
# правки крючка это стало строже прежнего — на экране теперь пара
# «В договоре: … / На деле: …», и ни одна её половина в голосе не звучит
# дословно. Экран держит конфликт, голос ведёт связную речь.
#
# Снято слово «заём» из озвучки: оно ушло на экран во вторую сцену, и
# повтор превратил бы переворот в подпись к самому себе.
provider: openrouter
model: openai/gpt-audio-mini
voice: onyx
direction: 'Разговорный темп, как будто объясняешь коллеге в бытовке. Короткие фразы,
  без дикторского пафоса и без рекламной интонации. Первую фразу подать как возражение,
  а не как заголовок.

  '
items:
- id: 08-zaem-pod-nol
  text: С каждого закрытого акта вам отдают не всю сумму. Условие это вы подписали
    сами, и пока идёт гарантия, ваши деньги работают у генподрядчика. Работы приняты,
    а часть оплаты нет. Возврат привязан не к дате, а к событию из договора — найдите
    это событие у себя. Напишите в директ слово удержание, пришлю проверочный лист.
