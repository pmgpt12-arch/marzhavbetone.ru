# Озвучка ролика 2 — аванс как крючок.
#
# Голос и указание диктору те же, что у ролика 1: канал узнаётся по
# интонации не меньше, чем по картинке, и менять их от ролика к ролику
# значит каждый раз начинать знакомство заново.
provider: openrouter
model: openai/gpt-audio-mini
voice: onyx
direction: >
  Спокойно и уверенно, в темпе делового объяснения. Без нажима, без
  дикторского пафоса и без рекламной интонации. Так говорит человек,
  который объясняет коллеге, где тот теряет деньги.
items:
  # Первая редакция говорила «объект приостановлен» и «аванс возвращается,
  # если работы не выполнены», тогда как на экране стоит «Расторгаем» и
  # «при расторжении по любому основанию». Расхождение поймано просмотром
  # готовой сборки. В юридической теме это не вариация формулировки, а два
  # разных условия договора: приостановка и расторжение наступают от разных
  # событий, и возврат по любому основанию — сильно жёстче, чем возврат за
  # невыполненные работы. Голос теперь повторяет условие с экрана.
  - id: 02-avans
    text: >
      Аванс пять миллионов — это не ваши деньги. Вы купили материал,
      вывели бригаду, оплатили аренду. Через два месяца приходит письмо:
      расторгаем, верните аванс за пять дней. А в договоре — аванс
      возвращается при расторжении по любому основанию. Минус пять
      миллионов. Он потратил ноль. Проверьте три условия договора. Ссылка
      в профиле.
