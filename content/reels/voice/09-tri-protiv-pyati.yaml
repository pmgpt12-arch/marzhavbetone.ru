# Озвучка ролика 9. Оба процента — из разбора, третьего числа нет.
provider: openrouter
model: openai/gpt-audio-mini
voice: onyx
direction: >
  Спокойно и уверенно, в темпе делового объяснения. Без нажима и без
  рекламной интонации.
items:
  - id: 09-tri-protiv-pyati
    text: >
      Норма рынка — три процента. В вашем договоре — пять. Эту строку никто
      не оспаривал, потому что её никто не читал до подписи. Разница не в
      двух процентах, а в том, что размер удержания и событие возврата вы
      согласовали не глядя. Проверьте своё условие о возврате. Ссылка в
      профиле.
