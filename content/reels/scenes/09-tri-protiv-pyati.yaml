# План сцен ролика 9. Счётчик здесь несёт содержание, а не украшает.
voice: 09-tri-protiv-pyati
scenes:
  - id: hook
    composition: HookScene
    seconds: 2
    props:
      hookText: "Норма рынка — 3%. У вас 5"
      highlightWords: ["5"]
      subtitle: ""
      dimAmount: 0.65

  - id: stroka
    composition: PhotoStatementScene
    seconds: 5
    props:
      image: r-procenty-dogovor.png
      text: "Эту строку никто не оспаривал"
      highlightWords: ["никто"]
      anchor: bottom
      dimAmount: 0.5
      zoom: in
      align: center

  - id: schetchik
    composition: MoneyCounterScene
    seconds: 5
    props:
      label: "Норма рынка"
      targetAmount: 3
      suffix: "%"
      countDurationSec: 2
      subtitle: "в вашем договоре — 5"

  - id: proverit
    composition: MarkerListScene
    seconds: 4
    props:
      title: "Проверить два поля"
      framesPerItem: 45
      items:
        - text: "Размер удержания"
          icon: "1"
        - text: "Событие возврата"
          icon: "2"

  - id: cta
    composition: CTAScene
    seconds: 4
    props:
      ctaText: "Проверьте своё условие"
      channelName: "Ссылка в профиле"
      subText: "Бесплатно: проверочный лист по удержанию"
