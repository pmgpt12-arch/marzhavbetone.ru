# Список сцен пилота V2 — допработы по устной команде.
#
# Формат отличается от shots/*.yaml намеренно. Там план — это набор
# картинок под панораму, и он же был причиной запрета: ролик из одинаково
# снятых кадров читается автонарезкой. Здесь план — последовательность
# сцен, у каждой свой способ сборки и своя функция в ролике.
#
# Собирается прогоном:
#     python3 tools/build_reel_v2.py content/reels/scenes/07-dopraboty.yaml \
#         --voice <файл.wav> --out media/07-dopraboty.mp4
voice: 07-dopraboty
scenes:
  # HOOK. Ни объекта, ни людей: первые полсекунды не тратятся на
  # разглядывание картинки, зритель сразу читает фразу.
  - id: hook
    composition: HookScene
    seconds: 3
    props:
      hookText: "«Делайте, потом оформим». Это не документ"
      highlightWords: ["не"]
      subtitle: ""
      dimAmount: 0.6

  # PROBLEM. Кадр снят под сцену: объём физически есть, документов рядом нет.
  - id: obyom
    composition: PhotoStatementScene
    seconds: 6
    props:
      image: 07-scene2-obyom.png
      text: "Объём есть в бетоне. В документах его нет"
      highlightWords: ["бетоне"]
      anchor: top
      dimAmount: 0.5
      zoom: in

  # EVIDENCE. Пять строк спора появляются по одной — это и есть содержание
  # разбора, а не украшение. Значки словами: эмодзи в проекте нет нигде.
  - id: pyat-strok
    composition: MarkerListScene
    seconds: 7
    props:
      title: "Спор распадается на пять вопросов"
      framesPerItem: 40
      items:
        - text: "Работы выполнены"
          icon: "1"
        - text: "Объём вне договора"
          icon: "2"
        - text: "Заказчик поручил"
          icon: "3"
        - text: "Поручавший мог обязывать"
          icon: "4"
        - text: "Стоимость подтверждена"
          icon: "5"

  # CONSEQUENCE. Норма показывается документом, а не текстом на пустом фоне.
  - id: statya
    composition: PhotoStatementScene
    seconds: 4
    props:
      image: 07-scene4-statya.png
      text: "Не сообщил — лишился права требовать оплаты допработ"
      highlightWords: ["допработ"]
      anchor: bottom
      dimAmount: 0.5
      zoom: out

  # SOLUTION. Два действия, которые оставляют след до начала работ.
  - id: chto-delat
    composition: MarkerListScene
    seconds: 4
    props:
      title: "Что оставить до начала работ"
      framesPerItem: 45
      items:
        - text: "Записка с отметкой о вручении"
          icon: "1"
        - text: "Нет ответа 10 дней — работы стоп"
          icon: "2"

  # CTA. Одно действие и место, где оно делается.
  - id: cta
    composition: CTAScene
    seconds: 4
    props:
      ctaText: "Проверьте пять строк"
      channelName: "Ссылка в профиле"
      subText: "Бесплатный разбор: что зафиксировать до начала работ"
