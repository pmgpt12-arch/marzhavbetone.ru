# План сцен ролика 10. Мини-сюжет: сдал — удержали — даты нет.
voice: 10-vernem-posle-raschetov
scenes:
  - id: hook
    composition: HookScene
    seconds: 2
    props:
      hookText: "«Вернём после расчётов с заказчиком»"
      highlightWords: ["заказчиком»"]
      subtitle: ""
      dimAmount: 0.65

  - id: perepiska
    composition: PhotoStatementScene
    seconds: 5
    props:
      image: r-perepiska-telefon.png
      text: "Работы сданы. Деньги пришли не все"
      highlightWords: ["не"]
      anchor: top
      dimAmount: 0.55
      zoom: in
      align: center

  - id: kalendar
    composition: PhotoStatementScene
    seconds: 6
    props:
      image: r-kalendar-bez-daty.png
      text: "Даты в договоре нет"
      highlightWords: ["нет"]
      anchor: top
      dimAmount: 0.5
      zoom: out
      align: center

  - id: pochemu
    composition: MarkerListScene
    seconds: 6
    props:
      title: "Почему это не срок"
      framesPerItem: 60
      items:
        - text: "Событие может не наступить"
          icon: "1"
        - text: "Ст. 190 ГК РФ"
          icon: "2"

  - id: cta
    composition: CTAScene
    seconds: 4
    props:
      ctaText: "Проверьте своё условие"
      channelName: "Ссылка в профиле"
      subText: "Бесплатно: проверочный лист по удержанию"
