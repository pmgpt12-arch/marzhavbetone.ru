      text: 'Юлия открыла свой бизнес, начала зарабатывать и перестала зависеть от
        него финансово.


        И бывший муж заставил ее закрыть свой бизнес.


        Потому что пока у неё не было своих денег - ею было легко манипулировать.
        А как только появилась независимость - контроль начал ускользать. Получается,
        в любой момент она могла уйти)


        Запомните, мужчины всегда в браке/во время развода манипулируют двумя составляющими
        - ДЕТИ И ДЕНЬГИ!


        Если вы сталкиваетесь с подобным и думаете о разводе - у меня есть пошаговая
        инструкция, что нужно сделать ещё до того, как вы сообщите мужу об этом решении.


        Пишите в комментариях «развод» и я вам ее пришлю 🙏🏽'
