      text_translation: "Husband and wife have a land plot for two with a house 12\U0001F34B\
        \ ке and an apartment 22\U0001F34B . - were purchased in marriage.\n\nA man\
        \ came to me for a consultation, where I looked at the documents [complicated\
        \ by partly the absence of documents] and said honestly that the apartment\
        \ is likely to be gotten to his wife and the house could be divided in half,\
        \ but I will try to do everything possible and impossible.\n\nMy worldwide\
        \ confidant wanted to leave an expensive real estate object to his wife, but\
        \ she refused. She wanted to recognize all her property as her personal property.\n\
        \n [жадность фраера погубит] \n\n Бывшая жена ОБМАННЫМ путем хотела завладеть\
        \ всей недвижимостью. Она подготовила ПОДДЕЛЬНЫЕ документы (договор и расписку)\
        \ для признания имущества своим личным\U0001F631 \n\nAfter analyzing the documents\
        \ submitted by the respondent, I found a mismatch in dates, sums, logic, etc.\
        \ д.\n\nAnd announced a petition for the appointment of forensic and technical\
        \ expertise. As well as a statement on the substitution of evidence in our\
        \ other joint process.\n\n\U0001F525 At the final meeting, we provided powerful\
        \ written explanations that legally grounded our arguments and pointed the\
        \ court to the defendant's lies.\n\nAs a result, instead of one expensive\
        \ real estate object, it has half of each object √ How do you like the story?"
