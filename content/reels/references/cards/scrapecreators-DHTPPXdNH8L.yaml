      text: "У мужа с женой на двоих земельный участок с домом 12\U0001F34B₽ и квартира\
        \ 22\U0001F34B₽ - приобретены в браке.\n\nКо мне обратился мужчина на консультацию,\
        \ где я посмотрела документы [осложнялось частичным отсутствием документов]\
        \ и честно сказала, что скорее всего, квартира достанется жене, а дом можно\
        \ поделить пополам, но я постараюсь сделать всё возможное и невозможное. \n\
        \nМой доверитель по мировому хотел оставить дорогой объект недвижимости супруге,\
        \ но она отказалась. Она же хотела признать все имущество своей личной собственностью.\
        \ \n\n[жадность фраера погубит]\n\nБывшая жена ОБМАННЫМ путем хотела завладеть\
        \ всей недвижимостью. Она подготовила ПОДДЕЛЬНЫЕ документы (договор и расписку)\
        \ для признания имущества своим личным\U0001F631\n\nЯ, проанализировав представленные\
        \ ответчиком  документы, выявила несоответствие по датам, суммам, логике и\
        \ т.д. \n\nИ заявила ходатайство о назначении судебно-технической экспертизы.\
        \ А также заявление о подложности доказательств в другом нашем совместном\
        \ процессе.\n\n\U0001F525На финальное заседание мы предоставили мощные письменные\
        \ пояснения, в которых юридически обосновали наши доводы и указали суду на\
        \ ложь ответчика.\n\nПо итогу, вместо одного дорогого объекта недвижимости,\
        \ у неё половинка каждого объекта \U0001F90F Как вам история?"
