# Планы ролика 1 — гарантийное удержание.
#
# Длительности совпадают с таймингом сценария 01-uderzhanie-5-millionov.md
# (3 + 4 + 5 + 5 + 2 + 3 = 22 с). Расхождение здесь тихо рассинхронизирует
# текст с картинкой, поэтому тайминг берётся из сценария, а не наоборот.
#
# Кадры — готовые обложки разборов. Они уже выдержаны в одном визуальном
# языке, и зритель, дойдя по ссылке до статьи, увидит ту же картинку.
shots:
  # Крючок: обвинение большинства. Кадр про удержание внутри КС-2.
  - image: assets/garantiynoe-uderzhanie-v-ks-2-i-ks-3.jpg
    seconds: 3
    pan: right

  # «Вы закрыли объект на 100 миллионов» — сданный объём за спиной.
  #
  # Здесь стояла priemka.jpg, а ниже uderzhanie.jpg — обе сняты после
  # просмотра сборки: это минималистичные натюрморты на сером фоне, и
  # рядом с закатной стройкой они читаются как вставка из другого ролика.
  # Ровно этот случай назван в content/reels/style.md: за основу берётся
  # кинематографичный язык, а не предметная съёмка.
  - image: assets/genpodryadchik-zarabatyvaet-na-vas.jpg
    seconds: 4
    pan: left

  # «Подписал КС-2 и заплатил 95» — подпись и печать на документе.
  - image: assets/podpisannaya-ks2-ne-znachit-chto-zaplatyat.jpg
    seconds: 5
    pan: right

  # «Вернут через два года» — про срок.
  - image: assets/srok-garantiynogo-uderzhaniya.jpg
    seconds: 4
    pan: left

  # «Два года под 0%» — короткий удар, короткий план.
  - image: assets/garantiynoe-uderzhanie-chto-eto.jpg
    seconds: 3
    pan: right

  # Финал: действие. Кадр с усилием — человек тянет затвор.
  - image: assets/vozvrat-garantiynogo-uderzhaniya.jpg
    seconds: 3
    pan: left
