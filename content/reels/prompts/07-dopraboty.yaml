# Кадры под сцены пилота V2 — допработы без соглашения.
#
# Обложек разборов здесь нет ни одной: V2 запрещает собирать ролик из
# готовых картинок сайта. Каждый кадр снимается под свою сцену и должен
# объяснять ровно её мысль.
#
# Закатов, касок крупным планом и корпоративного стока нет намеренно —
# они названы в решении владельца 16.08.2026 как признак массовой
# заготовки. Свет здесь рабочий: пасмурный день, лампа над столом.
models:
  - google/gemini-3.1-flash-image
  - google/gemini-2.5-flash-image
image_config:
  aspect_ratio: "9:16"
style: >
  Документальная съёмка российской стройки и рабочих документов.
  Естественный неяркий свет пасмурного дня или лампы над столом, без
  контрового солнца и без закатов. Приглушённая палитра: бетон, сталь,
  бумага, серо-синие тона. Реалистичные фактуры и правдоподобные бумаги.
  Никаких людей в кадре анфас, никаких логотипов и читаемых названий
  организаций. Кадр вертикальный, композиция оставляет свободное место
  слева под надпись.
items:
  - id: 07-scene2-obyom
    headline: ""
    prompt: >
      Свежая траншея на строительной площадке с дополнительным слоем
      щебня, рядом брошенная лопата и рулетка на бетонной плите. Следы
      техники в грязи, пасмурный день. Объём работ виден физически, но
      никаких документов рядом нет. Пустое пространство слева сверху.

  - id: 07-scene4-statya
    headline: ""
    prompt: >
      Крупный план раскрытого бумажного тома с плотным текстом на
      русском языке, на столе прораба под настольной лампой. Поверх лежит
      простой карандаш. Бумага чуть смята и запачкана по краю, как
      документ с объекта, а не из офиса. Строки текста мелкие и не
      читаются разборчиво. В кадре нет обложек, корешков и любых
      надписей крупным кеглем: название документа не должно читаться
      вовсе. Свободное место слева.
