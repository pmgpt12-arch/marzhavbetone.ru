# Кадры под сцены трёх новых роликов об удержании.
#
# Обложек разборов нет ни одной: именно они сделали первые три ролика
# похожими на автонарезку. Каждый кадр снимается под свою сцену.
#
# Чего здесь нет намеренно: закатов, касок крупным планом, панорам стройки
# «вообще», корпоративного стока. Свет рабочий — пасмурный день, лампа,
# экран телефона. Текст ложится по центру, поэтому композиция оставляет
# середину кадра спокойной, а предмет уводится вниз или вверх.
models:
  - google/gemini-3.1-flash-image
  - google/gemini-2.5-flash-image
image_config:
  aspect_ratio: "9:16"
style: >
  Документальная съёмка российской стройки и рабочих документов, вертикальный
  кадр. Естественный неяркий свет: пасмурный день, настольная лампа, свет
  экрана. Приглушённая палитра — бетон, сталь, бумага, серо-синие тона.
  Реалистичные фактуры, правдоподобные бумаги, текст мелкий и неразборчивый.
  Без лиц, без логотипов, без читаемых названий организаций. Середина кадра
  спокойная, смысловой предмет смещён вниз или вверх.
items:
  - id: r-dogovor-uderzhanie
    headline: ""
    prompt: >
      Крупный план страницы договора на столе прораба, лежит поверх стопки
      бумаг. По одной строке идёт жёлтый маркер, оставляя яркий след. Рядом
      простая шариковая ручка и кружка. Свет настольной лампы сбоку.
      Верхняя треть кадра — спокойный тёмный фон стола.

  - id: r-dengi-pod-zamkom
    headline: ""
    prompt: >
      Пачки российских рублей лежат внутри старого металлического ящика с
      навесным замком, ящик приоткрыт. Стоит на бетонном полу вагончика,
      вокруг строительная пыль. Холодный дневной свет из окна сбоку.
      Середина кадра — тёмное пространство над ящиком.

  - id: r-procenty-dogovor
    headline: ""
    prompt: >
      Очень крупный план фрагмента печатного договора, видны только строки
      с процентами и цифрами, конкретные слова не читаются. Бумага чуть
      смята, по краю след от пальца в бетонной пыли. Палец в рабочей
      перчатке придерживает лист снизу. Нейтральный дневной свет.

  - id: r-perepiska-telefon
    headline: ""
    prompt: >
      Экран смартфона в руке в рабочей перчатке, на экране переписка в
      мессенджере — пузыри сообщений, текст мелкий и неразборчивый.
      Фон — расфокусированный строительный вагончик изнутри, стол с
      бумагами. Свет экрана на перчатке, вечер, лампа выключена.

  - id: r-kalendar-bez-daty
    headline: ""
    prompt: >
      Настенный производственный календарь в строительном вагончике,
      квадраты дней пустые, ни одной отметки и ни одного обведённого числа.
      Рядом на гвозде висит рулетка. Пасмурный свет из окна, пыльное стекло.
      Нижняя треть кадра — спокойная стена.
